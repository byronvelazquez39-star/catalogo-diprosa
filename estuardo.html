<div class="mb-3 p-2 bg-dark rounded border border-secondary">
  <!-- Nombre Cliente / Tienda -->
  <div class="mb-2">
    <label for="nombreCliente" class="form-label text-light fw-bold" style="font-size: 13px;">Nombre Cliente / Tienda:</label>
    <input type="text" id="nombreCliente" class="form-control form-control-sm bg-black text-light border-secondary" placeholder="Ej. Tienda La Abuelita">
  </div>

  <!-- No. de Ticket Manual -->
  <div class="mb-2">
    <label for="noTicket" class="form-label text-light fw-bold" style="font-size: 13px;">No. de Ticket (Manual):</label>
    <input type="text" id="noTicket" class="form-control form-control-sm bg-black text-light border-secondary" placeholder="Ej. 00016967">
  </div>

  <!-- Ubicación / Referencia -->
  <div class="mb-1">
    <label for="ubicacionTienda" class="form-label text-light fw-bold" style="font-size: 13px;">Ubicación / Referencia:</label>
    <input type="text" id="ubicacionTienda" class="form-control form-control-sm bg-black text-light border-secondary" placeholder="Ej. Casa color rojo mano izquierda">
  </div>
</div>
