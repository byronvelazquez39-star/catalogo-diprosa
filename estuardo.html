<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo DIPROSA - Estuardo</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 10px; padding-bottom: 80px; box-sizing: border-box; }
    .header-bar { background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #333; margin-bottom: 10px; text-align: center; }
    h1 { margin: 0; font-size: 16px; color: #ff9800; }
    .search-box { width: 100%; padding: 10px; font-size: 14px; margin-bottom: 10px; border: 1px solid #ff9800; border-radius: 6px; background: #1a1a1a; color: #fff; box-sizing: border-box; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .card { background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
    .nombre { font-size: 12px; font-weight: bold; margin-bottom: 6px; }
    .precio { font-size: 14px; color: #27ae60; font-weight: bold; margin-bottom: 8px; }
    .btn-add { background-color: #27ae60; color: white; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 12px; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 2px solid #333; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
    .cart-total { font-size: 16px; color: #27ae60; font-weight: bold; }
    .btn-wa { background-color: #25d366; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
