<body class="bg-dark text-light">

    <div class="container mt-4">
        <h2 class="text-center mb-4">CATÁLOGO DIPROSA - ESTUARDO</h2>
        
        <!-- Sección del Carrito y Pedido -->
        <div class="card bg-black text-light p-3 border-secondary">

            <div id="listaCarrito">

            <hr class="border-secondary">

            <!-- CAMPOS NUEVOS EN EL CARRITO -->
            <div class="mb-3">
              <label for="nombreCliente" class="form-label text-light fw-bold">Nombre Cliente / Tienda:</label>
              <input type="text" id="nombreCliente" class="form-control bg-dark text-light border-secondary" placeholder="Ej. Tienda La Abuelita">
            </div>

            <div class="mb-3">
              <label for="noTicket" class="form-label text-light fw-bold">No. de Ticket (Manual):</label>
              <input type="text" id="noTicket" class="form-control bg-dark text-light border-secondary" placeholder="Ej. 00016967">
            </div>

            <div class="mb-3">
              <label for="ubicacionTienda" class="form-label text-light fw-bold">Ubicación / Referencia:</label>
              <input type="text" id="ubicacionTienda" class="form-control bg-dark text-light border-secondary" placeholder="Ej. Casa color rojo mano izquierda">
            </div>

            <!-- Botones de Acción -->
            <button class="btn btn-primary w-100 mb-2" onclick="imprimirReciboTermico()">🖨️ Imprimir Recibo Térmico</button>
        </div>
    </div>
