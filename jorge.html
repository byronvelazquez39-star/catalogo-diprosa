        body {

            background-color: #000000;

        }
        .header-top {
            display: flex;

        }

            outline: none;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
