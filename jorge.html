<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Jorge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 10px auto;
        }
        .header-top h2 {
            color: #ff9800;
            margin: 0;
            font-size: 1.1em;
        }
        .header-btns {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background-color: #121212;
            color: #ff9800;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #121212;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
        .card {
            background-color: #0a0a0a;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #222;
        }
        .card h3 {
            font-size: 0.85em;
            margin: 0 0 8px 0;
            color: #ffffff;
            line-height: 1.3;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.05em;
            margin: 0 0 8px 0;
        }
        .btn-agregar {
            background-color: #008000;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #000000;
            border-top: 2px solid #222;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.85em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #008000;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            border: none;
        }

        /* MODAL IDENTICO AL ORIGINAL DE ELEAZAR */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 16px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            color: white;
            font-size: 0.85em;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.95);
            max-height: 92vh;
            overflow-y: auto;
        }
        .modal-title {
            font-weight: bold;
            font-size: 1.15em;
            text-align: center;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .modal-subtitle {
            color: #3b82f6;
            font-size: 0.78em;
            text-align: center;
            margin-bottom: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .contenedor-principal {
            background-color: #040814;
            border: 1px solid #101d36;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .caja-detalle {
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 8px;
            background-color: rgba(15, 23, 42, 0.6);
        }
        .caja-detalle.azul {
            border-color: #1d4ed8;
            background-color: rgba(30, 58, 138, 0.2);
        }
        .caja-detalle.roja {
            border-color: #b91c1c;
            background-color: rgba(127, 29, 29, 0.2);
        }
        .caja-detalle.verde {
            border-color: #15803d;
            background-color: rgba(20, 83, 45, 0.2);
        }
        .caja-detalle.naranja {
            border-color: #c2410c;
            background-color: rgba(124, 45, 18, 0.2);
        }
        .fila-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 3px 0;
        }
        .btn-accion-cerrar {
            background: #262626;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.9em;
        }
        .btn-accion-reporte {
            background: #008000;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>📦 JORGE (VENDEDOR)</h2>
        <div class="header-btns">
            <button type="button" onclick="mostrarMetas()" class="mini-btn">📊 Metas</button>
            <button type="button" onclick="mostrarSueldo()" class="mini-btn">💰 Sueldo</button>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="🔍 Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando catálogo completo...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <button onclick="enviarPedidoAdmin()" class="ver-ticket-btn">
            📋 Ver Ticket
        </button>
    </div>

    <!-- MODAL -->
    <div id="modal-info" class="modal-overlay">
        <div class="modal-box" id="modal-box-body"></div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1yRkOiPyX6hEnIhtuQarQXWXkPPTD65jS/export?format=csv&gid=1578551749';
        const FIREBASE_URL = 'https://diprosa-ventas-default-rtdb.firebaseio.com/ventas/JORGE.json';
        
        let productos = [];
        let carrito = {};

        async function cargarProductos() {
            try {
                const respuesta = await fetch(SHEET_URL);
                const datos = await respuesta.text();
                parsearCSV(datos);
            } catch (error) {
                document.getElementById('catalogo-grid').innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">Error de conexión.</p>';
            }
        }

        function parsearCSV(texto) {
            const lineas = texto.split('\n');
            productos = [];
            let vistos = new Set();
            
            for (let i = 0; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    let descripcion = columnas[2] ? columnas[2].replace(/"/g, '').trim() : '';
                    
                    if (descripcion && 
                        descripcion.toLowerCase() !== 'detalle' &&
                        !descripcion.toLowerCase().includes('descripcion') && 
                        !descripcion.toLowerCase().includes('producto') && 
                        !descripcion.includes('{') && 
                        !descripcion.includes('function') && 
                        descripcion.length > 2) {
                        
                        if (vistos.has(descripcion)) continue;
                        vistos.add(descripcion);

                        let precioNum = 0.00;
                        
                        if (columnas[3] && columnas[3].trim()) {
                            let matchCol = columnas[3].replace(/"/g, '').replace('Q', '').trim();
                            let parsed = parseFloat(matchCol);
                            if (!isNaN(parsed) && parsed > 0) precioNum = parsed;
                        }
                        
                        if (precioNum === 0 && columnas[4] && columnas[4].trim()) {
                            let matchCol = columnas[4].replace(/"/g, '').replace('Q', '').trim();
                            let parsed = parseFloat(matchCol);
                            if (!isNaN(parsed) && parsed > 0) precioNum = parsed;
                        }

                        productos.push({ id: i, descripcion, precio: precioNum });
                    }
                }
            }
            mostrarProductos(productos);
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            grid.innerHTML = lista.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">+ Agregar</button>
                    </div>
                `;
            }).join('');
        }

        function filtrarProductos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.descripcion.toLowerCase().includes(texto));
            mostrarProductos(filtrados);
        }

        function agregarAlCarrito(index) {
            let producto = productos[index];
            if (!producto) return;
            
            let nombre = producto.descripcion;
            let precio = producto.precio;

            if (!carrito[nombre]) {
                carrito[nombre] = { precio: precio, cantidad: 0 };
            }
            carrito[nombre].cantidad += 1;
            actualizarTotalesUI();
        }

        function actualizarTotalesUI() {
            let totalItems = 0;
            let totalGeneral = 0;
            
            for (let nombre in carrito) {
                totalItems += carrito[nombre].cantidad;
                totalGeneral += carrito[nombre].cantidad * carrito[nombre].precio;
            }

            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-quetzales').innerText = `Q ${totalGeneral.toFixed(2)}`;
        }

        async function obtenerVentasFirebase() {
            let total = 0;
            let tiquetes = 0;
            try {
                const res = await fetch(FIREBASE_URL);
                const data = await res.json();
                if (data) {
                    let lista = Object.values(data);
                    tiquetes = lista.length;
                    lista.forEach(t => { total += parseFloat(t.total) || 0; });
                }
            } catch (e) { console.error(e); }
            return { total, tiquetes };
        }

        async function mostrarSueldo() {
            const datosFB = await obtenerVentasFirebase();
            let ventasHoy = datosFB.total;
            let tiquetesHoy = datosFB.tiquetes;

            let ventasTotalesMes = 37944.00 + ventasHoy;

            let html = `
                <div class="modal-title">💵 Nómina Real en Tiempo Real</div>
                <div class="modal-subtitle">⚡ NÓMINA REAL - 2DO PAGO (DESDE EL 16)</div>

                <div class="contenedor-principal">
                    <div class="caja-detalle">
                        <div class="fila-flex"><span>Sueldo Base Mensual:</span> <b>Q3,500.00</b></div>
                        <div class="fila-flex" style="color:#2ecc71;"><span>1ra Quincena (1 al 15):</span> <b>Libre (Q1,750.00 pagados)</b></div>
                        <div class="fila-flex" style="color:#60a5fa;"><span>Base 2da Quincena (16 al 30):</span> <b>Q 1,750.00</b></div>
                    </div>

                    <div class="caja-detalle azul">
                        <div class="fila-flex" style="color:#60a5fa; font-weight:bold;">
                            <span>☀️ Ventas de hoy:</span> 
                            <span>Q ${ventasHoy.toFixed(2)} (${tiquetesHoy} tiquetes)</span>
                        </div>
                    </div>

                    <div class="caja-detalle roja">
                        <div class="fila-flex" style="color:#f87171;">
                            <span>📉 Descuento por Déficit (Desde el 16):</span> 
                            <b>-Q 1225.00</b>
                        </div>
                    </div>

                    <div class="caja-detalle verde">
                        <div class="fila-flex" style="color:#4ade80; font-weight:bold; font-size:1em;">
                            <span>📅 2do Pago Neto (Sueldo del Mes):</span> 
                            <span>Q 525.00</span>
                        </div>
                    </div>

                    <div style="font-size:0.75em; color:#94a3b8; margin: 8px 0;">
                        • Ventas Totales Mes: Q${ventasTotalesMes.toFixed(2)} / Q81,000<br>
                        • 🛡️ Descuento aplicado desde el 16 (Déficit de ventas).
                    </div>

                    <div class="caja-detalle naranja">
                        <div style="color:#fb923c; font-weight:bold; font-size:0.85em; margin-bottom:2px;">
                            🛵 TOTAL A RECIBIR FIN DE MES (CON MOTO):
                        </div>
                        <div style="font-size:0.72em; color:#cbd5e1; margin-bottom:4px;">
                            Incluye 2do pago neto + Bono de Moto Q500.00 íntegro
                        </div>
                        <div style="color:#4ade80; font-size:1.15em; font-weight:bold;">
                            Q 1025.00
                        </div>
                    </div>
                </div>

                <button class="btn-accion-cerrar" onclick="cerrarModal()">Cerrar Ventana</button>
            `;

            document.getElementById('modal-box-body').innerHTML = html;
            document.getElementById('modal-info').style.display = 'flex';
        }

        async function mostrarMetas() {
            const datosFB = await obtenerVentasFirebase();
            let ventasHoy = datosFB.total;
            let tiquetesHoy = datosFB.tiquetes;

            let ventasTotalesMes = 36933.50 + ventasHoy;
            let tiquetesTotal = 114 + tiquetesHoy;

            let html = `
                <div class="modal-title">📊 Control de Metas y Rendimiento</div>
                <div class="modal-subtitle">Panel de Jorge - Ruta Activa</div>

                <div class="caja-detalle verde" style="padding:10px;">
                    <div style="color:#4ade80; font-weight:bold; margin-bottom:6px;">📦 JORGE - ESTADO DE CUOTAS</div>
                    <div class="fila-flex"><span>💰 Ventas Acumuladas Mes:</span> <b>Q ${ventasTotalesMes.toFixed(2)} / Q81,000.00</b></div>
                    <div class="fila-flex"><span>📄 Tiquetes Emitidos:</span> <b>${tiquetesTotal} / 220 Tq Meta</b></div>
                    <div class="fila-flex"><span>⏱️ Horas de Ruta:</span> <b>119 / 135 Hrs Meta</b></div>
                </div>

                <div class="caja-detalle azul" style="padding:10px; margin-top:8px;">
                    <div style="color:#fb923c; font-weight:bold; margin-bottom:4px;">📝 Ventas Registradas Hoy:</div>
                    <div class="fila-flex"><span>• Tiquetes Generados:</span> <b>${tiquetesHoy}</b></div>
                    <div class="fila-flex"><span>• Total Vendido Hoy:</span> <b style="color:#4ade80;">Q ${ventasHoy.toFixed(2)}</b></div>
                </div>

                <button class="btn-accion-reporte" onclick="enviarReporteVoz()">📲 Enviar Reporte a don Byron</button>
                <button class="btn-accion-cerrar" onclick="cerrarModal()">Cerrar Ventana</button>
            `;

            document.getElementById('modal-box-body').innerHTML = html;
            document.getElementById('modal-info').style.display = 'flex';
        }

        function enviarReporteVoz() {
            let msg = `*REPORTE DE RENDIMIENTO - JORGE*%0A` +
                      `📊 Estado de ventas actualizado.%0A` +
                      `¡Hola don Byron! Le confirmo mi reporte de ruta.`;
            window.open(`https://wa.me/50248502382?text=${msg}`, '_blank');
        }

        function cerrarModal() {
            document.getElementById('modal-info').style.display = 'none';
        }

        async function enviarPedidoAdmin() {
            let totalItems = 0;
            let totalGeneral = 0;
            let detalleTexto = "";
            let detalleWhatsApp = "";
            
            for (let nombre in carrito) {
                let cant = carrito[nombre].cantidad;
                let sub = cant * carrito[nombre].precio;
                totalItems += cant;
                totalGeneral += sub;
                detalleTexto += `${cant}x ${nombre} (Q ${sub.toFixed(2)}) | `;
                detalleWhatsApp += `${nombre} (x${cant}) = Q${sub.toFixed(2)}%0A`;
            }

            if (totalItems === 0) {
                alert("Debe agregar al menos un producto al carrito.");
                return;
            }

            let clienteNom = prompt("Ingrese el nombre del cliente para este pedido:", "Cliente General");
            if (!clienteNom) return;

            let ahora = new Date();
            let fechaStr = ahora.toLocaleDateString('es-GT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            let horaStr = ahora.toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', hour12: true });
            let fechaHoraCompleta = `${fechaStr} - ${horaStr}`;

            let nuevoTicket = {
                fecha: fechaHoraCompleta,
                cliente: clienteNom,
                detalle: detalleTexto,
                total: totalGeneral
            };

            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(nuevoTicket),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (e) {
                console.error("Error enviando a la nube:", e);
            }

            let mensaje = `*DISTRIBUIDORA DIPROSA*%0A` +
                          `📦 *Vendedor:* JORGE%0A` +
                          `🕒 *Fecha y Hora:* ${fechaHoraCompleta}%0A` +
                          `👤 *Cliente:* ${clienteNom}%0A` +
                          `--------------------------------%0A` +
                          detalleWhatsApp +
                          `--------------------------------%0A` +
                          `*TOTAL: Q ${totalGeneral.toFixed(2)}*%0A%0A` +
                          `¡Hola! Confirmo este pedido.`;

            window.open(`https://wa.me/50248502382?text=${mensaje}`, '_blank');
        }

        cargarProductos();
    </script>
</body>
</html>
