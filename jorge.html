<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoreo en Vivo - JORGE (DIPROSA)</title>
  <style>
    :root {
      --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff;
      --accent-color: #27ae60; --danger-color: #e74c3c;
    }
    body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; }
    h1 { text-align: center; color: #ff9800; font-size: 18px; margin-bottom: 5px; }
    p.sub { text-align: center; color: #888; font-size: 12px; margin-top: 0; }
    
    .meta-box { background: #122118; border: 1px solid #059669; border-radius: 8px; padding: 15px; margin-bottom: 15px; font-size: 13px; color: #a7f3d0; }
    .kpi-row { display: flex; justify-content: space-between; margin-bottom: 6px; border-bottom: 1px dotted #234e38; padding-bottom: 4px; }
    
    .ticket-card { background: #252525; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 12px; }
    .ticket-head { display: flex; justify-content: space-between; font-weight: bold; color: #38bdf8; margin-bottom: 6px; font-size: 13px; }
    .btn-refrescar { background-color: #0284c7; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .btn-borrar { background: #c0392b; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>👁️ MONITOR EN VIVO: JORGE</h1>
  <p class="sub">Ruta de Ventas DIPROSA</p>

  <button class="btn-refrescar" onclick="cargarMonitoreo()">🔄 Actualizar Datos en Vivo</button>

  <div class="meta-box">
    <h4>📊 RESUMEN DE RUTA (JORGE)</h4>
    <div class="kpi-row"><span>💰 Ventas Totales:</span><strong>Q <span id="mon-ventas">0.00</span></strong></div>
    <div class="kpi-row"><span>🧾 Tiquetes Emitidos:</span><strong id="mon-tq">0 Tq</strong></div>
  </div>

  <div style="font-weight: bold; margin-bottom: 8px; color: #ff9800;">📝 Historial de Pedidos Recibidos:</div>
  <div id="mon-lista"></div>

  <script>
    const ticketsKey = "diprosa_tickets_jorge";

    function cargarMonitoreo() {
      let tiquetes = JSON.parse(localStorage.getItem(ticketsKey)) || [];
      let totalVentas = 0, totalTq = 0;

      tiquetes.forEach(t => {
        if (t.total) {
          totalVentas += parseFloat(t.total);
          totalTq += 1;
        }
      });

      document.getElementById('mon-ventas').innerText = totalVentas.toFixed(2);
      document.getElementById('mon-tq').innerText = totalTq + " Tq";

      let contenedor = document.getElementById('mon-lista');
      if (tiquetes.length === 0) {
        contenedor.innerHTML = '<p style="color:#888; text-align:center;">No hay tiquetes registrados por Jorge todavía.</p>';
        return;
      }

      contenedor.innerHTML = tiquetes.map((t, idx) => `
        <div class="ticket-card">
          <div class="ticket-head">
            <span>Tiquete #${idx+1} (${t.fecha || 'Sin hora'}) - 👤 ${t.cliente || 'Cliente'}</span>
            <button class="btn-borrar" onclick="borrarTq(${idx})">❌ Borrar</button>
          </div>
          <div style="color:#aaa; margin-bottom: 5px;">Total: <strong>Q${t.total ? t.total.toFixed(2) : '0.00'}</strong></div>
          <div style="font-size: 11px; color: #ddd; border-top: 1px dashed #444; padding-top: 4px;">
            ${t.items ? t.items.map(i => `${i.nombre} (x${i.cantidad})`).join(', ') : 'Sin detalle'}
          </div>
        </div>
      `).join('');
    }

    function borrarTq(idx) {
      if (confirm("¿Desea eliminar este tiquete del monitoreo?")) {
        let tiquetes = JSON.parse(localStorage.getItem(ticketsKey)) || [];
        tiquetes.splice(idx, 1);
        localStorage.setItem(ticketsKey, JSON.stringify(tiquetes));
        cargarMonitoreo();
      }
    }

    // Cargar al abrir
    cargarMonitoreo();
    // Auto-refrescar cada 5 segundos por si acaso
    setInterval(cargarMonitoreo, 5000);
  </script>
</body>
</html>
