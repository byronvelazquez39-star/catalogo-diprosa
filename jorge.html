<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Jorge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 10px auto;
        }
        .header-top h2 {
            color: #ff9800;
            margin: 0;
            font-size: 1.1em;
        }
        .header-btns {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background-color: #121212;
            color: #ff9800;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #121212;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
        .card {
            background-color: #0a0a0a;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #222;
        }
        .card h3 {
            font-size: 0.85em;
            margin: 0 0 8px 0;
            color: #ffffff;
            line-height: 1.3;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.05em;
            margin: 0 0 8px 0;
        }
        .btn-agregar {
            background-color: #008000;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #000000;
            border-top: 2px solid #222;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.85em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #008000;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            border: none;
        }

        /* DISEÑO MODAL IDÉNTICO AL DE ELEAZAR */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 16px;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            color: white;
            font-size: 0.85em;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.95);
            max-height: 92vh;
            overflow-y: auto;
        }
        .modal-header-title {
            font-size: 1.15em;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .modal-header-sub {
            color: #888;
            font-size: 0.8em;
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
        }
        .caja-cuotas {
            border: 1px solid #166534;
            background-color: #051408;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .titulo-cuotas {
            color: #2ecc71;
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 8px;
        }
        .fila-cuota {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            color: #aaa;
            font-size: 0.85em;
        }
        .fila-cuota b {
            color: #ffffff;
        }
        .texto-moto {
            color: #fb923c;
            font-size: 0.78em;
            line-height: 1.35;
            margin-top: 10px;
            border-top: 1px solid #166534;
            padding-top: 8px;
        }
        .titulo-historico {
            color: #fb923c;
            font-weight: bold;
            margin: 12px 0 8px 0;
            font-size: 0.9em;
        }
        .caja-base {
            border: 1px solid #166534;
            border-left: 4px solid #2ecc71;
            background-color: #051408;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        .item-tiquete {
            border: 1px solid #333;
            background-color: #161616;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-eliminar-tq {
            background-color: #b91c1c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75em;
            cursor: pointer;
        }
        .btn-enviar-byron {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .btn-cerrar-modal {
            background-color: #262626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>📦 JORGE (VENDEDOR)</h2>
        <div class="header-btns">
            <button type="button" onclick="mostrarMetas()" class="mini-btn">📊 Metas</button>
            <button type="button" onclick="mostrarSueldo()" class="mini-btn">💰 Sueldo</button>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="🔍 Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando catálogo completo...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <button onclick="enviarPedidoAdmin()" class="ver-ticket-btn">
            📋 Ver Ticket
        </button>
    </div>

    <div id="modal-info" class="modal-overlay">
        <div class="modal-box" id="modal-box-body"></div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1yRkOiPyX6hEnIhtuQarQXWXkPPTD65jS/export?format=csv&gid=1578551749';
        const FIREBASE_URL = 'https://diprosa-ventas-default-rtdb.firebaseio.com/ventas/JORGE.json';
        
        let productos = [];
        let carrito = {};

        async function cargarProductos() {
            try {
                const respuesta = await fetch(SHEET_URL);
                const datos = await respuesta.text();
                parsearCSV(datos);
            } catch (error) {
                document.getElementById('catalogo-grid').innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">Error de conexión.</p>';
            }
        }

        function parsearCSV(texto) {
            const lineas = texto.split('\n');
            productos = [];
            let vistos = new Set();
            
            for (let i = 0; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    let descripcion = columnas[2] ? columnas[2].replace(/"/g, '').trim() : '';
                    
                    if (descripcion && 
                        descripcion.toLowerCase() !== 'detalle' &&
                        !descripcion.toLowerCase().includes('descripcion') && 
                        !descripcion.toLowerCase().includes('producto') && 
                        !descripcion.includes('{') && 
                        !descripcion.includes('function') && 
                        descripcion.length > 2) {
                        
                        if (vistos.has(descripcion)) continue;
                        vistos.add(descripcion);

                        let precioNum = 0.00;
                        
                        if (columnas[3] && columnas[3].trim()) {
                            let matchCol = columnas[3].replace(/"/g, '').replace('Q', '').trim();
                            let parsed = parseFloat(matchCol);
                            if (!isNaN(parsed) && parsed > 0) precioNum = parsed;
                        }
                        
                        if (precioNum === 0 && columnas[4] && columnas[4].trim()) {
                            let matchCol = columnas[4].replace(/"/g, '').replace('Q', '').trim();
                            let parsed = parseFloat(matchCol);
                            if (!isNaN(parsed) && parsed > 0) precioNum = parsed;
                        }

                        productos.push({ id: i, descripcion, precio: precioNum });
                    }
                }
            }
            mostrarProductos(productos);
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            grid.innerHTML = lista.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">+ Agregar</button>
                    </div>
                `;
            }).join('');
        }

        function filtrarProductos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.descripcion.toLowerCase().includes(texto));
            mostrarProductos(filtrados);
        }

        function agregarAlCarrito(index) {
            let producto = productos[index];
            if (!producto) return;
            
            let nombre = producto.descripcion;
            let precio = producto.precio;

            if (!carrito[nombre]) {
                carrito[nombre] = { precio: precio, cantidad: 0 };
            }
            carrito[nombre].cantidad += 1;
            actualizarTotalesUI();
        }

        function actualizarTotalesUI() {
            let totalItems = 0;
            let totalGeneral = 0;
            
            for (let nombre in carrito) {
                totalItems += carrito[nombre].cantidad;
                totalGeneral += carrito[nombre].cantidad * carrito[nombre].precio;
            }

            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-quetzales').innerText = `Q ${totalGeneral.toFixed(2)}`;
        }

        async function obtenerTicketsFirebase() {
            try {
                const res = await fetch(FIREBASE_URL);
                const data = await res.json();
                return data ? Object.entries(data) : [];
            } catch (e) {
                return [];
            }
        }

        async function eliminarTicket(idTicket) {
            if (confirm("¿Desea eliminar este tiquete del historial de hoy?")) {
                try {
                    let urlEliminar = `https://diprosa-ventas-default-rtdb.firebaseio.com/ventas/JORGE/${idTicket}.json`;
                    await fetch(urlEliminar, { method: 'DELETE' });
                    cerrarModal();
                    setTimeout(mostrarMetas, 300);
                } catch (e) {
                    alert("No se pudo eliminar el tiquete.");
                }
            }
        }

        async function mostrarMetas() {
            const entradas = await obtenerTicketsFirebase();
            let totalVendidoHoy = 0;
            let htmlTiquetes = '';

            entradas.forEach(([id, t], index) => {
                let monto = parseFloat(t.total) || 0;
                totalVendidoHoy += monto;
                let horaStr = t.fecha ? t.fecha.split('-')[1] || t.fecha : 'Hoy';
                let clienteNom = t.cliente || t.nombreCliente || 'General';
                
                htmlTiquetes += `
                    <div class="item-tiquete">
                        <div style="font-size:0.82em;">
                            <div style="color:#3b82f6; font-weight:bold;">Tiquete #${index + 1} - 👤 ${clienteNom}</div>
                            <div style="color:#888; font-size:0.78em; margin-top:2px;">Hora: ${horaStr} | Total: Q${monto.toFixed(2)}</div>
                        </div>
                        <button class="btn-eliminar-tq" onclick="eliminarTicket('${id}')">❌ Eliminar</button>
                    </div>
                `;
            });

            let baseInicioMonto = 35000.00;
            let baseTiquetes = 100;
            let baseHoras = 110;

            let acumuladoMesTotal = baseInicioMonto + totalVendidoHoy;
            let tiquetesTotalMes = baseTiquetes + entradas.length;

            let html = `
                <div class="modal-header-title">📊 Control de Metas y Rendimiento</div>
                <div class="modal-header-sub">Panel de Vendedor - Ruta Activa</div>

                <div class="caja-cuotas">
                    <div class="titulo-cuotas">📦 JORGE - ESTADO DE CUOTAS</div>
                    <div class="fila-cuota"><span>Ventas Acumuladas Mes:</span> <b>Q ${acumuladoMesTotal.toFixed(2)} / Q81,000.00</b></div>
                    <div class="fila-cuota"><span>Tiquetes Emitidos:</span> <b>${tiquetesTotalMes} / 220 Tq Meta</b></div>
                    <div class="fila-cuota"><span>Horas de Ruta:</span> <b>${baseHoras} / 135 Hrs Meta</b></div>
                    
                    <div class="texto-moto">
                        📦 Del 1 al 15 libre de descuentos. Del 16 en adelante se evalúa el rendimiento diario de ventas.
                    </div>
                </div>

                <div class="titulo-historico">📝 Registro Histórico y Tiquetes de Hoy:</div>

                <div class="caja-base">
                    <div style="color:#3b82f6; font-weight:bold; font-size:0.82em;">📊 BASE DE INICIO (${baseTiquetes} Tq / ${baseHoras} Hrs)</div>
                    <div style="color:#2ecc71; font-size:0.82em; margin-top:2px;">Ventas: Q${baseInicioMonto.toFixed(2)}</div>
                </div>

                ${htmlTiquetes}

                <button class="btn-enviar-byron" onclick="enviarReporteVoz()">📲 Enviar Reporte a don Byron</button>
                <button class="btn-cerrar-modal" onclick="cerrarModal()">Cerrar Ventana</button>
            `;

            document.getElementById('modal-box-body').innerHTML = html;
            document.getElementById('modal-info').style.display = 'flex';
        }

        async function mostrarSueldo() {
            const entradas = await obtenerTicketsFirebase();
            let totalHoy = 0;
            entradas.forEach(([id, t]) => { totalHoy += parseFloat(t.total) || 0; });

            let sueldoBaseMensual = 3500.00;
            let baseQuincena = 1750.00;
            let descuentoDeficit = 1225.00;
            let pagoNeto2do = 525.00;
            let ventasMesTotal = 35000.00 + totalHoy;

            let html = `
                <div class="modal-header-title">💵 Nómina Real en Tiempo Real</div>
                <div class="modal-header-sub">⚡ NÓMINA REAL - 2DO PAGO (DESDE EL 16)</div>

                <div class="caja-cuotas">
                    <div class="fila-cuota"><span>Sueldo Base Mensual:</span> <b>Q${sueldoBaseMensual.toFixed(2)}</b></div>
                    <div class="fila-cuota" style="color:#2ecc71;"><span>1ra Quincena (1 al 15):</span> <b>Libre (Q1,750.00 pagados)</b></div>
                    <div class="fila-cuota" style="color:#3b82f6;"><span>Base 2da Quincena (16 al 30):</span> <b>Q ${baseQuincena.toFixed(2)}</b></div>
                </div>

                <div style="background:rgba(30, 58, 138, 0.2); border:1px solid #1d4ed8; border-radius:8px; padding:10px; margin-bottom:10px;">
                    <div class="fila-cuota" style="color:#60a5fa; font-weight:bold;">
                        <span>☀️ Ventas de hoy:</span> 
                        <span>Q ${totalHoy.toFixed(2)} (${entradas.length} tiquetes)</span>
                    </div>
                </div>

                <div style="background:rgba(127, 29, 29, 0.2); border:1px solid #b91c1c; border-radius:8px; padding:10px; margin-bottom:10px;">
                    <div class="fila-cuota" style="color:#f87171; font-weight:bold;">
                        <span>📉 Descuento por Déficit (Desde el 16):</span> 
                        <span>-Q ${descuentoDeficit.toFixed(2)}</span>
                    </div>
                </div>

                <div style="background:rgba(20, 83, 45, 0.2); border:1px solid #15803d; border-radius:8px; padding:10px; margin-bottom:10px;">
                    <div class="fila-cuota" style="color:#4ade80; font-weight:bold;">
                        <span>📅 2do Pago Neto (Sueldo del Mes):</span> 
                        <span>Q ${pagoNeto2do.toFixed(2)}</span>
                    </div>
                </div>

                <div style="font-size:0.75em; color:#94a3b8; margin: 8px 0;">
                    • Ventas Totales Mes: Q${ventasMesTotal.toFixed(2)} / Q81,000<br>
                    • 🛡️ Descuento aplicado desde el 16 (Déficit de ventas).
                </div>

                <button class="btn-cerrar-modal" onclick="cerrarModal()">Cerrar Ventana</button>
            `;

            document.getElementById('modal-box-body').innerHTML = html;
            document.getElementById('modal-info').style.display = 'flex';
        }

        function enviarReporteVoz() {
            let msg = `*REPORTE DE RENDIMIENTO - JORGE*%0A` +
                      `📊 Estado de ventas actualizado.%0A` +
                      `¡Hola don Byron! Le confirmo mi reporte de ruta.`;
            window.open(`https://wa.me/50248502382?text=${msg}`, '_blank');
        }

        function cerrarModal() {
            document.getElementById('modal-info').style.display = 'none';
        }

        async function enviarPedidoAdmin() {
            let totalItems = 0;
            let totalGeneral = 0;
            let detalleTexto = "";
            let detalleWhatsApp = "";
            
            for (let nombre in carrito) {
                let cant = carrito[nombre].cantidad;
                let sub = cant * carrito[nombre].precio;
                totalItems += cant;
                totalGeneral += sub;
                detalleTexto += `${cant}x ${nombre} (Q ${sub.toFixed(2)}) | `;
                detalleWhatsApp += `${nombre} (x${cant}) = Q${sub.toFixed(2)}%0A`;
            }

            if (totalItems === 0) {
                alert("Debe agregar al menos un producto al carrito.");
                return;
            }

            let clienteNom = prompt("Ingrese el nombre del cliente para este pedido:", "Cliente General");
            if (!clienteNom) return;

            let ahora = new Date();
            let fechaStr = ahora.toLocaleDateString('es-GT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            let horaStr = ahora.toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', hour12: true });
            let fechaHoraCompleta = `${fechaStr} - ${horaStr}`;

            let nuevoTicket = {
                fecha: fechaHoraCompleta,
                cliente: clienteNom,
                detalle: detalleTexto,
                total: totalGeneral
            };

            try {
                let urlUnica = `https://diprosa-ventas-default-rtdb.firebaseio.com/ventas/JORGE/${Date.now()}.json`;
                await fetch(urlUnica, {
                    method: 'PUT',
                    body: JSON.stringify(nuevoTicket),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (e) {
                console.error("Error enviando a la nube:", e);
            }

            let mensaje = `*DISTRIBUIDORA DIPROSA*%0A` +
                          `📦 *Vendedor:* Jorge%0A` +
                          `🕒 *Fecha y Hora:* ${fechaHoraCompleta}%0A` +
                          `👤 *Cliente:* ${clienteNom}%0A` +
                          `--------------------------------%0A` +
                          detalleWhatsApp +
                          `--------------------------------%0A` +
                          `*TOTAL: Q ${totalGeneral.toFixed(2)}*%0A%0A` +
                          `¡Hola! Confirmo este pedido.`;

            window.open(`https://wa.me/50248502382?text=${mensaje}`, '_blank');
        }

        cargarProductos();
    </script>
</body>
</html>
