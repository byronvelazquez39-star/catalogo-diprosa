<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Jorge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 10px auto;
        }
        .header-top h2 {
            color: #ff9800;
            margin: 0;
            font-size: 1.1em;
        }
        .header-btns {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background-color: #121212;
            color: #ff9800;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #121212;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
