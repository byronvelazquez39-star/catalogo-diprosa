<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DIPROSA - JORGE</title>
  <style>
    :root {
      --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff;
      --accent-color: #27ae60; --wa-color: #25d366; --danger-color: #e74c3c;
    }
    body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 12px; padding-bottom: 100px; box-sizing: border-box; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; }
    h1 { text-align: center; margin: 0; font-size: 16px; color: #ff9800; }
    
    .btn-group-header { display: flex; gap: 4px; }
    .btn-action-header { border: none; padding: 6px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; color: #fff; }
    .btn-metas { background-color: #0284c7; }
    .btn-sueldo { background-color: #059669; }

    .search-box { width: 100%; padding: 10px; font-size: 14px; margin-bottom: 15px; border: 1px solid #ff9800; border-radius: 6px; background: #1a1a1a; color: #fff; box-sizing: border-box; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
    .nombre { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .precio { font-size: 14px; color: var(--accent-color); font-weight: bold; margin-bottom: 8px; }
    
    .qty-controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-qty { background-color: #333; color: #fff; border: 1px solid #555; width: 28px; height: 28px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .qty-num { font-size: 14px; font-weight: bold; min-width: 18px; text-align: center; }
    .btn-add { background-color: var(--accent-color); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 12px; }
    
    .btn-cargar-mas { background-color: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 6px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; display: none; }

    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 2px solid #333; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .cart-info { font-size: 14px; cursor: pointer; }
    .cart-total { font-size: 16px; color: var(--accent-color); font-weight: bold; }
    .btn-wa { background-color: var(--wa-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 12px; box-sizing: border-box; }
    .modal-content { background: #1e1e1e; border-radius: 10px; padding: 15px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; border: 1px solid #444; color: #fff; box-sizing: border-box; font-size: 13px; }
    .ticket-header { text-align: center; border-bottom: 1px dashed #555; padding-bottom: 6px; margin-bottom: 10px; }
    .ticket-header h3 { margin: 0; font-size: 16px; color: #fff; }
    .client-input { width: 100%; background: #333; color: white; border: 1px solid #555; padding: 7px; border-radius: 5px; font-size: 13px; box-sizing: border-box; margin-bottom: 8px; }
    .btn-close { background: #555; color: white; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-modal-wa { background: var(--wa-color); color: white; border: none; width: 100%; text-align: center; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 5px; font-size: 14px; cursor: pointer; }

    .meta-resumen-box { background: #122118; border: 1px solid #059669; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 12px; color: #a7f3d0; line-height: 1.5; }
    .meta-resumen-box h4 { margin: 0 0 8px 0; color: #34d399; font-size: 13px; border-bottom: 1px dashed #059669; padding-bottom: 4px; }

    .kpi-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px dotted #234e38; padding-bottom: 3px; }

    .ticket-historial-card { background: #252525; border: 1px solid #444; border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 11px; }
    .ticket-historial-head { display: flex; justify-content: space-between; font-weight: bold; color: #38bdf8; margin-bottom: 3px; align-items: center; }
    .btn-eliminar-uno { background: #c0392b; color: white; border: none; padding: 3px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .sueldo-card { background: #111827; border: 1px solid #374151; border-radius: 8px; padding: 12px; margin-bottom: 8px; font-size: 12px; }
    .sueldo-row { display: flex; justify-content: space-between; margin-bottom: 6px; }

    .proyeccion-opcion { background: #1e293b; border-left: 3px solid #0284c7; padding: 8px; margin-top: 6px; border-radius: 4px; }
    .proyeccion-opcion.verde { border-left-color: #25d366; background: #0f291e; }
    .proyeccion-opcion.premio { border-left-color: #f59e0b; background: #27200e; }
    .btn-corte-diario { background-color: #059669; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📦 JORGE (VENDEDOR)</h1>
    <div class="btn-group-header">
      <button class="btn-action-header btn-metas" onclick="abrirModalMetas()">📊 Metas</button>
      <button class="btn-action-header btn-sueldo" onclick="abrirModalSueldo()">💰 Sueldo</button>
    </div>
  </div>

  <input type="text" id="buscar" class="search-box" placeholder="🔍 Escriba para buscar producto..." oninput="filtrarDebounce()">
  
  <div id="catalogo" class="grid">Cargando productos del catálogo...</div>
  <button id="btn-mas" class="btn-cargar-mas" onclick="cargarMasProductos()">Cargar más productos...</button>
