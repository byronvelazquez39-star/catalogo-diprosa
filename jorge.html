<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Jorge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 10px auto;
        }
        .header-top h2 {
            color: #ff9800;
            margin: 0;
            font-size: 1.1em;
        }
        .header-btns {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background-color: #1a1a1a;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #181818;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
        .card {
            background-color: #141414;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #282828;
        }
        .card h3 {
            font-size: 0.85em;
            margin: 0 0 8px 0;
            color: #ffffff;
            line-height: 1.3;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.05em;
            margin: 0 0 8px 0;
        }
        .btn-agregar {
            background-color: #008000;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0b0b;
            border-top: 2px solid #222;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.85em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #008000;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            border: none;
        }

        /* MODAL AVANZADO (NÓMINA Y METAS) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #0a0a0a;
            border: 1px solid #1a1a2e;
            padding: 16px;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            color: white;
            font-size: 0.85em;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 4px;
            color: #fff;
            text-align: center;
        }
        .modal-sub {
            color: #4d90fe;
            font-size: 0.8em;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .card-seccion {
            background-color: #0d111a;
            border: 1px solid #1c2536;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .card-seccion.verde {
            background-color: #0a180e;
            border-color: #16381e;
        }
        .card-seccion.rojo {
            background-color: #1a0d0d;
            border-color: #381616;
        }
        .card-seccion.naranja {
            background-color: #1a120b;
            border-color: #382414;
        }
        .fila-monto {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        .monto-resaltado {
            font-weight: bold;
            color: #2ecc71;
        }
        .btn-cerrar {
            background: #333333;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .btn-reporte {
            background: #008000;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>📦 JORGE (VENDEDOR)</h2>
        <div class="header-btns">
            <button type="button" onclick="mostrarMetas()" class="mini-btn">📊 Metas</button>
            <button type="button" onclick="mostrarSueldo()" class="mini-btn">💰 Sueldo</button>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="🔍 Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando catálogo completo...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <button onclick="enviarPedidoAdmin()" class="ver-ticket-btn">
            📋 Ver Ticket
        </button>
    </div>

    <!-- MODAL DE NÓMINA Y METAS -->
    <div id="modal-info" class="modal-overlay">
        <div class="modal-box" id="modal-box-body">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1yRkOiPyX6hEnIhtuQarQXWXkPPTD65jS/export?format=csv&gid=1578551749';
        const FIREBASE_URL = 'https://diprosa-ventas-default-rtdb.firebaseio.com/ventas/JORGE.json';
        
        let productos = [];
        let carrito = {};

        async function cargarProductos() {
            try {
                const respuesta = await fetch(SHEET_URL);
                const datos = await respuesta.text();
                parsearCSV(datos);
            } catch (error) {
                document.getElementById('catalogo-grid').innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">Error de conexión.</p>';
            }
        }

        function parsearCSV(texto) {
            const lineas = texto.split('\n');
            productos = [];
            let vistos = new Set();
            
            for (let i = 0; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    let descripcion = columnas[2] ? columnas[2].replace(/"/g, '').trim() : '';
                    
                    if (descripcion && 
                        descripcion.toLowerCase() !== 'detalle' &&
                        !descripcion.toLowerCase().includes('descripcion') && 
                        !descripcion.toLowerCase().includes('producto') && 
                        !descripcion.includes('{') && 
                        !descripcion.includes('function') && 
                        descripcion.length > 2) {
                        
                        if (vistos.has(descripcion)) continue;
                        vistos.add(descripcion);

                        let precioNum = 0.00;
                        
                        if (columnas[3] && columnas[3].trim()) {
                            let matchCol = columnas[3].replace(/"/g, '').replace('Q', '').trim();
                            let parsed = parseFloat(matchCol);
                            if (!isNaN(parsed) && parsed > 0) precioNum = parsed;
                        }
                        
                        if (precioNum === 0 && columnas[4] && columnas[4].trim()) {
                            let matchCol = columnas[4].replace(/"/g, '').replace('Q', '').trim();
                            let parsed = parseFloat(matchCol);
                            if (!isNaN(parsed) && parsed > 0) precioNum = parsed;
                        }

                        productos.push({ id: i, descripcion, precio: precioNum });
                    }
                }
            }
            mostrarProductos(productos);
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            grid.innerHTML = lista.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">+ Agregar</button>
                    </div>
                `;
            }).join('');
        }

        function filtrarProductos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.descripcion.toLowerCase().includes(texto));
            mostrarProductos(filtrados);
        }

        function agregarAlCarrito(index) {
            let producto = productos[index];
            if (!producto) return;
            
            let nombre = producto.descripcion;
            let precio = producto.precio;

            if (!carrito[nombre]) {
                carrito[nombre] = { precio: precio, cantidad: 0 };
            }
            carrito[nombre].cantidad += 1;
            actualizarTotalesUI();
        }

        function actualizarTotalesUI() {
            let totalItems = 0;
            let totalGeneral = 0;
            
            for (let nombre in carrito) {
                totalItems += carrito[nombre].cantidad;
                totalGeneral += carrito[nombre].cantidad * carrito[nombre].precio;
            }

            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-quetzales').innerText = `Q ${totalGeneral.toFixed(2)}`;
        }

        async function obtenerVentasFirebase() {
            let total = 0;
            let cantidadTiquetes = 0;
            try {
                const res = await fetch(FIREBASE_URL);
                const data = await res.json();
                if (data) {
                    let tickets = Object.values(data);
                    cantidadTiquetes = tickets.length;
                    tickets.forEach(t => { total += parseFloat(t.total) || 0; });
                }
            } catch (e) { console.error(e); }
            return { total, cantidadTiquetes };
        }

        async function mostrarSueldo() {
            const datosFB = await obtenerVentasFirebase();
            let ventasHoy = datosFB.total;
            let tiquetesHoy = datosFB.cantidadTiquetes;

            let sueldoBaseMensual = 3500.00;
            let baseQuincena = 1750.00;
            let descuentoDeficit = 1225.00; 
            let pagoNeto2do = 525.00;
            let bonoMoto = 500.00;
            let totalFinDeMes = pagoNeto2do + bonoMoto;

            let html = `
                <div class="modal-header">💵 Nómina Real en Tiempo Real</div>
                <div class="modal-sub">⚡ NÓMINA REAL - 2DO PAGO (DESDE EL 16)</div>

                <div class="card-seccion">
                    <div class="fila-monto"><span>Sueldo Base Mensual:</span> <b>Q${sueldoBaseMensual.toLocaleString('es-GT', {minimumFractionDigits:2})}</b></div>
                    <div class="fila-monto" style="color:#2ecc71;"><span>1ra Quincena (1 al 15):</span> <b>Libre (Q1,750.00 pagados)</b></div>
                    <div class="fila-monto" style="color:#4d90fe;"><span>Base 2da Quincena (16 al 30):</span> <b>Q ${baseQuincena.toFixed(2)}</b></div>
                </div>

                <div class="card-seccion" style="border-color:#4d90fe;">
                    <div class="fila-monto" style="color:#4d90fe;">
                        <span>☀️ Ventas de hoy:</span> 
                        <b>Q ${ventasHoy.toFixed(2)} (${tiquetesHoy} tiquetes)</b>
                    </div>
                </div>

                <div class="card-seccion rojo">
                    <div class="fila-monto" style="color:#ff6b6b;">
                        <span>📉 Descuento por Déficit (Desde el 16):</span> 
                        <b>-Q ${descuentoDeficit.toFixed(2)}</b>
                    </div>
                </div>

                <div class="card-seccion verde">
                    <div class="fila-monto" style="color:#2ecc71; font-size:1em;">
                        <span>📅 2do Pago Neto (Sueldo del Mes):</span> 
                        <b>Q ${pagoNeto2do.toFixed(2)}</b>
                    </div>
                </div>

                <div class="card-seccion naranja">
                    <div style="color:#ff9800; font-weight:bold; margin-bottom:4px;">
                        🛵 TOTAL A RECIBIR FIN DE MES:
                    </div>
                    <div style="font-size:0.8em; color:#aaa; margin-bottom:4px;">
                        Incluye 2do pago neto + Bono integro Q500.00
                    </div>
                    <div style="color:#2ecc71; font-size:1.2em; font-weight:bold;">
                        Q ${totalFinDeMes.toFixed(2)}
                    </div>
                </div>

                <button class="btn-cerrar" onclick="cerrarModal()">Cerrar Ventana</button>
            `;

            document.getElementById('modal-box-body').innerHTML = html;
            document.getElementById('modal-info').style.display = 'flex';
        }

        async function mostrarMetas() {
            const datosFB = await obtenerVentasFirebase();
            let ventasHoy = datosFB.total;
            let tiquetesHoy = datosFB.cantidadTiquetes;

            let ventasAcumuladasMes = 36933.50 + ventasHoy;
            let metaVentasMes = 81000.00;
            let tiquetesEmitidos = 114 + tiquetesHoy;

            let html = `
                <div class="modal-header">📊 Control de Metas y Rendimiento</div>
                <div class="modal-sub">Panel de Jorge - Ruta Activa</div>

                <div class="card-seccion verde">
                    <div style="color:#2ecc71; font-weight:bold; margin-bottom:8px;">📦 JORGE - ESTADO DE CUOTAS</div>
                    <div class="fila-monto"><span>💰 Ventas Acumuladas Mes:</span> <b>Q ${ventasAcumuladasMes.toFixed(2)} / Q${metaVentasMes.toLocaleString()}</b></div>
                    <div class="fila-monto"><span>📄 Tiquetes Emitidos:</span> <b>${tiquetesEmitidos} / 220 Tq Meta</b></div>
                    <div class="fila-monto"><span>⏱️ Horas de Ruta:</span> <b>119 / 135 Hrs Meta</b></div>
                </div>

                <div class="card-seccion">
                    <div style="color:#ff9800; font-weight:bold; margin-bottom:6px;">📝 Ventas Registradas Hoy:</div>
                    <div class="fila-monto"><span>• Tiquetes Generados:</span> <b>${tiquetesHoy}</b></div>
                    <div class="fila-monto"><span>• Total Vendido Hoy:</span> <b style="color:#2ecc71;">Q ${ventasHoy.toFixed(2)}</b></div>
                </div>

                <button class="btn-reporte" onclick="enviarReporteVoz()">📲 Enviar Reporte a don Byron</button>
                <button class="btn-cerrar" onclick="cerrarModal()">Cerrar Ventana</button>
            `;

            document.getElementById('modal-box-body').innerHTML = html;
            document.getElementById('modal-info').style.display = 'flex';
        }

        function enviarReporteVoz() {
            let msg = `*REPORTE DE RENDIMIENTO - JORGE*%0A` +
                      `📊 Estado de ventas actualizado.%0A` +
                      `¡Hola don Byron! Le confirmo mi reporte de ruta.`;
            window.open(`https://wa.me/50248502382?text=${msg}`, '_blank');
        }

        function cerrarModal() {
            document.getElementById('modal-info').style.display = 'none';
        }

        async function enviarPedidoAdmin() {
            let totalItems = 0;
            let totalGeneral = 0;
            let detalleTexto = "";
            let detalleWhatsApp = "";
            
            for (let nombre in carrito) {
                let cant = carrito[nombre].cantidad;
                let sub = cant * carrito[nombre].precio;
                totalItems += cant;
                totalGeneral += sub;
                detalleTexto += `${cant}x ${nombre} (Q ${sub.toFixed(2)}) | `;
                detalleWhatsApp += `${nombre} (x${cant}) = Q${sub.toFixed(2)}%0A`;
            }

            if (totalItems === 0) {
                alert("Debe agregar al menos un producto al carrito.");
                return;
            }

            let clienteNom = prompt("Ingrese el nombre del cliente para este pedido:", "Cliente General");
            if (!clienteNom) return;

            let ahora = new Date();
            let fechaStr = ahora.toLocaleDateString('es-GT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            let horaStr = ahora.toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', hour12: true });
            let fechaHoraCompleta = `${fechaStr} - ${horaStr}`;

            let nuevoTicket = {
                fecha: fechaHoraCompleta,
                cliente: clienteNom,
                detalle: detalleTexto,
                total: totalGeneral
            };

            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(nuevoTicket),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (e) {
                console.error("Error enviando a la nube:", e);
            }

            let mensaje = `*DISTRIBUIDORA DIPROSA*%0A` +
                          `📦 *Vendedor:* JORGE%0A` +
                          `🕒 *Fecha y Hora:* ${fechaHoraCompleta}%0A` +
                          `👤 *Cliente:* ${clienteNom}%0A` +
                          `--------------------------------%0A` +
                          detalleWhatsApp +
                          `--------------------------------%0A` +
                          `*TOTAL: Q ${totalGeneral.toFixed(2)}*%0A%0A` +
                          `¡Hola! Confirmo este pedido.`;

            window.open(`https://wa.me/50248502382?text=${mensaje}`, '_blank');
        }

        cargarProductos();
    </script>
</body>
</html>
