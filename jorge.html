<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DIPROSA - JORGE</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #27ae60;
      --wa-color: #25d366;
      --danger-color: #e74c3c;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      padding-bottom: 120px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 { text-align: center; margin: 0; font-size: 18px; }

    .btn-group-header { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-action-header {
      border: none; padding: 8px 10px; border-radius: 8px; font-weight: bold; cursor: pointer;
      font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: #ffffff;
    }
    .btn-metas { background-color: #0284c7; }
    .btn-sueldo { background-color: #059669; }
    .badge-header { background-color: #ffffff; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 800; }
    .badge-metas { color: #0284c7; }
    .badge-sueldo { color: #059669; }

    .search-box {
      width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px;
      border: 1px solid #333; border-radius: 8px; background: #222; color: #fff; box-sizing: border-box;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .card {
      background: var(--card-bg); padding: 15px; border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; display: flex; flex-direction: column; justify-content: space-between;
    }
    .nombre { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
    .precio { font-size: 16px; color: var(--accent-color); font-weight: bold; margin-bottom: 10px; }
    
    .qty-controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-qty { background-color: #333; color: #fff; border: 1px solid #555; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .qty-num { font-size: 16px; font-weight: bold; min-width: 20px; }
    .btn-add { background-color: var(--accent-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-cargar-mas { background-color: #333; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 8px; width: 100%; margin-top: 20px; font-weight: bold; cursor: pointer; }

    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 2px solid #333;
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
    }
    .cart-info { font-size: 15px; cursor: pointer; }
    .cart-total { font-size: 18px; color: var(--accent-color); font-weight: bold; }
    .btn-wa { background-color: var(--wa-color); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
