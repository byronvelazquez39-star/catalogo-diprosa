<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Jorge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
            font-size: 1.4em;
            margin-bottom: 5px;
        }
        .sub-header {
            text-align: center;
            color: #3b82f6;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: block;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            color: white;
            font-size: 1em;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 5px;
        }
        .card h3 {
            font-size: 0.85em;
            margin: 8px 0 4px 0;
            height: 2.5em;
            overflow: hidden;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1em;
            margin: 4px 0;
        }
        .btn-add {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85em;
        }
        .btn-add:active {
            background-color: #2563eb;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1a1a1a;
            border-top: 2px solid #333;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }
        .btn-checkout {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <h1>📦 Catálogo DIPROSA</h1>
    <div class="sub-header" id="lbl-vendedor-ruta">Ruta Activa - Ventas</div>

    <input type="text" id="buscador" class="search-box" placeholder="🔍 Escriba para buscar producto..." onkeyup="filtrarProductos()">
    
    <div class="grid" id="product-grid">
        <p style="text-align:center; color:#888; grid-column:1/-1;">Cargando inventario de productos...</p>
    </div>

    <div class="cart-bar">
        <div>
            <span style="font-size: 0.8em; color: #aaa;" id="lbl-contador-items">0 items (Ver Ticket)</span><br>
            <strong id="lbl-total" style="color: #2ecc71; font-size: 1.1em;">Q 0.00</strong>
        </div>
        <button class="btn-checkout" onclick="procesarPedido()">💬 Ver Ticket y Enviar</button>
    </div>

    <script>
        const VENDEDOR_ACTUAL = 'JORGE'; 
        const FIREBASE_URL = `https://diprosa-ventas-default-rtdb.firebaseio.com/ventas/${VENDEDOR_ACTUAL}.json`;

        document.getElementById('lbl-vendedor-ruta').innerText = `Vendedor: ${VENDEDOR_ACTUAL} (Ruta Activa)`;

        let carrito = [];
        let productosDisponibles = [];

        function cargarInventario() {
            productosDisponibles = [
                { nombre: "Detergente en Polvo 1kg", precio: 15.00, imagen: "https://via.placeholder.com/150?text=Detergente" },
                { nombre: "Aceite Vegetal 800ml", precio: 22.50, imagen: "https://via.placeholder.com/150?text=Aceite" },
                { nombre: "Arroz Blanco 5lbs", precio: 20.00, imagen: "https://via.placeholder.com/150?text=Arroz" },
                { nombre: "Frijol Negro 5lbs", precio: 25.00, imagen: "https://via.placeholder.com/150?text=Frijol" },
                { nombre: "Azúcar Morena 5lbs", precio: 23.00, imagen: "https://via.placeholder.com/150?text=Azucar" },
                { nombre: "Pasta Spaghetti 200g", precio: 5.00, imagen: "https://via.placeholder.com/150?text=Pasta" }
            ];
            renderizarCatalogo(productosDisponibles);
        }

        function renderizarCatalogo(lista) {
            const grid = document.getElementById('product-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#888; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            grid.innerHTML = lista.map(p => `
                <div class="card" data-nombre="${p.nombre.toLowerCase()}">
                    <img src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=DIPROSA'">
                    <h3>${p.nombre}</h3>
                    <p class="precio">Q ${p.precio.toFixed(2)}</p>
                    <button class="btn-add" onclick="agregarAlCarro('${p.nombre}', ${p.precio})">Agregar</button>
                </div>
            `).join('');
        }

        function filtrarProductos() {
            let filtro = document.getElementById('buscador').value.toLowerCase();
            let filtrados = productosDisponibles.filter(p => p.nombre.toLowerCase().includes(filtro));
            renderizarCatalogo(filtrados);
        }

        function agregarAlCarro(nombre, precio) {
            carrito.push({ nombre, precio });
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            let total = carrito.reduce((sum, item) => sum + item.precio, 0);
            document.getElementById('lbl-total').innerText = `Q ${total.toFixed(2)}`;
            document.getElementById('lbl-contador-items').innerText = `${carrito.length} items (Ver Carrito)`;
        }

        async function procesarPedido() {
            if (carrito.length === 0) {
                alert("El carrito está vacío. Agregue productos antes de enviar el tiquete.");
                return;
            }

            let totalVenta = carrito.reduce((sum, item) => sum + item.precio, 0);
            let detalleTexto = carrito.map(i => `${i.nombre} (Q${i.precio.toFixed(2)})`).join(', ');
            let fechaHora = new Date().toLocaleString();

            let datosTicket = {
                cliente: "Cliente General",
                detalle: detalleTexto,
                total: totalVenta,
                fecha: fechaHora
            };

            try {
                let respuesta = await fetch(FIREBASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosTicket)
                });
                if (!respuesta.ok) {
                    console.error("Aviso: Firebase no confirmó el guardado automático.");
                }
            } catch (e) {
                console.error("Error de conexión con Firebase:", e);
            }

            let mensaje = `*DISTRIBUIDORA DIPROSA*%0A*Vendedor:* ${VENDEDOR_ACTUAL}%0A*Fecha:* ${fechaHora}%0A*Detalle:* ${detalleTexto}%0A*Total:* Q${totalVenta.toFixed(2)}`;
            let urlWhatsApp = `https://wa.me/50248502382?text=${mensaje}`;

            carrito = [];
            actualizarBarraCarrito();
            window.open(urlWhatsApp, '_blank');
        }

        cargarInventario();
    </script>
</body>
</html>
