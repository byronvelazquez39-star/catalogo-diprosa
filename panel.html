<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Supervisor - Diprosa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #ff9800; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select { width: 100%; padding: 12px; margin-top: 5px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 16px; }
        .card { background: #2c2c2c; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4caf50; margin-top: 5px; }
        .btn { display: block; width: 100%; background: #ff9800; color: #fff; border: none; padding: 12px; margin-top: 20px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #e68900; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Panel de Supervisor</h2>
    
    <label for="vendedorSelect">Seleccione Vendedor:</label>
    <select id="vendedorSelect">
        <option value="ESTUARDO">Estuardo</option>
        <option value="CRISTIAN">Cristian</option>
        <option value="JORGE">Jorge</option>
    </select>

    <button class="btn" onclick="consultarVendedor()">Consultar Avance</button>

    <div class="card">
        <div>Ventas Acumuladas</div>
        <div id="lblVentas" class="stat-value">Q 0.00</div>
    </div>

    <div class="card">
        <div>Total de Tickets / Pedidos</div>
        <div id="lblTickets" class="stat-value">0</div>
    </div>
</div>

<script>
    const urlScript = "https://script.google.com/macros/s/AKfycbwng5-COdlWIG7qYkl-td66uYKfwVNHFKaXNqatrdAEXo4tWuofuW-oV4WKn34Hv9-_4Q/exec";

    function consultarVendedor() {
        const vendedor = document.getElementById('vendedorSelect').value;
        document.getElementById('lblVentas').innerText = "Cargando...";
        document.getElementById('lblTickets').innerText = "...";

        fetch(`${urlScript}?action=getStats&vendedor=${vendedor}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('lblVentas').innerText = "Q " + Number(data.ventas).toLocaleString('es-GT', {minimumFractionDigits: 2});
                document.getElementById('lblTickets').innerText = data.tickets;
            })
            .catch(error => {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor.");
                document.getElementById('lblVentas').innerText = "Q 0.00";
                document.getElementById('lblTickets').innerText = "0";
            });
    }

    window.onload = consultarVendedor;
</script>

</body>
</html>
