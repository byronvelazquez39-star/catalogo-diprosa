<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DIPROSA - CRISTIAN</title>
  <style>
    :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff; --accent-color: #27ae60; }
    body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; padding-bottom: 100px; }
    h1 { text-align: center; font-size: 18px; color: #f59e0b; margin-bottom: 5px; }
    .search-box { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 14px; margin-bottom: 15px; box-sizing: border-box; }
    .producto-card { background: var(--card-bg); border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .prod-info h4 { margin: 0 0 5px 0; font-size: 14px; }
    .prod-info p { margin: 0; color: #27ae60; font-weight: bold; font-size: 13px; }
    .prod-actions { display: flex; align-items: center; gap: 8px; }
    .prod-actions button { background: #333; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .prod-actions span { font-size: 14px; min-width: 20px; text-align: center; }
    .footer-cart { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top: 1px solid #333; padding: 12px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
    .btn-enviar { background: var(--accent-color); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <h1>DIPROSA - Vendedor: CRISTIAN</h1>
  <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
  <div id="lista-productos">Cargando catálogo...</div>

  <div class="footer-cart">
    <div>
      <div style="font-size:12px; color:#aaa;">Total Pedido:</div>
      <div style="font-size:16px; font-weight:bold; color:#27ae60;">Q <span id="total-general">0.00</span></div>
    </div>
    <button class="btn-enviar" onclick="enviarPedidoWhatsApp()">📤 Enviar a WhatsApp</button>
  </div>

  <script>
    let productos = [];
    let carrito = {};

    async function cargarCatalogo() {
      try {
        let respuesta = await fetch('catalogo.csv');
        let texto = await respuesta.text();
        let lineas = texto.split('\n');
        productos = lineas.slice(1).map(linea => {
          let partes = linea.split(',');
          if (partes.length >= 2) {
            return { nombre: partes[0].trim(), precio: parseFloat(partes[1]) || 0 };
          }
          return null;
        }).filter(p => p !== null && p.nombre !== '');
        mostrarProductos(productos);
      } catch(e) {
        document.getElementById('lista-productos').innerHTML = '<p style="color:red; text-align:center;">Error al cargar el catálogo.</p>';
      }
    }

    function mostrarProductos(lista) {
      let html = '';
      lista.forEach((p, index) => {
        let cantidad = carrito[p.nombre] || 0;
        html += `
          <div class="producto-card">
            <div class="prod-info">
              <h4>${p.nombre}</h4>
              <p>Q ${p.precio.toFixed(2)}</p>
            </div>
            <div class="prod-actions">
              <button onclick="cambiarCantidad('${p.nombre}', -1)">-</button>
              <span>${cantidad}</span>
              <button onclick="cambiarCantidad('${p.nombre}', 1)">+</button>
            </div>
          </div>
        `;
      });
      document.getElementById('lista-productos').innerHTML = html;
      calcularTotal();
    }

    function filtrarProductos() {
      let texto = document.getElementById('buscador').value.toLowerCase();
      let filtrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
      mostrarProductos(filtrados);
    }

    function cambiarCantidad(nombre, cambio) {
      if (!carrito[nombre]) carrito[nombre] = 0;
      carrito[nombre] += cambio;
      if (carrito[nombre] <= 0) delete carrito[nombre];
      filtrarProductos();
    }

    function calcularTotal() {
      let total = 0;
      for (let nombre in carrito) {
        let prod = productos.find(p => p.nombre === nombre);
        if (prod) total += prod.precio * carrito[nombre];
      }
      document.getElementById('total-general').innerText = total.toFixed(2);
      return total;
    }

    function enviarPedidoWhatsApp() {
      let totalPedido = calcularTotal();
      if (totalPedido <= 0) {
        alert("El carrito está vacío.");
        return;
      }

      let mensaje = "📦 *PEDIDO DIPROSA - CRISTIAN*\n\n";
      for (let nombre in carrito) {
        let prod = productos.find(p => p.nombre === nombre);
        let sub = prod.precio * carrito[nombre];
        mensaje += `• ${nombre} x ${carrito[nombre]} = Q ${sub.toFixed(2)}\n`;
      }
      mensaje += `\n*TOTAL: Q ${totalPedido.toFixed(2)}*`;

      // REGISTRO AUTOMÁTICO PARA EL PANEL DE AUDITORÍA
      let historialKey = 'historial_ventas_cristian';
      let listaHistorial = JSON.parse(localStorage.getItem(historialKey)) || [];
      let nuevoTicket = {
        numero: Math.floor(1000 + Math.random() * 9000),
        cliente: 'Cliente de Cristian',
        total: totalPedido,
        fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString()
      };
      listaHistorial.push(nuevoTicket);
      localStorage.setItem(historialKey, JSON.stringify(listaHistorial));

      let url = `https://api.whatsapp.com/send?phone=50248502382&text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', cargarCatalogo);
  </script>
</body>
</html>
