<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DIPROSA - CRISTIAN</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #27ae60;
      --danger-color: #e74c3c;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 10px;
      padding-bottom: 90px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 16px; color: #f59e0b; margin: 0; }
    .search-box {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .grid-productos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .producto-card {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .prod-info h4 { margin: 0 0 5px 0; font-size: 13px; line-height: 1.2; }
    .prod-info p { margin: 5px 0; color: #27ae60; font-weight: bold; font-size: 14px; }
    .btn-agregar {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      margin-top: 5px;
    }
    .footer-cart {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 10px 15px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .btn-ticket {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header-top">
    <h1>📦 Catálogo DIPROSA - CRISTIAN</h1>
  </div>

  <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
  
  <div id="lista-productos" class="grid-productos">
    <!-- Se llena automáticamente -->
  </div>

  <div class="footer-cart">
    <div>
      <div style="font-size:11px; color:#aaa;" id="contador-items">🛒 0 ítems</div>
      <div style="font-size:15px; font-weight:bold; color:#27ae60;">Total: Q <span id="total-general">0.00</span></div>
    </div>
    <button class="btn-ticket" onclick="enviarPedidoWhatsApp()">📄 Ver Ticket / Enviar</button>
  </div>

  <script>
    // Lista de productos base de DIPROSA
    const productos = [
      { nombre: "(almohadita) 4 onzas por docena para dar Q.3.00", precio: 29.50 },
      { nombre: "(almohadita) fardo 4 onzas para dar Q.3.00", precio: 110.00 },
      { nombre: "(CARNAVAL) en lata SODA CON NARANJADA Caja de 24 unidades para dar Q.3.50", precio: 67.00 },
      { nombre: "(Salvavidas) en lata LIMONADA Caja de 24 unidades para dar Q.3.50", precio: 67.00 },
      { nombre: "(Salvavidas) en lata ROJA Caja de 24 unidades para dar Q.3.50", precio: 67.00 },
      { nombre: "(Salvavidas) en lata UVA Caja de 24 unidades para dar Q.3.50", precio: 67.00 }
    ];

    let carrito = {};

    function mostrarProductos(lista) {
      let html = '';
      if (lista.length === 0) {
        html = '<p style="color:#aaa; text-align:center; grid-column: span 2;">No se encontraron productos.</p>';
      } else {
        lista.forEach((p) => {
          let cant = carrito[p.nombre] || 0;
          html += `
            <div class="producto-card">
              <div class="prod-info">
                <h4>${p.nombre}</h4>
                <p>Q ${p.precio.toFixed(2)}</p>
              </div>
              <div>
                ${cant > 0 ? `<div style="font-size:12px; color:#f59e0b; margin-bottom:4px; text-align:center;">Agregados: <b>${cant}</b></div>` : ''}
                <button class="btn-agregar" onclick="agregarProducto('${p.nombre.replace(/'/g, "\\'")}')">+ Agregar</button>
              </div>
            </div>
          `;
        });
      }
      document.getElementById('lista-productos').innerHTML = html;
      actualizarTotales();
    }

    function filtrarProductos() {
      let texto = document.getElementById('buscador').value.toLowerCase();
      let filtrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
      mostrarProductos(filtrados);
    }

    function agregarProducto(nombre) {
      if (!carrito[nombre]) carrito[nombre] = 0;
      carrito[nombre] += 1;
      filtrarProductos();
    }

    function actualizarTotales() {
      let total = 0;
      let totalItems = 0;
      for (let nombre in carrito) {
        let prod = productos.find(p => p.nombre === nombre);
        if (prod) {
          total += prod.precio * carrito[nombre];
          totalItems += carrito[nombre];
        }
      }
      document.getElementById('total-general').innerText = total.toFixed(2);
      document.getElementById('contador-items').innerText = `🛒 ${totalItems} ítems`;
    }

    function enviarPedidoWhatsApp() {
      let totalPedido = 0;
      for (let nombre in carrito) {
        let prod = productos.find(p => p.nombre === nombre);
        if (prod) totalPedido += prod.precio * carrito[nombre];
      }

      if (totalPedido <= 0) {
        alert("El carrito está vacío. Agregue productos antes de enviar.");
        return;
      }

      let mensaje = "📦 *PEDIDO DIPROSA - CRISTIAN*\n\n";
      for (let nombre in carrito) {
        let prod = productos.find(p => p.nombre === nombre);
        let sub = prod.precio * carrito[nombre];
        mensaje += `• ${nombre} x ${carrito[nombre]} = Q ${sub.toFixed(2)}\n`;
      }
      mensaje += `\n*TOTAL: Q ${totalPedido.toFixed(2)}*`;

      // REGISTRO AUTOMÁTICO PARA EL PANEL DE AUDITORÍA
      let historialKey = 'historial_ventas_cristian';
      let listaHistorial = JSON.parse(localStorage.getItem(historialKey)) || [];
      let nuevoTicket = {
        numero: Math.floor(1000 + Math.random() * 9000),
        cliente: 'Cliente de Cristian',
        total: totalPedido,
        fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString()
      };
      listaHistorial.push(nuevoTicket);
      localStorage.setItem(historialKey, JSON.stringify(listaHistorial));

      let url = `https://api.whatsapp.com/send?phone=50248502382&text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => mostrarProductos(productos));
  </script>
</body>
</html>
