<!-- 1. Cargamos primero los datos -->
<script src="productos.js"></script>

<!-- 2. Luego ejecutamos el script que pinta el catálogo -->
<script>
    const grid = document.getElementById('catalogo-grid');

    if (typeof productos !== 'undefined' && productos.length > 0) {
        grid.innerHTML = productos.map(p => `
            <div class="card">
                <img src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                <h3>${p.nombre}</h3>
                <p class="precio">Q ${p.precio.toFixed(2)}</p>
            </div>
        `).join('');
    } else {
        grid.innerHTML = '<p style="text-align:center; width:100%; color:#888;">Cargando productos o archivo no encontrado...</p>';
    }
</script>
