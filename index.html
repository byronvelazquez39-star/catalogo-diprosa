<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #27ae60;
            --wa-color: #25d366;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 120px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #121212;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 15px;
        }
        #buscar {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #333;
        }
        .card h3 {
            font-size: 14px;
            margin: 8px 0 4px 0;
        }
        .card p {
            font-size: 13px;
            color: #aaa;
            margin: 0 0 10px 0;
        }
        .precio {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
        }
        .btn-agregar {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e1e1e;
            border-top: 2px solid var(--accent-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 100;
        }
        .btn-enviar-wa {
            background-color: var(--wa-color);
            color: #121212;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #modal-ticket {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-align: center;
        }
        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            font-size: 14px;
            background-color: #121212;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
        }
        .btn-cerrar {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-enviar-modal {
            background-color: var(--wa-color);
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
