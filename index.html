<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 5px;
        }
        .card h3 {
            font-size: 0.9em;
            margin: 10px 0 5px 0;
            height: 2.8em;
            overflow: hidden;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.1em;
            margin: 5px 0;
        }
        .mensaje {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.1em;
        }
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebc57;
        }
    </style>
</head>
<body>

    <h1>Catálogo DIPROSA</h1>
    
    <div class="grid" id="catalogo-grid">
        <div class="mensaje">Cargando catálogo...</div>
    </div>

    <!-- Botón de WhatsApp -->
    <a href="https://wa.me/50248502382?text=Hola, me gustaría realizar un pedido del catálogo DIPROSA." class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
        💬 Pedir por WhatsApp
    </a>

    <!-- Cargar archivo de productos -->
    <script src="productos.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('catalogo-grid');
            
            try {
                if (typeof productos !== 'undefined' && Array.isArray(productos) && productos.length > 0) {
                    grid.innerHTML = productos.map(p => `
                        <div class="card">
                            <img src="${p.imagen || ''}" alt="${p.nombre || 'Producto'}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                            <h3>${p.nombre || 'Sin nombre'}</h3>
                            <p class="precio">Q ${typeof p.precio === 'number' ? p.precio.toFixed(2) : '0.00'}</p>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="mensaje">⚠️ No se encontró el archivo productos.js o está vacío.</div>';
                }
            } catch (error) {
                grid.innerHTML = '<div class="mensaje">❌ Error al cargar los productos en pantalla.</div>';
                console.error(error);
            }
        });
    </script>
</body>
</html>
