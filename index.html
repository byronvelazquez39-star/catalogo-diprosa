
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 5px;
        }
        .card h3 {
            font-size: 0.9em;
            margin: 10px 0 5px 0;
            height: 2.8em;
            overflow: hidden;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.1em;
            margin: 5px 0;
        }
        /* Botón flotante de WhatsApp */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebc57;
        }
    </style>
</head>
<body>

    <h1>Catálogo DIPROSA</h1>
    
    <div class="grid" id="catalogoGrid">
        <p style="text-align: center; width: 100%; color: #888;">Cargando productos...</p>
    </div>

    <!-- Botón de WhatsApp -->
    <a href="https://wa.me/50248502382?text=Hola,%20me%20gustaría%20realizar%20un%20pedido%20del%20catálogo%20DIPROSA." class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
        💬 Pedir por WhatsApp
    </a>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycby8Tsz4nbtawAEospmJfP29RLk40g-27PahblVhp0tr9wZsP7jnrbnRRIcwPEFHAT7DfA/exec";

        async function cargarCatalogo() {
            try {
                let respuesta = await fetch(URL_API);
                let productos = await respuesta.json();
                let grid = document.getElementById('catalogoGrid');
                grid.innerHTML = '';

                if (!Array.isArray(productos) || productos.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #888;">No hay productos disponibles en este momento.</p>';
                    return;
                }

                productos.forEach(p => {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${p.imagen || 'https://via.placeholder.com/150?text=Sin+Imagen'}" alt="${p.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                        <h3>${p.nombre}</h3>
                        <p class="precio">Q ${parseFloat(p.precio || 0).toFixed(2)}</p>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error("Error cargando catálogo:", e);
                document.getElementById('catalogoGrid').innerHTML = '<p style="text-align: center; color: #ff5252;">Error al cargar el catálogo.</p>';
            }
        }

        window.onload = cargarCatalogo;
    </script>
</body>
</html>
