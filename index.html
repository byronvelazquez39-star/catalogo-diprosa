<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo y Rendimiento - DIPROSA</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 15px; box-sizing: border-box; }
    .header { text-align: center; margin-bottom: 15px; }
    h1 { color: #ff9800; font-size: 18px; margin: 0; }
    
    /* Botones de Rendimiento */
    .menu-rendimiento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-menu { background: #1e1e1e; border: 1px solid #38bdf8; color: #38bdf8; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; text-align: center; cursor: pointer; }
    .btn-menu.sueldo { border-color: #27ae60; color: #27ae60; }
    
    /* Buscador del Catálogo */
    .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 14px; margin-bottom: 15px; box-sizing: border-box; }
    
    /* Listado de Productos */
    .productos-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
    .producto-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .producto-info h4 { margin: 0 0 5px 0; font-size: 14px; color: #fff; }
    .producto-info p { margin: 0; font-size: 12px; color: #38bdf8; font-weight: bold; }
    .btn-agregar { background: #ff9800; color: #121212; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

    /* Ventanas Modales (Popups) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 15px; box-sizing: border-box; overflow-y: auto; }
    .modal-content { background: #1e1e1e; border: 1px solid #444; border-radius: 10px; padding: 15px; max-width: 500px; margin: 30px auto; position: relative; }
    .close-btn { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 5px; float: right; font-weight: bold; cursor: pointer; }
    
    .card { background: #252525; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .card h2 { color: #38bdf8; font-size: 15px; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 6px; }
    
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .label { color: #aaa; }
    .value { font-weight: bold; color: #fff; }
