<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DIPROSA</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #27ae60;
      --wa-color: #25d366;
      --danger-color: #e74c3c;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      padding-bottom: 120px;
    }
    .welcome-banner {
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      color: #121212;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .welcome-banner h2 { margin: 0 0 5px 0; font-size: 18px; color: #fff; }
    .welcome-banner p { margin: 0; font-size: 13px; color: #e0f2f1; }

    h1 { text-align: center; margin-bottom: 15px; font-size: 22px; }
    .search-box {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 20px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      box-sizing: border-box;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .nombre { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
    .precio { font-size: 16px; color: var(--accent-color); font-weight: bold; margin-bottom: 10px; }
    
    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-qty {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qty:active { background-color: #555; }
    .qty-num { font-size: 16px; font-weight: bold; min-width: 20px; }

    .btn-add {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .btn-cargar-mas {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      margin-top: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Barra Flotante */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1f1f1f;
      border-top: 2px solid #333;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .cart-info { font-size: 15px; cursor: pointer; }
    .cart-total { font-size: 18px; color: var(--accent-color); font-weight: bold; }
    .btn-wa {
      background-color: var(--wa-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    /* Modal Ticket */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-content {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid #444;
    }
    .ticket-header { text-align: center; border-bottom: 1px dashed #555; padding-bottom: 10px; margin-bottom: 15px; }
    .ticket-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .ticket-item-info { flex-grow: 1; margin-right: 10px; }
    .ticket-item-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .ticket-item-sub { font-size: 12px; color: #aaa; }
    .ticket-item-subtotal { font-size: 13px; font-weight: bold; color: var(--accent-color); margin-top: 2px; }
    
    .ticket-actions { display: flex; align-items: center; gap: 4px; }
    .btn-ticket-qty {
      background: #333;
      color: white;
      border: 1px solid #555;
      width: 26px; height: 26px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-delete {
      background: var(--danger-color);
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .client-info-section {
      background: #252525;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .client-info-section label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; color: #bbb; }
    .client-input {
      width: 100%;
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .discount-section {
      background: #252525;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .discount-section label { font-size: 14px; font-weight: bold; }
    .discount-select {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-close { background: #555; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    
    .btn-modal-wa { 
      background: var(--wa-color); 
      color: white; 
      border: none;
      width: 100%;
      text-align: center;
      padding: 12px 15px; 
      border-radius: 6px; 
      font-weight: bold; 
      margin-top: 5px; 
      font-size: 16px; 
      cursor: pointer;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Saludo de bienvenida -->
  <div class="welcome-banner">
    <h2>👋 ¡Bienvenido a DIPROSA!</h2>
    <p>Selecciona tus productos, arma tu ticket y envíanos tu pedido directamente por WhatsApp.</p>
  </div>

  <h1>📦 Catálogo en Línea</h1>
  <input type="text" id="buscar" class="search-box" placeholder="Buscar producto..." oninput="filtrarDebounce()">

  <div id="catalogo" class="grid">Cargando productos...</div>
  <button id="btn-mas" class="btn-cargar-mas" style="display:none;" onclick="cargarMasProductos()">Cargar más productos...</button>

  <!-- Barra Flotante -->
  <div class="cart-bar">
    <div class="cart-info" onclick="abrirTicket()">
      <div>🛒 <span id="cant-items">0</span> ítems (Ver Ticket)</div>
      <div class="cart-total">Total: Q <span id="total-precio">0.00</span></div>
    </div>
    <button class="btn-wa" onclick="abrirTicket()">📋 Ver Ticket</button>
  </div>

  <!-- Modal Ticket -->
  <div id="modal-ticket" class="modal">
    <div class="modal-content">
      <div class="ticket-header">
        <h3>🧾 TICKET DE COMPRA</h3>
        <p style="font-size: 12px; color: #888;" id="ticket-fecha"></p>
        <p style="font-size: 14px; font-weight: bold; color: #27ae60;" id="ticket-numero-label"></p>
      </div>
      
      <div id="ticket-items"></div>

      <!-- Datos del Cliente y Ubicación -->
      <div class="client-info-section">
        <label for="cliente-receptor">👤 Receptor / Nombre del Cliente:</label>
        <input type="text" id="cliente-receptor" class="client-input" placeholder="Ej. Tienda Mi Barrio">

        <label for="cliente-referencia">📍 Referencias para el Repartidor:</label>
        <textarea id="cliente-referencia" class="client-input" rows="2" placeholder="Ej. Esquina color celeste, frente a la gasolinera..."></textarea>
      </div>

      <!-- Selector de Descuento -->
      <div class="discount-section">
        <label for="descuento-pct">Descuento aplicado:</label>
        <select id="descuento-pct" class="discount-select" onchange="actualizarContenidoTicket()">
          <option value="0">Sin descuento (0%)</option>
          <option value="1">1 %</option>
          <option value="2">2 %</option>
          <option value="3">3 %</option>
        </select>
      </div>

      <div id="resumen-totales" style="border-top: 1px dashed #555; padding-top: 10px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 5px;">
          <span>Subtotal:</span>
          <span>Q <span id="ticket-subtotal">0.00</span></span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #e67e22; margin-bottom: 5px;" id="fila-rebaja">
          <span>Descuento (<span id="txt-pct">0</span>%):</span>
          <span>- Q <span id="ticket-descuento-monto">0.00</span></span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; color: var(--accent-color);">
          <span>Total Final:</span>
          <span>Q <span id="ticket-total">0.00</span></span>
        </div>
      </div>

      <button class="btn-modal-wa" onclick="enviarWhatsAppYLimpiar()">📲 Enviar Pedido a WhatsApp</button>
      <button class="btn-close" onclick="cerrarTicket()">Seguir Comprando</button>
    </div>
  </div>

  <script>
    const NUMERO_WHATSAPP = "50248502382"; 

    let productos = [];
    let productosFiltrados = [];
    let limiteActual = 40;
    
    // Variables para capturar los tiempos del ticket
    let horaInicioTicket = null;
    let horaFinalTicket = null;
    
    let carrito = {};
    try {
      let guardado = JSON.parse(localStorage.getItem('carrito_diprosa'));
      if (guardado && typeof guardado === 'object') {
        for (let k in guardado) {
          let item = guardado[k];
          let cant = parseInt(item && item.cantidad);
          let prec = parseFloat(item && item.precio);
          if (item && item.nombre && !isNaN(prec) && !isNaN(cant) && cant > 0) {
            carrito[k] = { nombre: item.nombre, precio: prec, cantidad: cant };
          }
        }
      }
    } catch(e) {
      carrito = {};
    }

    let debounceTimer;

    fetch('productos.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        productos = data;
        productosFiltrados = data;
        renderizarCatalogo();
        actualizarUIResumen();
      })
      .catch(() => {
        document.getElementById('catalogo').innerHTML = '<p style="color:#e74c3c;">Error al cargar los productos.</p>';
      });

    function obtenerKey(nombre, precio) {
      return nombre.trim() + '_' + parseFloat(precio);
    }

    function renderizarCatalogo() {
      const contenedor = document.getElementById('catalogo');
      if (!productosFiltrados || productosFiltrados.length === 0) {
        contenedor.innerHTML = '<p>No se encontraron productos.</p>';
        document.getElementById('btn-mas').style.display = 'none';
        return;
      }

      const listaCorte = productosFiltrados.slice(0, limiteActual);
      let html = '';
      
      listaCorte.forEach((p) => {
        const pKey = obtenerKey(p.nombre, p.precio);
        let cant = 0;
        if (carrito[pKey] && !isNaN(carrito[pKey].cantidad)) {
          cant = parseInt(carrito[pKey].cantidad);
        }
        const nombreB64 = btoa(unescape(encodeURIComponent(p.nombre)));

        html += `
          <div class="card">
            <div>
              <div class="nombre">${p.nombre}</div>
            </div>
            <div>
              <div class="precio">Q ${parseFloat(p.precio).toFixed(2)}</div>
              ${cant === 0 ? `
                <button class="btn-add" onclick="cambiarCant('${nombreB64}',${p.precio}, 1)">+ Agregar</button>
              ` : `
                <div class="qty-controls">
                  <button class="btn-qty" onclick="cambiarCant('${nombreB64}',${p.precio}, -1)">-</button>
                  <span class="qty-num">${cant}</span>
                  <button class="btn-qty" onclick="cambiarCant('${nombreB64}',${p.precio}, 1)">+</button>
                </div>
              `}
            </div>
          </div>
        `;
      });
      
      contenedor.innerHTML = html;

      if (productosFiltrados.length > limiteActual) {
        document.getElementById('btn-mas').style.display = 'block';
      } else {
        document.getElementById('btn-mas').style.display = 'none';
      }
    }

    function cargarMasProductos() {
      limiteActual += 40;
      renderizarCatalogo();
    }

    function cambiarCant(nombreB64, precio, delta) {
      // Registrar la hora de inicio al agregar el primer producto al carrito
      if (Object.keys(carrito).length === 0 && delta > 0 && !horaInicioTicket) {
        horaInicioTicket = new Date().toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      const nombre = decodeURIComponent(escape(atob(nombreB64)));
      const pKey = obtenerKey(nombre, precio);
      const precioNum = parseFloat(precio);

      if (!carrito[pKey] || isNaN(carrito[pKey].cantidad)) {
        carrito[pKey] = { nombre: nombre, precio: precioNum, cantidad: 0 };
      }
      
      carrito[pKey].cantidad += parseInt(delta);

      if (carrito[pKey].cantidad <= 0) {
        delete carrito[pKey];
      }

      if (Object.keys(carrito).length === 0) {
        horaInicioTicket = null;
      }

      localStorage.setItem('carrito_diprosa', JSON.stringify(carrito));
      actualizarUIResumen();
      renderizarCatalogo();
    }

    function eliminarDelTicketDirecto(nombreB64, precio) {
      const nombre = decodeURIComponent(escape(atob(nombreB64)));
      const pKey = obtenerKey(nombre, precio);
      
      delete carrito[pKey];

      if (Object.keys(carrito).length === 0) {
        horaInicioTicket = null;
      }

      localStorage.setItem('carrito_diprosa', JSON.stringify(carrito));
      actualizarUIResumen();
      renderizarCatalogo();
    }

    function actualizarUIResumen() {
      let totalCant = 0;
      let totalMonto = 0;
      for (let k in carrito) {
        let item = carrito[k];
        if (item && !isNaN(item.cantidad) && !isNaN(item.precio)) {
          let cant = parseInt(item.cantidad);
          let prec = parseFloat(item.precio);
          totalCant += cant;
          totalMonto += cant * prec;
        }
      }
      document.getElementById('cant-items').innerText = totalCant;
      document.getElementById('total-precio').innerText = totalMonto.toFixed(2);
      
      if(document.getElementById('modal-ticket').style.display === 'flex') {
        actualizarContenidoTicket();
      }
    }

    function filtrarDebounce() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const q = document.getElementById('buscar').value.toLowerCase().trim();
        limiteActual = 40;
        if (q === "") {
          productosFiltrados = productos;
        } else {
          productosFiltrados = productos.filter(p => 
            (p.nombre && p.nombre.toLowerCase().includes(q))
          );
        }
        renderizarCatalogo();
      }, 200);
    }

    function obtenerSiguienteTicket() {
      let ultimoNum = parseInt(localStorage.getItem('correlativo_ticket')) || 0;
      return ultimoNum + 1;
    }

    function abrirTicket() {
      const keys = Object.keys(carrito);
      if(keys.length === 0) {
        alert("El carrito está vacío. Agrega productos primero.");
        return;
      }
      actualizarContenidoTicket();
      document.getElementById('modal-ticket').style.display = 'flex';
    }

    function actualizarContenidoTicket() {
      const keys = Object.keys(carrito);
      const contenedor = document.getElementById('ticket-items');
      contenedor.innerHTML = '';
      let subtotalGeneral = 0;

      if(keys.length === 0) {
        cerrarTicket();
        return;
      }

      keys.forEach(k => {
        const item = carrito[k];
        if (!item || isNaN(item.cantidad) || isNaN(item.precio)) return;

        let cant = parseInt(item.cantidad);
        let prec = parseFloat(item.precio);
        const subtotal = cant * prec;
        subtotalGeneral += subtotal;
        
        const nombreB64 = btoa(unescape(encodeURIComponent(item.nombre)));

        contenedor.innerHTML += `
          <div class="ticket-item">
            <div class="ticket-item-info">
              <div class="ticket-item-title">${item.nombre}</div>
              <div class="ticket-item-sub">Precio unitario: Q ${prec.toFixed(2)} c/u</div>
              <div class="ticket-item-subtotal">Subtotal (${cant}): Q ${subtotal.toFixed(2)}</div>
            </div>
            <div class="ticket-actions">
              <button class="btn-ticket-qty" onclick="cambiarCant('${nombreB64}', ${prec}, -1)">-</button>
              <span style="font-weight:bold; min-width:15px; text-align:center;">${cant}</span>
              <button class="btn-ticket-qty" onclick="cambiarCant('${nombreB64}', ${prec}, 1)">+</button>
              <button class="btn-delete" onclick="eliminarDelTicketDirecto('${nombreB64}', ${prec})">🗑️</button>
            </div>
          </div>
        `;
      });

      const pctDescuento = parseInt(document.getElementById('descuento-pct').value) || 0;
      const montoDescuento = (subtotalGeneral * pctDescuento) / 100;
      const totalFinal = subtotalGeneral - montoDescuento;

      document.getElementById('ticket-subtotal').innerText = subtotalGeneral.toFixed(2);
      document.getElementById('txt-pct').innerText = pctDescuento;
      document.getElementById('ticket-descuento-monto').innerText = montoDescuento.toFixed(2);
      document.getElementById('ticket-total').innerText = totalFinal.toFixed(2);
      
      if(pctDescuento > 0) {
        document.getElementById('fila-rebaja').style.display = 'flex';
      } else {
        document.getElementById('fila-rebaja').style.display = 'none';
      }

      document.getElementById('ticket-fecha').innerText = new Date().toLocaleString('es-GT');
      const numActual = obtenerSiguienteTicket();
      document.getElementById('ticket-numero-label').innerText = "Tiquete # " + String(numActual).padStart(8, '0');
    }

    function cerrarTicket() {
      document.getElementById('modal-ticket').style.display = 'none';
    }

    function enviarWhatsAppYLimpiar() {
      const keys = Object.keys(carrito);
      if (keys.length === 0) {
        alert("El carrito está vacío.");
        return;
      }

      const receptor = document.getElementById('cliente-receptor').value.trim();
      const referencia = document.getElementById('cliente-referencia').value.trim();

      if (receptor === "") {
        alert("Por favor ingresa el nombre del Receptor / Cliente.");
        document.getElementById('cliente-receptor').focus();
        return;
      }

      // Capturar la hora final al momento de presionar enviar
      horaFinalTicket = new Date().toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (!horaInicioTicket) {
        horaInicioTicket = horaFinalTicket;
      }

      let numTicketNum = obtenerSiguienteTicket();
      localStorage.setItem('correlativo_ticket', numTicketNum);
      const numTicketStr = "Tiquete # " + String(numTicketNum).padStart(8, '0');

      let subtotalGeneral = 0;
      keys.forEach(k => {
        let item = carrito[k];
        if (item && !isNaN(item.cantidad) && !isNaN(item.precio)) {
          subtotalGeneral += parseInt(item.cantidad) * parseFloat(item.precio);
        }
      });

      const pctDescuento = parseInt(document.getElementById('descuento-pct').value) || 0;
      const montoDescuento = (subtotalGeneral * pctDescuento) / 100;
      const totalFinal = subtotalGeneral - montoDescuento;

      let mensaje = "*DISTRIBUIDORA DIPROSITRIX*\n";
      mensaje += "*" + numTicketStr + "*\n";
      mensaje += "Fecha: " + new Date().toLocaleDateString('es-GT') + "\n";
      mensaje += "⏱️ Hora Inicio: " + horaInicioTicket + "\n";
      mensaje += "🏁 Hora Final: " + horaFinalTicket + "\n\n";
      mensaje += "Receptor: " + receptor + "\n";
      mensaje += "Referencias: " + (referencia !== "" ? referencia : "Ninguna") + "\n";
      mensaje += "Forma de Pago: Contado\n";
      mensaje += "--------------------------------\n";
      mensaje += "DETALLE DE PRODUCTOS:\n";

      let i = 1;
      keys.forEach(k => {
        const item = carrito[k];
        if (!item || isNaN(item.cantidad) || isNaN(item.precio)) return;

        let cant = parseInt(item.cantidad);
        let prec = parseFloat(item.precio);
        const subtotal = cant * prec;
        mensaje += i + ". " + item.nombre + "\n";
        mensaje += "   Cant: " + cant + " x Q" + prec.toFixed(2) + " = Q" + subtotal.toFixed(2) + "\n";
        i++;
      });

      mensaje += "--------------------------------\n";
      mensaje += "Subtotal: Q" + subtotalGeneral.toFixed(2) + "\n";
      if(pctDescuento > 0) {
        mensaje += "Descuento (" + pctDescuento + "%): -Q" + montoDescuento.toFixed(2) + "\n";
      }
      mensaje += "TOTAL A PAGAR: Q" + totalFinal.toFixed(2) + "\n";
      mensaje += "--------------------------------\n";
      mensaje += "¡Hola! Confirmo este pedido por favor.";

      const urlWA = "https://api.whatsapp.com/send?phone=" + NUMERO_WHATSAPP + "&text=" + encodeURIComponent(mensaje);

      // Vaciar completamente el carrito antes de redirigir a WhatsApp
      carrito = {};
      horaInicioTicket = null;
      horaFinalTicket = null;
      localStorage.removeItem('carrito_diprosa');
      document.getElementById('cliente-receptor').value = "";
      document.getElementById('cliente-referencia').value = "";
      
      actualizarUIResumen();
      renderizarCatalogo();
      cerrarTicket();

      // Abrir WhatsApp después de forzar la limpieza visual del catálogo
      window.open(urlWA, '_blank');
    }
  </script>

</body>
</html>
