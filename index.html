<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Estuardo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; padding-bottom: 80px; }
        h1 { text-align: center; color: #ff9800; font-size: 18px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background-color: #222; color: #fff; box-sizing: border-box; }
        .product-card { background-color: #1e1e1e; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .product-info strong { font-size: 14px; display: block; }
        .product-info span { font-size: 13px; color: #4CAF50; }
        .btn { background-color: #ff9800; color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* Botón Flotante (Oculto por defecto) */
        .cart-float-btn {
            display: none; /* Inicia oculto */
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background-color: #25D366;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 99;
            justify-content: space-between;
            align-items: center;
        }

        /* Ventana Flotante (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1e1e1e;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #444;
            box-sizing: border-box;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: #ff9800; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
        .cart-item { font-size: 14px; margin-bottom: 8px; color: #ddd; }
        .cart-total { font-size: 18px; font-weight: bold; color: #4CAF50; margin: 15px 0; }
        .btn-send { background-color: #25D366; color: #fff; width: 100%; padding: 12px; font-size: 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🛒 Catálogo DIPROSA - Vendedor: ESTUARDO</h1>

    <div class="input-group">
        <label for="clienteNombre">Nombre del Cliente / Tienda:</label>
        <input type="text" id="clienteNombre" placeholder="Ej. Tienda La Guadalupana">
    </div>

    <h3 style="font-size: 15px; color: #aaa;">Productos Disponibles</h3>
    <div id="productsList">
        <div class="product-card">
            <div class="product-info">
                <strong>Limonada Salvavidas lata</strong>
                <span>Q 67.00</span>
            </div>
            <button class="btn" onclick="addToCart('Limonada Salvavidas lata', 67.00)">+ Agregar</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <strong>Soda Naranjada Carnaval lata</strong>
                <span>Q 67.00</span>
            </div>
            <button class="btn" onclick="addToCart('Soda Naranjada Carnaval lata', 67.00)">+ Agregar</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <strong>Almohadita fardo 4 oz</strong>
                <span>Q 110.00</span>
            </div>
            <button class="btn" onclick="addToCart('Almohadita fardo 4 oz', 110.00)">+ Agregar</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <strong>Salvavidas Roja lata</strong>
                <span>Q 67.00</span>
            </div>
            <button class="btn" onclick="addToCart('Salvavidas Roja lata', 67.00)">+ Agregar</button>
        </div>
    </div>

    <!-- Botón Flotante Verde (Oculto por defecto) -->
    <button class="cart-float-btn" id="floatBtn" onclick="toggleModal(true)">
        <span>🛒 Ver Pedido (<span id="cartCount">0</span>)</span>
        <span>Q <span id="floatTotal">0.00</span></span>
    </button>

    <!-- Modal del Resumen del Pedido -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 Resumen del Pedido</h3>
                <button class="close-btn" onclick="toggleModal(false)">✖</button>
            </div>
            <div id="cartItems" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
            <div class="cart-total">Total: Q <span id="cartTotal">0.00</span></div>
            <button class="btn-send" onclick="enviarPedido()">📲 Confirmar y Enviar por WhatsApp</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItems");
            const totalEl = document.getElementById("cartTotal");
            const floatTotalEl = document.getElementById("floatTotal");
            const countEl = document.getElementById("cartCount");
            const floatBtn = document.getElementById("floatBtn");

            if (cart.length === 0) {
                container.innerHTML = `<span style="font-style: italic; color: #888;">El carrito está vacío.</span>`;
                totalEl.innerText = "0.00";
                floatTotalEl.innerText = "0.00";
                countEl.innerText = "0";
                floatBtn.style.display = "none"; // Se oculta totalmente
                return;
            }

            // Muestra el botón verde sólo si hay al menos 1 producto
            floatBtn.style.display = "flex";

            let html = "";
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                count += item.qty;
                html += `<div class="cart-item">• ${item.name} (x${item.qty}) = Q${subtotal.toFixed(2)}</div>`;
            });

            container.innerHTML = html;
            totalEl.innerText = total.toFixed(2);
            floatTotalEl.innerText = total.toFixed(2);
            countEl.innerText = count;
        }

        function toggleModal(show) {
            document.getElementById("cartModal").style.display = show ? "flex" : "none";
        }

        function enviarPedido() {
            if (cart.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            const cliente = document.getElementById("clienteNombre").value || "Cliente General";
            const totalVenta = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Guardar tiquete para el panel de administración
            const nuevoTiquete = {
                fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                cliente: cliente,
                items: cart.map(item => ({ name: item.name, qty: item.qty, price: item.price })),
                total: totalVenta
            };

            let tiquetesGuardados = JSON.parse(localStorage.getItem('diprosa_tickets_estuardo')) || [];
            tiquetesGuardados.push(nuevoTiquete);
            localStorage.setItem('diprosa_tickets_estuardo', JSON.stringify(tiquetesGuardados));

            // Armar mensaje para WhatsApp
            let mensaje = `DISTRIBUIDORA DIPROSA\n👤 Vendedor: ESTUARDO\n👤 Cliente: ${cliente}\n------------------------------\n`;
            cart.forEach(item => {
                mensaje += `${item.name} (x${item.qty}) = Q${(item.price * item.qty).toFixed(2)}\n`;
            });
            mensaje += `------------------------------\nTOTAL: Q${totalVenta.toFixed(2)}\n¡Hola! Confirmo este pedido.`;

            // Limpiar todo y ocultar botón
            cart = [];
            renderCart();
            document.getElementById("clienteNombre").value = "";
            toggleModal(false);

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
