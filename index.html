<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DIPROSA - Vendedor Estuardo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      color: #ff9800;
      font-size: 18px;
      margin: 0;
    }
    .subhead {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
      box-sizing: border-box;
      outline: none;
    }
    .search-box:focus {
      border-color: #ff9800;
    }

    .productos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 80px;
    }
    .producto-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .producto-info h4 {
      margin: 0 0 4px 0;
      font-size: 13px;
      color: #fff;
    }
    .producto-info p {
      margin: 0;
      font-size: 12px;
      color: #38bdf8;
      font-weight: bold;
    }
    .btn-agregar {
      background: #27ae60;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    /* BARRA FLOTANTE DE PEDIDO Y TIQUETE */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #181818;
      border-top: 1px solid #333;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 100;
    }
    .cart-info {
      font-size: 13px;
      font-weight: bold;
      color: #27ae60;
    }
    .btn-ticket {
      background: #ff9800;
      color: #121212;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 CATÁLOGO DIPROSA</h1>
    <div class="subhead">Vendedor: Estuardo (Ruta)</div>
  </div>

  <input type="text" class="search-box" placeholder="🔍 Escriba para buscar producto..." id="buscador" onkeyup="filtrarProductosDebounce()">

  <div class="productos-grid" id="lista-productos">
    <p style="text-align: center; color: #aaa; font-size: 12px;" id="msg-cargando">Cargando catálogo completo...</p>
  </div>

  <div class="cart-bar">
    <div class="cart-info" id="cart-resumen">0 ítems | Total: Q 0.00</div>
    <button class="btn-ticket" onclick="generarTicketWhatsApp()">🛒 Ver Ticket / Pedido</button>
  </div>

  <script>
    let productosData = [];
    let carrito = [];
    let timerDebounce = null;

    // CARGA Y RENDERIZADO DESDE ARCHIVO PRODUCTOS.CSV
    function cargarCatalogoOriginal() {
      fetch('productos.csv')
        .then(res => res.text())
        .then(data => {
          let lineas = data.split('\n');
          productosData = [];
          for (let i = 1; i < lineas.length; i++) {
            let l = lineas[i].trim();
            if (l) {
              let p = l.split(',');
              if (p.length >= 2) {
                let nombre = p[0].replace(/"/g, '').trim();
                let precio = parseFloat(p[1].replace(/"/g, '').trim()) || 0;
                productosData.push({ nombre, precio });
              }
            }
          }
          renderizarLista(productosData);
        })
        .catch(err => {
          document.getElementById('msg-cargando').innerText = "Catálogo listo.";
        });
    }

    function renderizarLista(lista) {
      let contenedor = document.getElementById('lista-productos');
      if (lista.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center; color:#888; font-size:12px;">No se encontraron productos.</p>';
        return;
      }
      let html = '';
      lista.forEach(p => {
        html += `
          <div class="producto-card">
            <div class="producto-info">
              <h4>${p.nombre}</h4>
              <p>Q ${p.precio.toFixed(2)}</p>
            </div>
            <button class="btn-agregar" onclick="agregarAlCarrito('${p.nombre.replace(/'/g, "\\'")}', ${p.precio})">+ Agregar</button>
          </div>
        `;
      });
      contenedor.innerHTML = html;
    }

    function filtrarProductosDebounce() {
      clearTimeout(timerDebounce);
      timerDebounce = setTimeout(() => {
        let txt = document.getElementById('buscador').value.toLowerCase();
        let res = productosData.filter(p => p.nombre.toLowerCase().includes(txt));
        renderizarLista(res);
      }, 200);
    }

    function agregarAlCarrito(nombre, precio) {
      carrito.push({ nombre, precio });
      actualizarResumenCarrito();
    }

    function actualizarResumenCarrito() {
      let total = 0;
      carrito.forEach(item => total += item.precio);
      document.getElementById('cart-resumen').innerText = `${carrito.length} ítems | Total: Q ${total.toFixed(2)}`;
    }

    function generarTicketWhatsApp() {
      if (carrito.length === 0) {
        alert("El carrito está vacío. Agregue productos antes de generar el ticket.");
        return;
      }
      let total = 0;
      let detalle = "*NUEVO PEDIDO DE RUTA - ESTUARDO*\n\n";
      carrito.forEach((item, index) => {
        detalle += `${index + 1}. ${item.nombre} - Q ${item.precio.toFixed(2)}\n`;
        total += item.precio;
      });
      detalle += `\n*TOTAL: Q ${total.toFixed(2)}*`;

      let url = "https://api.whatsapp.com/send?phone=50248502382&text=" + encodeURIComponent(detalle);
      window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', cargarCatalogoOriginal);
  </script>

</body>
</html>
