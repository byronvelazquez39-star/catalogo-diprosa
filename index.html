<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo en Línea - DIPROSA</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      padding-bottom: 90px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #121824;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      margin-bottom: 12px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-mis-metas {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .badge-metas {
      background-color: #0f172a;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background-color: #121824;
      color: #ffffff;
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 15px;
      outline: none;
    }

    .search-box::placeholder {
      color: #64748b;
    }

    .grid-productos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card-producto {
      background-color: #121824;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .prod-nombre {
      font-size: 0.8rem;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .prod-precio {
      color: #22c55e;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .btn-agregar {
      background-color: #15803d;
      color: #ffffff;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-agregar:active { background-color: #166534; }

    /* PANELES MODALES */
    .modal-panel {
      display: none;
      background-color: #121824;
      border: 1px solid #0284c7;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }

    .item-meta, .item-ticket {
      background-color: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.82rem;
    }

    /* BARRA INFERIOR */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0b0e14;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      border-top: 1px solid #1e293b;
      z-index: 500;
    }

    .btn-ver-ticket {
      background-color: #16a34a;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <div class="header-bar">
    <div class="header-title">📦 Catálogo en Línea</div>
    <button class="btn-mis-metas" onclick="toggleMetas()">
      📋 Mis Metas <span class="badge-metas">82/312</span>
    </button>
  </div>

  <!-- PANEL DE METAS -->
  <div id="panelMetas" class="modal-panel">
    <div class="modal-header">
      <span style="font-weight:bold; color:#38bdf8; font-size:0.9rem;">📊 Resumen de Avance Actual</span>
      <button onclick="toggleMetas()" style="background:none; border:none; color:#fff; font-size:1rem; cursor:pointer;">✕</button>
    </div>
    <div class="item-meta">💰 <strong>Ventas:</strong> Meta Q3,000.00 | Acumulado: Q35,022.49 <div style="color: #4ade80; margin-top: 2px;">Diferencia: +Q32,022.49</div></div>
    <div class="item-meta">🎫 <strong>Tickets:</strong> Meta 312 | Real: 82 tickets <div style="color: #f87171; margin-top: 2px;">Faltante: -230 tickets</div></div>
    <div class="item-meta">⏱️ <strong>Horas:</strong> Meta 182 hrs | Real: 46.3 hrs <div style="color: #f87171; margin-top: 2px;">Faltante: -135.7 hrs</div></div>
  </div>

  <!-- PANEL DE TICKET DE COMPRA -->
  <div id="panelTicket" class="modal-panel" style="border-color: #16a34a;">
    <div class="modal-header">
      <span style="font-weight:bold; color:#4ade80; font-size:0.9rem;">🛒 Resumen del Ticket</span>
      <button onclick="abrirTicket()" style="background:none; border:none; color:#fff; font-size:1rem; cursor:pointer;">✕</button>
    </div>
    <div id="listaTicketContainer"></div>
    <div id="totalTicketContainer" style="font-weight: bold; margin-top: 8px; color: #4ade80; font-size: 0.95rem;"></div>
  </div>

  <!-- BUSCADOR -->
  <input type="text" class="search-box" placeholder="Buscar producto..." id="searchInput" oninput="filtrarProductos()">

  <!-- GRILLA DE PRODUCTOS -->
  <div class="grid-productos" id="gridProd"></div>

  <!-- BARRA INFERIOR -->
  <div class="footer-bar">
    <div>
      <div id="txtItems" style="font-size: 0.85rem; color: #cbd5e1;">🛒 0 ítems</div>
      <div id="txtTotal" style="font-size: 1rem; font-weight: bold; color: #4ade80;">Total: Q 0.00</div>
    </div>
    <button class="btn-ver-ticket" onclick="abrirTicket()">📋 Ver Ticket / Estado</button>
  </div>

  <script>
    // PEGA AQUÍ ABAJO TUS 1,327 PRODUCTOS (respetando el formato de ejemplo)
    const productos = [
      { id: 1, nombre: "(almohadita) 4 onzas por docena para dar Q.3.00", precio: 29.50 },
      { id: 2, nombre: "(almohadita) fardo 4 onzas para dar Q.3.00", precio: 110.00 },
      { id: 3, nombre: "(CARNAVAL) en lata SODA CON NARANJADA Caja de 24 unidades para dar Q.3.50", precio: 67.00 },
      { id: 4, nombre: "(Salvavidas) en lata LIMONADA Caja de 24 unidades para dar Q.3.50", precio: 67.00 },
      { id: 5, nombre: "(Salvavidas) en lata ROJA Caja de 24 unidades para dar Q.3.50", precio: 67.00 },
      { id: 6, nombre: "(Salvavidas) en lata UVA Caja de 24 unidades para dar Q.3.50", precio: 67.00 }
      // Puedes continuar agregando el resto de tus artículos aquí debajo separados por comas:
      // { id: 7, nombre: "Nombre del producto", precio: 0.00 },
    ];

    let carrito = [];

    function renderizar(lista) {
      const grid = document.getElementById("gridProd");
      grid.innerHTML = "";
      lista.forEach(p => {
        const card = document.createElement("div");
        card.className = "card-producto";
        card.innerHTML = `
          <div class="prod-nombre">${p.nombre}</div>
          <div class="prod-precio">Q ${p.precio.toFixed(2)}</div>
          <button class="btn-agregar" onclick="agregarItem('${p.nombre.replace(/'/g, "")}', ${p.precio})">+ Agregar</button>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarProductos() {
      const query = document.getElementById("searchInput").value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const filtrados = productos.filter(p => 
        p.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(query)
      );
      renderizar(filtrados);
    }

    function agregarItem(nombre, precio) {
      carrito.push({ nombre, precio });
      let total = carrito.reduce((sum, item) => sum + item.precio, 0);
      document.getElementById("txtItems").innerText = `🛒 ${carrito.length} ítems`;
      document.getElementById("txtTotal").innerText = `Total: Q ${total.toFixed(2)}`;
    }

    function abrirTicket() {
      let panelTicket = document.getElementById("panelTicket");
      let panelMetas = document.getElementById("panelMetas");
      panelMetas.style.display = "none"; 

      const container = document.getElementById("listaTicketContainer");
      container.innerHTML = "";

      if (carrito.length === 0) {
        container.innerHTML = `<div style="color:#94a3b8; text-align:center; padding: 6px;">El ticket está vacío.</div>`;
        document.getElementById("totalTicketContainer").innerText = "Total a Pagar: Q 0.00";
      } else {
        let total = 0;
        carrito.forEach((item, index) => {
          total += item.precio;
          const div = document.createElement("div");
          div.className = "item-ticket";
          div.innerHTML = `${index + 1}. ${item.nombre} <br><strong style="color:#4ade80;">Q ${item.precio.toFixed(2)}</strong>`;
          container.appendChild(div);
        });
        document.getElementById("totalTicketContainer").innerText = `TOTAL A PAGAR: Q ${total.toFixed(2)}`;
      }

      panelTicket.style.display = panelTicket.style.display === "block" ? "none" : "block";
    }

    function toggleMetas() {
      let panelTicket = document.getElementById("panelTicket");
      panelTicket.style.display = "none"; 

      let panelMetas = document.getElementById("panelMetas");
      panelMetas.style.display = panelMetas.style.display === "block" ? "none" : "block";
    }

    // Cargar todos los productos al iniciar la página
    renderizar(productos);
  </script>
</body>
</html>
