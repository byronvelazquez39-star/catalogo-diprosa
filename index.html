<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 5px;
        }
        .card h3 {
            font-size: 0.9em;
            margin: 10px 0 5px 0;
            height: 2.8em;
            overflow: hidden;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.1em;
            margin: 5px 0;
        }
        .btn-pedido {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
        }
        .btn-pedido:hover {
            background-color: #2563eb;
        }
        /* Botón flotante de WhatsApp */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebc57;
        }
    </style>
</head>
<body>

    <h1>Catálogo DIPROSA</h1>
    
    <div class="grid">
        <!-- Ejemplo de tarjeta de producto lista para usar -->
        <div class="card">
            <div>
                <img src="imagenes/producto1.jpg" alt="Producto" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                <h3>Nombre del Producto Ejemplo</h3>
                <p class="precio">Q 0.00</p>
            </div>
            <button class="btn-pedido" onclick="pedirProducto('Nombre del Producto Ejemplo', '0.00')">Pedir</button>
        </div>

        <!-- Copie y pegue más bloques .card aquí abajo según necesite sus productos -->
    </div>

    <!-- Botón de WhatsApp -->
    <a href="https://wa.me/50248502382?text=Hola, me gustaría realizar un pedido del catálogo DIPROSA." class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
        💬 Pedir por WhatsApp
    </a>

<script>
function pedirProducto(nombre, precio) {
    const telefono = "50248502382";
    const mensaje = `Hola, me interesa pedir: *${nombre}* (Precio: Q ${precio})`;
    window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
}
</script>

</body>
</html>
