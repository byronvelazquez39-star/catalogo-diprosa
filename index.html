<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Central / Estuardo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-top h2 {
            color: #f1c40f;
            margin: 0;
            font-size: 1.2em;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .mini-btn {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: none;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            text-align: center;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
        }
        .card h3 {
            font-size: 0.95em;
            margin: 0 0 10px 0;
            color: #ffffff;
            line-height: 1.4;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.2em;
            margin: 0 0 12px 0;
        }
        .btn-agregar {
            background-color: #1b8e3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0b0b;
            border-top: 2px solid #222;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.9em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #1b8e3e;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>🏢 CENTRAL / ESTUARDO</h2>
        <div class="header-btns">
            <a href="#" class="mini-btn">📊 Metas</a>
            <a href="#" class="mini-btn">💰 Sueldo</a>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando inventario...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <a href="#" id="whatsapp-pedido" class="ver-ticket-btn" target="_blank" rel="noopener noreferrer">
            📋 Ver Ticket
        </a>
    </div>

    <script>
        // Usamos la URL del Apps Script para traer los productos de forma segura y directa
        const APPS_SCRIPT_URL = 'https://google.com'; 
        const REQUEST_URL = APPS_SCRIPT_URL + '?action=getProducts&t=' + new Date().getTime();
        
        let productos = [];
        let carrito = {};

        async function cargarProductos() {
            try {
                const respuesta = await fetch(REQUEST_URL);
                if (!respuesta.ok) throw new Error('Error al conectar con el servidor');
                
                productos = await respuesta.json();
                
                // Si el script devolvió un error interno de Google Sheets
                if (productos.error) {
                    throw new Error(productos.error);
                }
                
                renderizarProductos(productos);
            } catch (error) {
                console.error(error);
                document.getElementById('catalogo-grid').innerHTML = 
                    `<p style="text-align: center; grid-column: 1 / -1; color: #e74c3c;">Error al sincronizar inventario. Asegúrese de que la pestaña de su Google Sheet se llame "Productos".</p>`;
            }
        }

        function renderizarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (!lista || lista.length === 0) {
                grid.innerHTML = `<p style="text-align: center; grid-column: 1 / -1;">No se encontraron productos en el inventario.</p>`;
                return;
            }

            grid.innerHTML = lista.map(p => `
                <div class="card">
                    <div>
                        <h3>${p.descripcion || 'Sin descripción'}</h3>
                        <p style="font-size: 0.85em; color: #aaa; margin: 0 0 8px 0;">${p.unidad || 'Unidad'} - Cód: ${p.codigo || '---'}</p>
                    </div>
                    <div>
                        <div class="precio">Q ${parseFloat(p.precio) > 0 ? parseFloat(p.precio).toFixed(2) : '---'}</div>
                        <button class="btn-agregar" onclick="agregarAlCarrito('${p.codigo}')">+ Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function filtrarProductos() {
            const termino = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => 
                (p.descripcion && p.descripcion.toLowerCase().includes(termino)) || 
                (p.codigo && p.codigo.toLowerCase().includes(termino))
            );
            renderizarProductos(filtrados);
        }

        function agregarAlCarrito(codigo) {
            const prod = productos.find(p => p.codigo === codigo);
            if (!prod) return;

            if (carrito[codigo]) {
                carrito[codigo].cantidad++;
            } else {
                carrito[carrito.codigo ? carrito.codigo : codigo] = { ...prod, cantidad: 1 };
                // Asegurar compatibilidad de llaves
                if(!carrito[codigo]) carrito[codigo] = { ...prod, cantidad: 1 };
            }
            actualizarInterfazCarrito();
        }

        function actualizarInterfazCarrito() {
            let totalItems = 0;
            let precioTotal = 0;
            let textoTicket = '*PEDIDO CENTRAL - DIPROSA (ESTUARDO)*\n\n';

            for (const key in carrito) {
                const item = carrito[key];
                if(item && item.cantidad) {
                    totalItems += item.cantidad;
                    let itemPrecio = parseFloat(item.precio) || 0;
                    precioTotal += itemPrecio * item.cantidad;
                    textoTicket += `- ${item.cantidad}x ${item.descripcion || 'Producto'} (${item.unidad || 'Unidad'})\n`;
                }
            }

            if(precioTotal > 0) {
                textoTicket += `\n*TOTAL ESTIMADO: Q ${precioTotal.toFixed(2)}*`;
            }

            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-quetzales').innerText = `Q ${precioTotal.toFixed(2)}`;

            const numeroTelefono = '50248502382'; 
            document.getElementById('whatsapp-pedido').href = `https://whatsapp.com{numeroTelefono}&text=${encodeURIComponent(textoTicket)}`;
            
            if (totalItems > 0) {
                enviarPanelCentral(textoTicket, precioTotal);
            }
        }

        async function enviarPanelCentral(detalleText, total) {
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        vendedor: 'ESTUARDO',
                        cliente: 'Venta Central',
                        total: total.toFixed(2),
                        detalle: detalleText
                    })
                });
            } catch (e) {
                console.error("Error registrando pedido:", e);
            }
        }

        window.onload = cargarProductos;
    </script>
</body>
