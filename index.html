<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 100px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 24px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin: 0 auto;
            display: block;
        }
        .search-box:focus {
            border-color: var(--accent-color);
        }
        .stats {
            margin-top: 8px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-code {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .card-price {
            font-size: 1.25rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-add:hover {
            background-color: var(--accent-hover);
        }
        .cart-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 360px;
            max-width: calc(100vw - 40px);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            max-height: 500px;
            z-index: 1000;
        }
        .cart-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-items {
            overflow-y: auto;
            padding: 12px 16px;
            flex-grow: 1;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .cart-item-info {
            flex-grow: 1;
            margin-right: 8px;
        }
        .cart-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-qty {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-remove {
            background-color: transparent;
            color: var(--danger-color);
            border: none;
            cursor: pointer;
            margin-left: 6px;
            font-size: 1.1rem;
        }
        .cart-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.2);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        .btn-whatsapp {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-whatsapp:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Catálogo DIPROSA</h1>
            <input type="text" id="searchInput" class="search-box" placeholder="Buscar productos...">
            <div id="stats" class="stats">Cargando productos...</div>
        </header>
        <div id="productGrid" class="grid"></div>
    </div>

    <div class="cart-float">
        <div class="cart-header">
            <span>🛒 Tu Pedido</span>
            <span id="cartCount">0 items</span>
        </div>
        <div id="cartItems" class="cart-items">
            <div style="color: var(--text-muted); text-align: center; padding: 20px;">Tu carrito está vacío</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">Q0.00</span>
            </div>
            <button id="whatsappBtn" class="btn-whatsapp" disabled onclick="enviarPedidoWhatsApp()">
                Enviar Pedido por WhatsApp 📱
            </button>
        </div>
    </div>

    <script>
        const NUMERO_WHATSAPP = "50248502382";
        let productos = [];
        let carrito = JSON.parse(localStorage.getItem('diprosa_carrito')) || {};

        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.toString().toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                productos = data;
                renderizarProductos(productos);
                actualizarCarritoUI();
            })
            .catch(error => {
                console.error('Error al cargar productos:', error);
                document.getElementById('stats').innerText = 'Error al cargar el catálogo de productos.';
            });

        function renderizarProductos(lista) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            document.getElementById('stats').innerText = `Mostrando ${lista.length} productos`;

            if (lista.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No se encontraron productos.</p>';
                return;
            }

            lista.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-code">Cód: ${p.codigo || 'N/A'}</div>
                        <div class="card-title">${p.nombre}</div>
                    </div>
                    <div>
                        <div class="card-price">Q${Number(p.precio).toFixed(2)}</div>
                        <button class="btn-add" onclick="agregarAlCarrito(${index})">Agregar +</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const termino = normalizarTexto(e.target.value);
            clearTimeout(debounceTimer);

            if (termino === "") {
                renderizarProductos(productos);
                return;
            }

            debounceTimer = setTimeout(() => {
                const filtrados = productos.filter(p => {
                    const nombreNorm = normalizarTexto(p.nombre);
                    const codigoNorm = normalizarTexto(p.codigo);
                    return nombreNorm.includes(termino) || codigoNorm.includes(termino);
                });
                renderizarProductos(filtrados);
            }, 250);
        });

        function agregarAlCarrito(index) {
            const producto = productos[index];
            const id = producto.codigo || producto.nombre;

            if (carrito[id]) {
                carrito[id].cantidad += 1;
            } else {
                carrito[id] = {
                    nombre: producto.nombre,
                    codigo: producto.codigo,
                    precio: Number(producto.precio),
                    cantidad: 1
                };
            }
            guardarYActualizar();
        }

        function cambiarCantidad(id, cambio) {
            if (carrito[id]) {
                carrito[id].cantidad += cambio;
                if (carrito[id].cantidad <= 0) {
                    delete carrito[id];
                }
            }
            guardarYActualizar();
        }

        function eliminarDelCarrito(id) {
            delete carrito[id];
            guardarYActualizar();
        }

        function guardarYActualizar() {
            localStorage.setItem('diprosa_carrito', JSON.stringify(carrito));
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const container = document.getElementById('cartItems');
            const totalElement = document.getElementById('cartTotal');
            const countElement = document.getElementById('cartCount');
            const whatsappBtn = document.getElementById('whatsappBtn');

            container.innerHTML = '';
            let total = 0;
            let totalItems = 0;
            const keys = Object.keys(carrito);

            if (keys.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Tu carrito está vacío</div>';
                totalElement.innerText = 'Q0.00';
                countElement.innerText = '0 items';
                whatsappBtn.disabled = true;
                return;
            }

            keys.forEach(id => {
                const item = carrito[id];
                total += item.precio * item.cantidad;
                totalItems += item.cantidad;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <div style="font-weight: 500;">${item.nombre}</div>
                        <div style="color: var(--text-muted); font-size: 0.8rem;">Q${item.precio.toFixed(2)} c/u</div>
                    </div>
                    <div class="cart-controls">
                        <button class="btn-qty" onclick="cambiarCantidad('${id}', -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="btn-qty" onclick="cambiarCantidad('${id}', 1)">+</button>
                        <button class="btn-remove" onclick="eliminarDelCarrito('${id}')">&times;</button>
                    </div>
                `;
                container.appendChild(div);
            });

            totalElement.innerText = `Q${total.toFixed(2)}`;
            countElement.innerText = `${totalItems} item${totalItems === 1 ? '' : 's'}`;
            whatsappBtn.disabled = false;
        }

        function enviarPedidoWhatsApp() {
            const keys = Object.keys(carrito);
            if (keys.length === 0) return;

            let mensaje = `*TICKET DE PEDIDO - DIPROSA*\n`;
            mensaje += `*Fecha:* ${new Date().toLocaleDateString()}\n`;
            mensaje += `-----------------------------------\n\n`;

            let subtotalGeneral = 0;
            keys.forEach(id => {
                const item = carrito[id];
                const subtotalItem = item.cantidad * item.precio;
                subtotalGeneral += subtotalItem;
                mensaje += `• *${item.nombre}* (Cod: ${item.codigo || 'N/A'})\n`;
                mensaje += `  Cant: *${item.cantidad}* | Subtotal: Q${subtotalItem.toFixed(2)}\n\n`;
            });

            mensaje += `-----------------------------------\n`;
            mensaje += `*TOTAL A PAGAR: Q${subtotalGeneral.toFixed(2)}*\n`;
            mensaje += `-----------------------------------\n`;
            mensaje += `👋 ¡Hola! Quisiera confirmar este pedido.`;

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
