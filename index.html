<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 {
            color: #ffc107;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #b0bec5;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: left;
        }
        .product-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-code {
            font-size: 12px;
            color: #9e9e9e;
        }
        .product-title {
            font-size: 15px;
            font-weight: bold;
            margin: 8px 0;
            color: #fff;
        }
        .product-price {
            font-size: 16px;
            color: #4caf50;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-wa-item {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-wa-item:hover {
            background-color: #20ba5a;
        }
    </style>
</head>

        function mostrarProductos(lista) {
            const container = document.getElementById("productContainer");
            container.innerHTML = "";
            
            if(lista.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; color: #888;'>No se encontraron productos.</p>";
                return;
            }

            lista.forEach(p => {
                const card = document.createElement("div");
                card.className = "product-card";
                
                const mensajeWa = encodeURIComponent(`Hola Diprosa, me interesa el producto: ${p.detalle} (Código: ${p.codigo}) con precio de ${p.precio}`);
                
                card.innerHTML = `
                    <div>
                        <div class="product-code">Código: ${p.codigo}</div>
                        <div class="product-title">${p.detalle}</div>
                    </div>
                    <div>
                        <div class="product-price">Precio: ${p.precio}</div>
                        <a href="https://wa.me/?text=${mensajeWa}" target="_blank" class="btn-wa-item">Pedir por WhatsApp</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = productos.filter(p => 
                p.detalle.toLowerCase().includes(query) || p.codigo.toLowerCase().includes(query)
            );
            mostrarProductos(filtrados);
        }

        // Cargar al iniciar
        mostrarProductos(productos);
    </script>
