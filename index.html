<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #27ae60;
            --wa-color: #25d366;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 120px;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #121212;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 15px;
        }
        #buscar {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-code {
            font-size: 11px;
            color: #888;
            margin: 0 0 6px 0;
            text-align: center;
        }
        .card h3 {
            font-size: 13px;
            margin: 0 0 8px 0;
            text-align: center;
            line-height: 1.2;
            font-weight: normal;
        }
        .precio {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1rem;
        }
        .btn-agregar {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 13px;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e1e1e;
            border-top: 2px solid var(--accent-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 100;
        }
        .btn-enviar-wa {
            background-color: var(--wa-color);
            color: #121212;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="welcome-banner">
        <h2>👋 ¡Bienvenido a DIPROSA!</h2>
        <p>Selecciona tus productos, arma tu ticket y envíanos tu pedido directamente por WhatsApp.</p>
    </div>

    <h1>📦 Catálogo en Línea</h1>
    <input type="text" id="buscar" placeholder="🔍 Buscar por nombre o código...">

    <div id="catalogo" class="grid">Cargando productos...</div>

    <div class="cart-bar" onclick="abrirTicket()">
        <div>🛒 Artículos: <span id="contador-carrito">0</span></div>
        <div>Total: <strong id="total-carrito">Q0.00</strong></div>
        <button class="btn-enviar-wa" onclick="event.stopPropagation(); abrirTicket();">Enviar Pedido 📱</button>
    </div>

    <script>
        const NUMERO_WHATSAPP = "50248502382";
        let productos = [];
        let carrito = JSON.parse(localStorage.getItem('carrito_diprosa')) || {};

        function guardarCarrito() {
            localStorage.setItem('carrito_diprosa', JSON.stringify(carrito));
            actualizarBarraFlotante();
        }

        fetch('productos.json')
            .then(res => res.json())
            .then(data => {
                productos = data;
                renderizar(productos);
                actualizarBarraFlotante();
            })
            .catch(() => {
                document.getElementById('catalogo').innerHTML = '<p>Error al cargar el catálogo.</p>';
            });

        function obtenerKey(p) {
            return (p.codigo + "_" + p.nombre).replace(/[^a-zA-Z0-9_]/g, "_");
        }

        function renderizar(lista) {
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = '';
            
            if(lista.length === 0) {
                contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron productos.</p>';
                return;
            }

            lista.forEach(p => {
                const key = obtenerKey(p);
                const enCarrito = carrito[key] ? carrito[key].cantidad : 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-code">${p.codigo}</div>
                        <h3>${p.nombre}</h3>
                    </div>
                    <div>
                        <div class="precio">Q ${Number(p.precio).toFixed(2)}</div>
                        <button class="btn-agregar" onclick='cambiarCantidad("${key}", 1)'>
                            ${enCarrito > 0 ? 'Agregados: ' + enCarrito : '+ Agregar'}
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        let timerBusqueda;
        document.getElementById('buscar').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase().trim();
            clearTimeout(timerBusqueda);
            
            if (texto === "") {
                renderizar(productos);
                return;
            }

            timerBusqueda = setTimeout(() => {
                const filtrados = productos.filter(p => 
                    p.nombre.toLowerCase().includes(texto) || 
                    String(p.codigo).toLowerCase().includes(texto)
                );
                renderizar(filtrados);
            }, 250);
        });

        function cambiarCantidad(key, delta) {
            const producto = productos.find(p => obtenerKey(p) === key);
            if (!producto) return;

            if (!carrito[key]) {
                carrito[key] = {
                    nombre: producto.nombre,
                    codigo: producto.codigo,
                    precio: Number(producto.precio),
                    cantidad: 0
                };
            }

            carrito[key].cantidad += delta;
            if (carrito[key].cantidad <= 0) {
                delete carrito[key];
            }

            guardarCarrito();
            const textoActual = document.getElementById('buscar').value.toLowerCase().trim();
            if (textoActual === "") {
                renderizar(productos);
            } else {
                renderizar(productos.filter(p => 
                    p.nombre.toLowerCase().includes(textoActual) || 
                    String(p.codigo).toLowerCase().includes(textoActual)
                ));
            }
        }

        function actualizarBarraFlotante() {
            let totalItems = 0;
            let totalPrecio = 0;

            for (let k in carrito) {
                totalItems += carrito[k].cantidad;
                totalPrecio += carrito[k].cantidad * carrito[k].precio;
            }

            document.getElementById('contador-carrito').innerText = totalItems;
            document.getElementById('total-carrito').innerText = 'Q' + totalPrecio.toFixed(2);
        }

        function abrirTicket() {
            const keys = Object.keys(carrito);
            if (keys.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            let mensaje = `*TICKET DE PEDIDO - DIPROSA*\n`;
            mensaje += `*Fecha:* ${new Date().toLocaleDateString()}\n`;
            mensaje += `-----------------------------------\n\n`;

            let subtotalGeneral = 0;
            keys.forEach(k => {
                const item = carrito[k];
                const subtotalItem = item.cantidad * item.precio;
                subtotalGeneral += subtotalItem;
                mensaje += `• *${item.nombre}* (Cod: ${item.codigo})\n`;
                mensaje += `  Cant: *${item.cantidad}* | Subtotal: Q${subtotalItem.toFixed(2)}\n\n`;
            });

            mensaje += `-----------------------------------\n`;
            mensaje += `*TOTAL A PAGAR: Q${subtotalGeneral.toFixed(2)}*\n`;
            mensaje += `-----------------------------------\n`;
            mensaje += `👋 ¡Hola! Quisiera confirmar este pedido.`;

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
