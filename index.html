<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #1a365d; margin: 0; font-size: 24px; }
        .header p { color: #4a5568; margin-top: 5px; font-size: 14px; }
        .search-box { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #3182ce; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .catalog-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media(min-width: 600px) { .catalog-container { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); } }
        .product-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 4px solid #3182ce; }
        .product-title { font-weight: bold; font-size: 15px; color: #2d3748; margin-bottom: 5px; }
        .product-details { font-size: 13px; color: #718096; margin-bottom: 8px; }
        .product-price { font-size: 18px; color: #2b6cb0; font-weight: bold; }
        .btn-ws { display: block; background-color: #25d366; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; text-align: center; box-sizing: border-box; }
        .loading { text-align: center; font-size: 18px; color: #4a5568; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 Catálogo Digital DIPROSA</h1>
        <p>Distribución e Inventario</p>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar producto (ej: Aceite, Frijol, Gelatina)..." onkeyup="filterProducts()">

    <div id="loading" class="loading">Cargando catálogo de productos...</div>
    <div id="catalog" class="catalog-container"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTtasVXpH4oXxOpUOfMiQZtPyuvFy3ZYDVzoSkIbOLir6wA-jZyLsQU4gBPodNniw/pub?output=csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const rows = data.split('\n').slice(1);
                const catalog = document.getElementById('catalog');
                
                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 4) {
                        const codigo = cols[0] ? cols[0].trim() : '';
                        const unidad = cols[1] ? cols[1].trim() : '';
                        const detalle = cols[2] ? cols[2].trim() : '';
                        const precio = cols[3] ? cols[3].trim() : '';
                        const estado = cols[4] ? cols[4].trim() : '';

                        if (detalle && estado.toLowerCase().includes('activado')) {
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            const msgWs = encodeURIComponent(`Hola DIPROSA, quisiera solicitar el producto:\n- Código: ${codigo}\n- Descripción: ${detalle}\n- Precio: Q.${precio}`);
                            
                            card.innerHTML = `
                                <div class="product-title">${detalle}</div>
                                <div class="product-details">Código: ${codigo} | Presentación: ${unidad}</div>
                                <div class="product-price">Q. ${precio}</div>
                                <a href="https://wa.me/50245695192?text=${msgWs}" class="btn-ws" target="_blank">📲 Pedir por WhatsApp</a>
                            `;
                            catalog.appendChild(card);
                        }
                    }
                });
            })
            .catch(error => {
                document.getElementById('loading').innerText = 'Error al cargar los productos. Por favor recargue la página.';
            });

        function filterProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');
            for (let card of cards) {
                let text = card.innerText.toLowerCase();
                card.style.display = text.includes(input) ? '' : 'none';
            }
        }
    </script>
</body>
</html>
