<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Central / Estuardo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-top h2 {
            color: #f1c40f;
            margin: 0;
            font-size: 1.2em;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .mini-btn {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: none;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            text-align: center;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
        }
        .card h3 {
            font-size: 0.95em;
            margin: 0 0 10px 0;
            color: #ffffff;
            line-height: 1.4;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.2em;
            margin: 0 0 12px 0;
        }
        .btn-agregar {
            background-color: #1b8e3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0b0b;
            border-top: 2px solid #222;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.9em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #1b8e3e;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>🏢 CENTRAL / ESTUARDO</h2>
        <div class="header-btns">
            <a href="#" class="mini-btn">📊 Metas</a>
            <a href="#" class="mini-btn">💰 Sueldo</a>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando inventario...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <a href="#" id="whatsapp-pedido" class="ver-ticket-btn" target="_blank" rel="noopener noreferrer">
            📋 Ver Ticket
        </a>
    </div>

    <script>
        // Enlace directo de exportación CSV adaptado a tus columnas reales
        const SHEET_URL = 'https://google.com' + new Date().getTime();
        const APPS_SCRIPT_URL = 'https://google.com'; 
        
        let productos = [];
        let carrito = {};

        // Procesador de bloques CSV seguro
        function parsearCSV(texto) {
            const lineas = [];
            let fila = [];
            let celda = '';
            let dentroDeComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const char = texto[i];
                const siguienteChar = texto[i + 1];

                if (char === '"') {
                    if (dentroDeComillas && siguienteChar === '"') {
                        celda += '"';
                        i++;
                    } else {
                        dentroDeComillas = !dentroDeComillas;
                    }
                } else if (char === ',' && !dentroDeComillas) {
                    fila.push(celda.trim());
                    celda = '';
                } else if ((char === '\r' || char === '\n') && !dentroDeComillas) {
                    if (celda || fila.length > 0) {
                        fila.push(celda.trim());
                        lineas.push(fila);
                        celda = '';
                    }
                    fila = [];
                    if (char === '\r' && siguienteChar === '\n') i++;
                } else {
                    celda += char;
                }
            }
            if (celda || fila.length > 0) {
                fila.push(celda.trim());
                lineas.push(fila);
            }
            return lineas;
        }

        async function cargarProductos() {
            try {
                const respuesta = await fetch(SHEET_URL);
                if (!respuesta.ok) throw new Error('Error al conectar');
                
                const textoCSV = await respuesta.text();
                const filas = parsearCSV(textoCSV);
                
                productos = [];
                // Mapeo exacto para tus 3 columnas: A=Codigo, B=Unidad, C=Detalle
                for (let i = 1; i < filas.length; i++) {
                    const columnas = filas[i];
                    if (columnas.length >= 3 && columnas[0] !== "") {
                        productos.push({
                            codigo: columnas[0] ? columnas[0].replace(/"/g, '') : '',
                            unidad: columnas[1] ? columnas[1].replace(/"/g, '') : 'Unidad',
                            detalle: columnas[2] ? columnas[2].replace(/"/g, '') : '',
                            precio: columnas[4] ? (parseFloat(columnas[4]) || 0) : 0 // Busca precio si existe en la columna E, si no, usa 0
                        });
                    }
                }
                renderizarProductos(productos);
            } catch (error) {
                console.error(error);
                document.getElementById('catalogo-grid').innerHTML = 
                    `<p style="text-align: center; grid-column: 1 / -1; color: #e74c3c;">Error al cargar el inventario. Verifique la conexión con Google Sheets.</p>`;
            }
        }

        function renderizarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = `<p style="text-align: center; grid-column: 1 / -1;">No se encontraron productos en el inventario.</p>`;
                return;
            }

            grid.innerHTML = lista.map(p => `
                <div class="card">
                    <div>
                        <h3>${p.detalle}</h3>
                        <p style="font-size: 0.85em; color: #aaa; margin: 0 0 8px 0;">${p.unidad} - Cód: ${p.codigo}</p>
                    </div>
                    <div>
                        <div class="precio">Q ${p.precio > 0 ? p.precio.toFixed(2) : '---'}</div>
                        <button class="btn-agregar" onclick="agregarAlCarrito('${p.codigo}')">+ Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function filtrarProductos() {
            const termino = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.detalle.toLowerCase().includes(termino) || p.codigo.toLowerCase().includes(termino));
            renderizarProductos(filtrados);
        }

        function agregarAlCarrito(codigo) {
            const prod = productos.find(p => p.codigo === codigo);
            if (!prod) return;

            if (carrito[codigo]) {
                carrito[codigo].cantidad++;
            } else {
                carrito[codigo] = { ...prod, cantidad: 1 };
            }
            actualizarInterfazCarrito();
        }

        function actualizarInterfazCarrito() {
            let totalItems = 0;
            let precioTotal = 0;
            let textoTicket = '*PEDIDO CENTRAL - DIPROSA (ESTUARDO)*\n\n';

            for (const key in carrito) {
