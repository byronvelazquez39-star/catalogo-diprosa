<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo DIPROSA - ESTUARDO</title>
  <style>
    :root {
      --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff;
      --accent-color: #27ae60; --wa-color: #25d366; --danger-color: #e74c3c;
    }
    body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 12px; padding-bottom: 100px; box-sizing: border-box; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; }
    h1 { text-align: center; margin: 0; font-size: 15px; color: #ff9800; }
    
    .btn-group-header { display: flex; gap: 4px; }
    .btn-action-header { border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; color: #fff; }
    .btn-metas { background-color: #0284c7; }
    .btn-sueldo { background-color: #059669; }

    .search-box { width: 100%; padding: 10px; font-size: 14px; margin-bottom: 15px; border: 1px solid #ff9800; border-radius: 6px; background: #1a1a1a; color: #fff; box-sizing: border-box; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: 100%; box-sizing: border-box; }
    .card { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; overflow: hidden; }
    .nombre { font-size: 13px; font-weight: bold; margin-bottom: 6px; word-break: break-word; }
    .precio { font-size: 14px; color: var(--accent-color); font-weight: bold; margin-bottom: 8px; }
    
    .qty-controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-qty { background-color: #333; color: #fff; border: 1px solid #555; width: 28px; height: 28px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .qty-num { font-size: 14px; font-weight: bold; min-width: 18px; text-align: center; }
    .btn-add { background-color: var(--accent-color); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 12px; }
    
    .btn-cargar-mas { background-color: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 6px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; display: none; }

    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 2px solid #333; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .cart-info { font-size: 14px; cursor: pointer; }
    .cart-total { font-size: 16px; color: var(--accent-color); font-weight: bold; }
    .btn-wa { background-color: var(--wa-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }

    /* MODALES MÁS COMPACTOS Y RESUMIDOS */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 12px; box-sizing: border-box; }
    .modal-content { background: #1e1e1e; border-radius: 10px; padding: 12px; width: 100%; max-width: 360px; max-height: 80vh; overflow-y: auto; border: 1px solid #444; color: #fff; box-sizing: border-box; font-size: 12px; }
    .ticket-header { text-align: center; border-bottom: 1px dashed #555; padding-bottom: 4px; margin-bottom: 8px; }
    .ticket-header h3 { margin: 0; font-size: 14px; color: #fff; }
    .client-input { width: 100%; background: #333; color: white; border: 1px solid #555; padding: 7px; border-radius: 5px; font-size: 12px; box-sizing: border-box; margin-bottom: 8px; }
    .btn-close { background: #444; color: white; border: none; padding: 7px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px; font-size: 12px; }
    .btn-modal-wa { background: var(--wa-color); color: white; border: none; width: 100%; text-align: center; padding: 8px; border-radius: 5px; font-weight: bold; margin-top: 5px; font-size: 13px; cursor: pointer; }

    /* RESUMEN ULTRA COMPACTO */
    .compact-box { background: #111827; border: 1px solid #374151; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .compact-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px dotted #333; padding-bottom: 3px; font-size: 12px; }
    .btn-corte-diario { background-color: #059669; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; width: 100%; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📦 ESTUARDO</h1>
    <div class="btn-group-header">
      <button class="btn-action-header btn-metas" onclick="abrirModalMetas()">📊 Metas</button>
      <button class="btn-action-header btn-sueldo" onclick="abrirModalSueldo()">💰 Sueldo</button>
    </div>
  </div>

  <input type="text" id="buscar" class="search-box" placeholder="🔍 Buscar producto..." oninput="filtrarDebounce()">
  
  <div id="catalogo" class="grid">Cargando inventario...</div>
  <button id="btn-mas" class="btn-cargar-mas" onclick="cargarMasProductos()">Cargar más productos...</button>

  <div class="cart-bar">
    <div class="cart-info" onclick="abrirTicket()">
      <div>🛒 <span id="cant-items">0</span> ítems</div>
      <div class="cart-total">Total: Q <span id="total-precio">0.00</span></div>
    </div>
    <button class="btn-wa" onclick="abrirTicket()">📋 Ver Ticket</button>
  </div>

  <!-- MODAL TICKET -->
  <div id="modal-ticket" class="modal">
    <div class="modal-content">
      <div class="ticket-header">
        <h3>🧾 TICKET DE COMPRA</h3>
        <p style="font-size: 10px; color: #888;" id="ticket-fecha"></p>
        <p style="font-size: 12px; font-weight: bold; color: #27ae60;" id="ticket-numero-label"></p>
      </div>
      <div id="ticket-items"></div>
      <div style="margin-top: 8px;">
        <input type="text" id="cliente-receptor" class="client-input" placeholder="Nombre Cliente / Tienda">
      </div>
      <div style="border-top: 1px dashed #555; padding-top: 6px; margin-top: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: var(--accent-color);">
          <span>Total:</span><span>Q <span id="ticket-total">0.00</span></span>
        </div>
      </div>
      <button class="btn-modal-wa" onclick="enviarWhatsAppYLimpiar()">📲 Enviar Pedido</button>
      <button class="btn-close" onclick="cerrarModal('modal-ticket')">Seguir Comprando</button>
    </div>
  </div>

  <!-- MODAL METAS (RESUMIDO) -->
  <div id="modal-metas" class="modal">
    <div class="modal-content">
      <div class="ticket-header">
        <h3>📊 METAS - ESTUARDO</h3>
      </div>
      <div class="compact-box">
        <div class="compact-row"><span>💰 Ventas Mes:</span><strong style="color:#34d399;">Q <span id="meta-ventas-real">0.00</span> / Q81k</strong></div>
        <div class="compact-row"><span>🧾 Tiquetes:</span><strong id="meta-tiquetes-real">0 / 324 Tq</strong></div>
        <div class="compact-row"><span>⏱️ Horas Ruta:</span><strong id="meta-horas-real">0 / 189 Hrs</strong></div>
      </div>
      <button class="btn-corte-diario" onclick="enviarCorteDiarioWA()">📲 Enviar Reporte a don Byron</button>
      <button class="btn-close" onclick="cerrarModal('modal-metas')">Cerrar</button>
    </div>
  </div>

  <!-- MODAL SUELDO (RESUMIDO) -->
  <div id="modal-sueldo" class="modal">
    <div class="modal-content">
      <div class="ticket-header">
        <h3>💵 SUELDO Y NÓMINA</h3>
      </div>
      <div class="compact-box">
        <div class="compact-row"><span>Base Mensual:</span><strong>Q 3,600.00</strong></div>
        <div class="compact-row" style="color:#25d366;"><span>1ra Quincena (1-15):</span><strong>Q 1,800.00 (Libre)</strong></div>
        <div class="compact-row" style="color:#38bdf8; margin-bottom:0; border:none;"><span>☀️ Ventas de hoy:</span><strong id="sueldo-dia-hoy">Q 0.00</strong></div>
      </div>
      <button class="btn-close" onclick="cerrarModal('modal-sueldo')">Cerrar</button>
    </div>
  </div>

  <script>
    const NUMERO_WHATSAPP = "50248502382";
    const storageKey = "carrito_diprosa_estuardo";
    const ticketsKey = "diprosa_tickets_estuardo";

    let productos = [], productosFiltrados = [], limiteActual = 40, carrito = {}, debounceTimer;

    try { carrito = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch(e) { carrito = {}; }

    document.addEventListener('DOMContentLoaded', () => {
      fetch('productos.json?v=' + new Date().getTime())
        .then(res => { if (!res.ok) throw new Error("No encontrado"); return res.json(); })
        .then(data => {
          productos = data;
          productosFiltrados = data;
          renderizarCatalogo();
          actualizarUIResumen();
        })
        .catch(() => {
          productos = [
            { nombre: "Detergente en Polvo 1kg", precio: 15.00 },
            { nombre: "Aceite Vegetal 800ml", precio: 22.50 }
          ];
          productosFiltrados = productos;
          renderizarCatalogo();
          actualizarUIResumen();
        });
    });

    function renderizarCatalogo() {
      let contenedor = document.getElementById('catalogo');
      if (!productosFiltrados.length) {
        contenedor.innerHTML = '<p style="text-align:center; color:#888; grid-column: 1/-1;">No hay productos.</p>';
        document.getElementById('btn-mas').style.display = 'none'; return;
      }
      contenedor.innerHTML = productosFiltrados.slice(0, limiteActual).map(p => {
        let key = p.nombre + '_' + p.precio;
        let cant = carrito[key] ? carrito[key].cantidad : 0;
        let b64 = btoa(unescape(encodeURIComponent(p.nombre)));
        return `
          <div class="card">
            <div class="nombre">${p.nombre}</div>
            <div>
              <div class="precio">Q ${parseFloat(p.precio).toFixed(2)}</div>
              ${cant === 0 ? `<button class="btn-add" onclick="cambiarCant('${b64}',${p.precio},1)">+ Agregar</button>` : 
                `<div class="qty-controls">
                  <button class="btn-qty" onclick="cambiarCant('${b64}',${p.precio},-1)">-</button>
                  <span class="qty-num">${cant}</span>
                  <button class="btn-qty" onclick="cambiarCant('${b64}',${p.precio},1)">+</button>
                </div>`}
            </div>
          </div>`;
      }).join('');
      document.getElementById('btn-mas').style.display = productosFiltrados.length > limiteActual ? 'block' : 'none';
    }

    function cargarMasProductos() { limiteActual += 40; renderizarCatalogo(); }
    function filtrarDebounce() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        let q = document.getElementById('buscar').value.toLowerCase().trim();
        limiteActual = 40;
        productosFiltrados = q === "" ? productos : productos.filter(p => p.nombre.toLowerCase().includes(q));
        renderizarCatalogo();
      }, 150);
    }

    function cambiarCant(b64, precio, delta) {
      let nombre = decodeURIComponent(escape(atob(b64))), key = nombre + '_' + precio;
      if (!carrito[key]) carrito[key] = { nombre, precio: parseFloat(precio), cantidad: 0 };
      carrito[key].cantidad += delta;
      if (carrito[key].cantidad <= 0) delete carrito[key];
      localStorage.setItem(storageKey, JSON.stringify(carrito));
      actualizarUIResumen();
      renderizarCatalogo();
    }

    function actualizarUIResumen() {
      let totalCant = 0, totalMonto = 0;
      for (let k in carrito) {
        totalCant += carrito[k].cantidad;
        totalMonto += carrito[k].cantidad * carrito[k].precio;
      }
      document.getElementById('cant-items').innerText = totalCant;
      document.getElementById('total-precio').innerText = totalMonto.toFixed(2);
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    function abrirModalMetas() { actualizarVistaMetas(); abrirModal('modal-metas'); }
    
    function actualizarVistaMetas() {
      let tiquetesGuardados = JSON.parse(localStorage.getItem(ticketsKey)) || [];
      let totalVentasReal = 0, totalTq = 0;
      
      tiquetesGuardados.forEach(t => {
        if (t.total) { 
          totalVentasReal += parseFloat(t.total); 
          totalTq += 1; 
        } else if (t.esAcumuladoBase && t.total) {
          totalVentasReal += parseFloat(t.total);
          totalTq += (t.tiquetesCount || 0);
        }
      });
      
      document.getElementById('meta-ventas-real').innerText = totalVentasReal.toFixed(2);
      document.getElementById('meta-tiquetes-real').innerText = totalTq + " / 324 Tq";
    }

    function abrirModalSueldo() {
      let tiquetesGuardados = JSON.parse(localStorage.getItem(ticketsKey)) || [];
      let ventasHoy = 0;
      tiquetesGuardados.forEach(t => { if (t.total) ventasHoy += parseFloat(t.total); });
      document.getElementById('sueldo-dia-hoy').innerText = "Q " + ventasHoy.toFixed(2);
      abrirModal('modal-sueldo');
    }

    function enviarCorteDiarioWA() {
      let tiquetesGuardados = JSON.parse(localStorage.getItem(ticketsKey)) || [];
      let totalVentas = 0;
      tiquetesGuardados.forEach(t => { if (t.total) totalVentas += parseFloat(t.total); });
      let msg = `📊 *REPORTE VENTAS - ESTUARDO*\nVentas acumuladas: Q${totalVentas.toFixed(2)}`;
      window.open(`https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=` + encodeURIComponent(msg), '_blank');
    }

    function abrirTicket() {
      if (!Object.keys(carrito).length) { alert("El carrito está vacío."); return; }
      let contenedor = document.getElementById('ticket-items'), subtotal = 0;
      contenedor.innerHTML = Object.keys(carrito).map(k => {
        let item = carrito[k], sub = item.cantidad * item.precio;
        subtotal += sub;
        return `<div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px;"><span>${item.nombre} (x${item.cantidad})</span><span>Q${sub.toFixed(2)}</span></div>`;
      }).join('');
      document.getElementById('ticket-total').innerText = subtotal.toFixed(2);
      document.getElementById('ticket-fecha').innerText = new Date().toLocaleString('es-GT');
      let numT = (parseInt(localStorage.getItem('correlativo_ticket_estuardo')) || 0) + 1;
      document.getElementById('ticket-numero-label').innerText = "Tiquete # " + String(numT).padStart(8, '0');
      abrirModal('modal-ticket');
    }

    function enviarWhatsAppYLimpiar() {
      let receptor = document.getElementById('cliente-receptor').value.trim();
      if (!receptor) { alert("Ingrese nombre del cliente."); return; }
      let numT = (parseInt(localStorage.getItem('correlativo_ticket_estuardo')) || 0) + 1;
      localStorage.setItem('correlativo_ticket_estuardo', numT);

      let subtotal = 0, itemsArray = [];
      for (let k in carrito) {
        let item = carrito[k], sub = item.cantidad * item.precio;
        subtotal += sub;
        itemsArray.push(item);
      }

      let horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let nuevoTiquete = {
        fecha: horaActual,
        cliente: receptor,
        items: itemsArray,
        total: subtotal
      };

      let tiquetesGuardados = JSON.parse(localStorage.getItem(ticketsKey)) || [];
      tiquetesGuardados.push(nuevoTiquete);
      localStorage.setItem(ticketsKey, JSON.stringify(tiquetesGuardados));

      let msg = `*DISTRIBUIDORA DIPROSA*\n📦 *Vendedor:* ESTUARDO\n*Tiquete # ${String(numT).padStart(8,'0')}* (${horaActual})\n👤 *Cliente:* ${receptor}\n--------------------------------\n`;
      itemsArray.forEach(i => {
        msg += `${i.nombre} (x${i.cantidad}) = Q${(i.precio * i.cantidad).toFixed(2)}\n`;
      });
      msg += `--------------------------------\nTOTAL: Q${subtotal.toFixed(2)}\n¡Hola! Confirmo este pedido.`;

      window.open(`https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=` + encodeURIComponent(msg), '_blank');
      carrito = {};
      localStorage.removeItem(storageKey);
      cerrarModal('modal-ticket');
      actualizarUIResumen();
      renderizarCatalogo();
    }
  </script>
</body>
</html>
