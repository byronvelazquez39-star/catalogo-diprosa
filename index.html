<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 120px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #121212;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        header {
            margin-bottom: 24px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin: 0 auto;
            display: block;
        }
        .search-box:focus {
            border-color: var(--accent-color);
        }
        .stats {
            margin-top: 8px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-code {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .card-price {
            font-size: 1.25rem;
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-add {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-add:hover {
            opacity: 0.9;
        }
        .cart-float {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 2px solid var(--success-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
        }
        .btn-whatsapp {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        /* Estilos del Modal para visualizar el Ticket */
        #modal-ticket {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--success-color);
            text-align: center;
        }
        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            font-size: 14px;
            background-color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            line-height: 1.5;
            border: 1px solid var(--border-color);
        }
        .modal-footer {
            display: flex;
            gap: 10px;
        }
        .btn-cerrar {
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-enviar-modal {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-banner">
            👋 ¡Bienvenido a DIPROSA!<br>
            <span style="font-weight: normal; font-size: 0.9rem;">Selecciona tus productos, arma tu ticket y envíanos tu pedido.</span>
        </div>

        <header>
            <h1>📦 Catálogo en Línea</h1>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por nombre o código...">
            <div id="stats" class="stats">Cargando productos...</div>
        </header>
        <div id="productGrid" class="grid"></div>
    </div>

    <!-- Barra inferior flotante que abre el ticket al tocarla -->
    <div class="cart-float" onclick="abrirModalTicket()">
        <div>🛒 Artículos: <span id="contador-carrito">0</span></div>
        <div>Total: <strong id="total-carrito" style="color: #22c55e;">Q0.00</strong></div>
        <button class="btn-whatsapp" onclick="event.stopPropagation(); abrirModalTicket();">Ver Ticket 👁️</button>
    </div>

    <!-- Modal emergente para visualizar el pedido antes de enviarlo -->
    <div id="modal-ticket">
        <div class="modal-content">
            <div class="modal-header">📄 Resumen del Pedido</div>
            <div id="texto-ticket" class="modal-body">Cargando...</div>
            <div class="modal-footer">
                <button class="btn-cerrar" onclick="cerrarModal()">Cerrar</button>
                <button class="btn-enviar-modal" onclick="enviarWhatsApp()">Enviar WhatsApp 📱</button>
            </div>
        </div>
    </div>

    <script>
        const NUMERO_WHATSAPP = "50248502382";
        let productos = [];
        let carrito = JSON.parse(localStorage.getItem('diprosa_carrito')) || {};

        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.toString().toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                productos = data;
                renderizarProductos(productos);
                actualizarBarraFlotante();
            })
            .catch(error => {
                console.error('Error al cargar productos:', error);
                document.getElementById('stats').innerText = 'Error al cargar el catálogo de productos.';
            });

        function renderizarProductos(lista) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            document.getElementById('stats').innerText = `Mostrando ${lista.length} productos`;

            if (lista.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No se encontraron productos.</p>';
                return;
            }

            lista.forEach((p, index) => {
                const id = p.codigo || p.nombre;
                const enCarrito = carrito[id] ? carrito[id].cantidad : 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-code">Cód: ${p.codigo || 'N/A'}</div>
                        <div class="card-title">${p.nombre}</div>
                    </div>
                    <div>
                        <div class="card-price">Q${Number(p.precio).toFixed(2)}</div>
                        <button class="btn-add" onclick="agregarAlCarrito(${index})">
                            ${enCarrito > 0 ? 'Agregados: ' + enCarrito : 'Agregar +'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const termino = normalizarTexto(e.target.value);
            clearTimeout(debounceTimer);

            if (termino === "") {
                renderizarProductos(productos);
                return;
            }

            debounceTimer = setTimeout(() => {
                const filtrados = productos.filter(p => {
                    const nombreNorm = normalizarTexto(p.nombre);
                    const codigoNorm = normalizarTexto(p.codigo);
                    return nombreNorm.includes(termino) || codigoNorm.includes(termino);
                });
                renderizarProductos(filtrados);
            }, 250);
        });

        function agregarAlCarrito(index) {
            const producto = productos[index];
            const id = producto.codigo || producto.nombre;

            if (carrito[id]) {
                carrito[id].cantidad += 1;
            } else {
                carrito[id] = {
                    nombre: producto.nombre,
                    codigo: producto.codigo,
                    precio: Number(producto.precio),
                    cantidad: 1
                };
            }
            guardarYActualizar();
        }

        function guardarYActualizar() {
            localStorage.setItem('diprosa_carrito', JSON.stringify(carrito));
            actualizarBarraFlotante();
            
            // Si el modal está abierto, actualizamos su contenido en tiempo real
            if (document.getElementById('modal-ticket').style.display === 'flex') {
                document.getElementById('texto-ticket').innerText = generarTextoTicket();
            }

            // Actualizar vista de productos para reflejar los botones
            const termino = normalizarTexto(document.getElementById('searchInput').value);
            if (termino === "") {
                renderizarProductos(productos);
            } else {
                renderizarProductos(productos.filter(p => 
                    normalizarTexto(p.nombre).includes(termino) || normalizarTexto(p.codigo).includes(termino)
                ));
            }
        }

        function actualizarBarraFlotante() {
            let totalItems = 0;
            let totalPrecio = 0;

            for (let id in carrito) {
                totalItems += carrito[id].cantidad;
                totalPrecio += carrito[id].cantidad * carrito[id].precio;
            }

            document.getElementById('contador-carrito').innerText = totalItems;
            document.getElementById('total-carrito').innerText = 'Q' + totalPrecio.toFixed(2);
        }

        function generarTextoTicket() {
            const keys = Object.keys(carrito);
            let mensaje = `*TICKET DE PEDIDO - DIPROSA*\n`;
            mensaje += `*Fecha:* ${new Date().toLocaleDateString()}\n`;
            mensaje += `-----------------------------------\n\n`;

            let subtotalGeneral = 0;
            keys.forEach(id => {
                const item = carrito[id];
                const subtotalItem = item.cantidad * item.precio;
                subtotalGeneral += subtotalItem;
                mensaje += `• *${item.nombre}* (Cod: ${item.codigo || 'N/A'})\n`;
                mensaje += `  Cant: *${item.cantidad}* | Subtotal: Q${subtotalItem.toFixed(2)}\n\n`;
            });

            mensaje += `-----------------------------------\n`;
            mensaje += `*TOTAL A PAGAR: Q${subtotalGeneral.toFixed(2)}*\n`;
            mensaje += `-----------------------------------\n`;
            mensaje += `👋 ¡Hola! Quisiera confirmar este pedido.`;
            return mensaje;
        }

        function abrirModalTicket() {
            const keys = Object.keys(carrito);
            if (keys.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            document.getElementById('texto-ticket').innerText = generarTextoTicket();
            document.getElementById('modal-ticket').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-ticket').style.display = 'none';
        }

        function enviarWhatsApp() {
            const keys = Object.keys(carrito);
            if (keys.length === 0) return;

            const mensaje = generarTextoTicket();
            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
            cerrarModal();
        }
    </script>
</body>
</html>
