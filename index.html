<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo DIPROSA</title>
    <style>
        :root {
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff;
            --accent-color: #2ecc71; 
            --wa-color: #25d366;
        }
        body { 
            font-family: Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 10px; 
            padding-bottom: 90px; 
            box-sizing: border-box; 
        }
        .header-bar { 
            position: sticky; 
            top: 0; 
            z-index: 900;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #1a1a1a; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            margin-bottom: 12px;
        }
        h1 { margin: 0; font-size: 18px; color: #f1c40f; text-align: center; }
        
        .search-box { 
            width: 100%; 
            padding: 10px 12px; 
            font-size: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #f1c40f; 
            border-radius: 6px; 
            background: #1a1a1a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            box-sizing: border-box; 
            max-width: 1200px;
            margin: 0 auto;
        }
        .card { 
            background: var(--card-bg); 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-sizing: border-box; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 8px;
            background-color: #2a2a2a;
        }
        .nombre { 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 6px; 
            word-break: break-word; 
            height: 2.8em;
            overflow: hidden;
        }
        .precio { 
            font-size: 14px; 
            color: var(--accent-color); 
            font-weight: bold; 
            margin-top: 4px; 
        }
        
        .btn-cargar-mas { 
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555; 
            padding: 10px; 
            border-radius: 6px; 
            width: 100%; 
            max-width: 300px;
            margin: 20px auto 0 auto; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; 
            font-size: 13px; 
            display: block;
            text-align: center;
        }

        .whatsapp-btn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background-color: var(--wa-color); 
            color: white; 
            padding: 12px 20px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 15px; 
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); 
            z-index: 1000; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .whatsapp-btn:hover { background-color: #1ebc57; }
        
        .mensaje {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Catálogo DIPROSA</h1>
    </div>

    <input type="text" id="buscar" class="search-box" placeholder="🔍 Buscar producto en el catálogo..." oninput="filtrarDebounce()">
  
    <div id="catalogo" class="grid">
        <div class="mensaje">Cargando catálogo...</div>
    </div>
    
    <button id="btn-mas" class="btn-cargar-mas" onclick="cargarMasProductos()" style="display:none;">Cargar más productos...</button>

    <!-- Botón flotante de WhatsApp -->
    <a href="https://wa.me/50248502382?text=Hola, me gustaría realizar un pedido o consulta del catálogo DIPROSA." class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
        💬 Pedir por WhatsApp
    </a>

    <!-- Cargamos directamente el archivo productos.js -->
    <script src="productos.js"></script>
    <script>
        let productosFiltrados = [], limiteActual = 40;

        document.addEventListener('DOMContentLoaded', () => {
            // Verificamos si la variable 'productos' cargó desde productos.js
            if (typeof productos !== 'undefined' && Array.isArray(productos) && productos.length > 0) {
                productosFiltrados = productos;
                renderizarCatalogo();
            } else {
                document.getElementById('catalogo').innerHTML = `<div class="mensaje">⚠️ No se encontró la lista de productos en productos.js o está vacía.</div>`;
            }
        });

        function renderizarCatalogo() {
            const grid = document.getElementById('catalogo');
            if (productosFiltrados.length === 0) {
                grid.innerHTML = `<div class="mensaje">No se encontraron productos.</div>`;
                document.getElementById('btn-mas').style.display = 'none';
                return;
            }

            grid.innerHTML = productosFiltrados.slice(0, limiteActual).map(p => {
                let imgUrl = p.imagen ? p.imagen : 'https://via.placeholder.com/150?text=Sin+Imagen';
                let precioVal = typeof p.precio === 'number' ? p.precio.toFixed(2) : parseFloat(p.precio || 0).toFixed(2);
                return `
                    <div class="card">
                        <img src="${imgUrl}" alt="${p.nombre || 'Producto'}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                        <div class="nombre">${p.nombre || 'Sin nombre'}</div>
                        <div class="precio">Q ${precioVal}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('btn-mas').style.display = productosFiltrados.length > limiteActual ? 'block' : 'none';
        }

        function cargarMasProductos() { 
            limiteActual += 40; 
            renderizarCatalogo(); 
        }

        function filtrarDebounce() {
            let q = document.getElementById('buscar').value.toLowerCase().trim();
            productosFiltrados = q === "" ? productos : productos.filter(p => (p.nombre || "").toLowerCase().includes(q));
            limiteActual = 40; 
            renderizarCatalogo();
        }
    </script>
</body>
</html>
