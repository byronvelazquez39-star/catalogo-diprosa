<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
            margin-bottom: 15px;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            text-align: center;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 4px solid #f1c40f;
        }
        .card h3 {
            font-size: 1em;
            margin: 0 0 10px 0;
            color: #ffffff;
            line-height: 1.4;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.2em;
            margin: 0 0 12px 0;
        }
        .btn-agregar {
            background-color: #f1c40f;
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <h1>Catálogo DIPROSA</h1>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando inventario completo...</p>
    </div>

    <a href="#" id="whatsapp-pedido" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
        💬 Pedir por WhatsApp (<span id="contador-carrito">0</span>)
    </a>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1yRkOiPyX6hEnIhtuQarQXWXkPPTD65jS/export?format=csv';
        
        let productos = [];
        let carrito = {};

        async function cargarProductos() {
            try {
                const respuesta = await fetch(SHEET_URL);
                const datos = await respuesta.text();
                parsearCSV(datos);
            } catch (error) {
                document.getElementById('catalogo-grid').innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">Error al conectar con la hoja.</p>';
            }
        }

        function parsearCSV(texto) {
            const lineas = texto.split('\n');
            productos = [];
            let vistos = new Set();
            
            // Empezamos desde la línea 25 para saltar la zona donde se estancaba con los Heinz repetidos
            for (let i = 25; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    let descripcion = columnas[2] ? columnas[2].replace(/"/g, '').trim() : '';
                    
                    if (descripcion && !descripcion.includes('{') && !descripcion.includes('function') && descripcion.length > 2) {
                        
                        // Evitar duplicados exactos
                        if (vistos.has(descripcion)) continue;
                        vistos.add(descripcion);

                        let precioNum = 0.00;
                        let matchPrecio = descripcion.match(/Q\.?\s*(\d+(\.\d+)?)/i);
                        if (matchPrecio) {
                            precioNum = parseFloat(matchPrecio[1]);
                        } else if (columnas[4]) {
                            let matchCol = columnas[4].replace(/"/g, '').match(/(\d+(\.\d+)?)/);
                            if (matchCol) precioNum = parseFloat(matchCol[1]);
                        }

                        productos.push({ id: i, descripcion, precio: precioNum });
                    }
                }
            }
            mostrarProductos(productos);
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            grid.innerHTML = lista.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">Agregar</button>
                    </div>
                `;
            }).join('');
        }

        function filtrarProductos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.descripcion.toLowerCase().includes(texto));
            
            const grid = document.getElementById('catalogo-grid');
            if (filtrados.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            grid.innerHTML = filtrados.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">Agregar</button>
                    </div>
                `;
            }).join('');
        }

        function agregarAlCarrito(index) {
            let producto = productos[index];
            if (!producto) return;
            
            let nombre = producto.descripcion;
            let precio = producto.precio;

            if (!carrito[nombre]) {
                carrito[nombre] = { precio: precio, cantidad: 0 };
            }
            carrito[nombre].cantidad += 1;
            actualizarCarritoWhatsApp();
        }

        function actualizarCarritoWhatsApp() {
            let totalItems = 0;
            let mensaje = "Hola, me gustaría realizar el siguiente pedido:%0A";
            for (let nombre in carrito) {
                let cant = carrito[nombre].cantidad;
                let sub = cant * carrito[nombre].precio;
                totalItems += cant;
                mensaje += `- ${cant}x ${nombre} (Q ${sub.toFixed(2)})%0A`;
            }
            document.getElementById('contador-carrito').innerText = totalItems;
            document.getElementById('whatsapp-pedido').href = `https://wa.me/50248502382?text=${mensaje}`;
        }

        cargarProductos();
    </script>
</body>
</html>
