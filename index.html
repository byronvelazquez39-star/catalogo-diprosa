<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Estuardo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
        h1 { text-align: center; color: #ff9800; font-size: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background-color: #222; color: #fff; box-sizing: border-box; }
        .product-card { background-color: #1e1e1e; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background-color: #ff9800; color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-send { background-color: #25D366; color: #fff; width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .cart-section { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🛒 Catálogo DIPROSA - Vendedor: ESTUARDO</h1>

    <div class="input-group">
        <label for="clienteNombre">Nombre del Cliente / Tienda:</label>
        <input type="text" id="clienteNombre" placeholder="Ej. Tienda La Guadalupana">
    </div>

    <h3>Productos Disponibles</h3>
    <div id="productsList">
        <div class="product-card">
            <div>
                <strong>Limonada Salvavidas lata</strong><br>
                <span>Precio: Q67.00</span>
            </div>
            <button class="btn" onclick="addToCart('Limonada Salvavidas lata', 67.00)">+ Agregar</button>
        </div>
        <div class="product-card">
            <div>
                <strong>Soda Naranjada Carnaval lata</strong><br>
                <span>Precio: Q67.00</span>
            </div>
            <button class="btn" onclick="addToCart('Soda Naranjada Carnaval lata', 67.00)">+ Agregar</button>
        </div>
        <div class="product-card">
            <div>
                <strong>Almohadita fardo 4 oz</strong><br>
                <span>Precio: Q110.00</span>
            </div>
            <button class="btn" onclick="addToCart('Almohadita fardo 4 oz', 110.00)">+ Agregar</button>
        </div>
        <div class="product-card">
            <div>
                <strong>Salvavidas Roja lata</strong><br>
                <span>Precio: Q67.00</span>
            </div>
            <button class="btn" onclick="addToCart('Salvavidas Roja lata', 67.00)">+ Agregar</button>
        </div>
    </div>

    <div class="cart-section">
        <h3>Resumen del Pedido</h3>
        <div id="cartItems">El carrito está vacío.</div>
        <h4>Total: Q <span id="cartTotal">0.00</span></h4>
        <button class="btn-send" onclick="enviarPedido()">📲 Confirmar y Enviar por WhatsApp</button>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItems");
            const totalEl = document.getElementById("cartTotal");
            if (cart.length === 0) {
                container.innerHTML = "El carrito está vacío.";
                totalEl.innerText = "0.00";
                return;
            }
            let html = "";
            let total = 0;
            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                html += `<div>- ${item.name} (x${item.qty}) = Q${subtotal.toFixed(2)}</div>`;
            });
            container.innerHTML = html;
            totalEl.innerText = total.toFixed(2);
        }

        function enviarPedido() {
            if (cart.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            const cliente = document.getElementById("clienteNombre").value || "Cliente General";
            const totalVenta = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // GUARDAR TIQUETE EN EL PANEL
            const nuevoTiquete = {
                fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                cliente: cliente,
                items: cart.map(item => ({ name: item.name, qty: item.qty, price: item.price })),
                total: totalVenta
            };

            let tiquetesGuardados = JSON.parse(localStorage.getItem('diprosa_tickets_estuardo')) || [];
            tiquetesGuardados.push(nuevoTiquete);
            localStorage.setItem('diprosa_tickets_estuardo', JSON.stringify(tiquetesGuardados));

            // ARMAR MENSAJE DE WHATSAPP
            let mensaje = `DISTRIBUIDORA DIPROSA\n👤 Vendedor: ESTUARDO\n👤 Cliente: ${cliente}\n------------------------------\n`;
            cart.forEach(item => {
                mensaje += `${item.name} (x${item.qty}) = Q${(item.price * item.qty).toFixed(2)}\n`;
            });
            mensaje += `------------------------------\nTOTAL: Q${totalVenta.toFixed(2)}\n¡Hola! Confirmo este pedido.`;

            // LIMPIAR Y REDIRIGIR
            cart = [];
            renderCart();
            document.getElementById("clienteNombre").value = "";

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
