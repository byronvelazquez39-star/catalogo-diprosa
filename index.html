<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Estuardo</title>
    <!-- Importamos la librería para leer archivos Excel (.xlsx) completos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-top h2 {
            color: #f1c40f;
            margin: 0;
            font-size: 1.2em;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .mini-btn {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: none;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            text-align: center;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
        }
        .card h3 {
            font-size: 0.95em;
            margin: 0 0 10px 0;
            color: #ffffff;
            line-height: 1.4;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.2em;
            margin: 0 0 12px 0;
        }
        .btn-agregar {
            background-color: #1b8e3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0b0b;
            border-top: 2px solid #222;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.9em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #1b8e3e;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>📦 ESTUARDO</h2>
        <div class="header-btns">
            <a href="#" class="mini-btn">📊 Metas</a>
            <a href="#" class="mini-btn">💰 Sueldo</a>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="Escriba para buscar entre los 1,327 productos..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando los 1,327 productos del archivo Excel...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <a href="#" id="whatsapp-pedido" class="ver-ticket-btn" target="_blank" rel="noopener noreferrer">
            📋 Ver Ticket
        </a>
    </div>

    <script>
        // Enlace de descarga directa del archivo Excel de Google Drive
        const EXCEL_URL = 'https://docs.google.com/uc?export=download&id=1yRkOiPyX6hEnIhtuQarQXWXkPPTD65jS';
        
        let productos = [];
        let carrito = {};

        async function cargarExcel() {
            try {
                const respuesta = await fetch(EXCEL_URL);
                const arrayBuffer = await respuesta.arrayBuffer();
                
                // Procesamos el archivo binario completo de Excel con SheetJS
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const primeraHojaName = workbook.SheetNames[0];
                const hoja = workbook.Sheets[primeraHojaName];
                
                // Convertimos la hoja completa a una matriz de filas y columnas
                const filas = XLSX.utils.sheet_to_json(hoja, { header: 1 });
                
                productos = [];
                let vistos = new Set();
                
                // Recorremos desde la fila 0 hasta el final (los 1,327 registros)
                for (let i = 0; i < filas.length; i++) {
                    let fila = filas[i];
                    if (!fila || fila.length === 0) continue;
                    
                    // Buscamos la celda de descripción (por lo general en la columna C, índice 2, o barremos la fila)
                    let descripcion = "";
                    let precioCelda = 0;
                    
                    for (let c = 0; c < fila.length; c++) {
                        let val = String(fila[c] || "").trim();
                        // Si encontramos texto largo que parezca un producto
                        if (val.length > 5 && !val.toLowerCase().includes('detalle') && !val.toLowerCase().includes('descripcion') && !val.toLowerCase().includes('estado')) {
                            if (!descripcion) descripcion = val;
                        }
                    }

                    if (descripcion && !vistos.has(descripcion)) {
                        vistos.add(descripcion);

                        // Extracción de precio mediante expresión regular en la descripción o buscando números en otras columnas
                        let precioNum = 0.00;
                        let matchPrecio = descripcion.match(/Q\.?\s*(\d+(\.\d+)?)/i);
                        if (matchPrecio) {
                            precioNum = parseFloat(matchPrecio[1]);
                        } else {
                            // Buscar en las demás celdas de la misma fila si hay un número que sea el precio
                            for (let c = 0; c < fila.length; c++) {
                                let num = parseFloat(fila[c]);
                                if (!isNaN(num) && num > 0 && num < 10000 && (String(fila[c]).includes('.') || num % 1 !== 0 || fila.length > 4)) {
                                    precioNum = num;
                                    break;
                                }
                            }
                        }

                        productos.push({ id: i, descripcion, precio: precioNum });
                    }
                }

                mostrarProductos(productos);
            } catch (error) {
                console.error(error);
                document.getElementById('catalogo-grid').innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">Error al cargar el archivo Excel. Verifique los permisos del enlace en Drive.</p>';
            }
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            // Mostramos los primeros 50 para fluidez inicial, el buscador filtra todo el archivo
            const muestra = lista.slice(0, 50);
            grid.innerHTML = muestra.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">+ Agregar</button>
                    </div>
                `;
            }).join('') + (lista.length > 50 ? `<p style="text-align:center; grid-column:1/-1; color:#f1c40f; padding: 10px;">Mostrando 50 de ${lista.length} productos cargados. Escriba en el buscador para encontrar cualquier artículo.</p>` : '');
        }

        function filtrarProductos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.descripcion.toLowerCase().includes(texto));
            
            const grid = document.getElementById('catalogo-grid');
            if (filtrados.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontró ningún producto con ese nombre.</p>';
                return;
            }
            
            grid.innerHTML = filtrados.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${originalIndex})">+ Agregar</button>
                    </div>
                `;
            }).join('');
        }

        function agregarAlCarrito(index) {
            let producto = productos[index];
            if (!producto) return;
            
            let nombre = producto.descripcion;
            let precio = producto.precio;

            if (!carrito[nombre]) {
                carrito[nombre] = { precio: precio, cantidad: 0 };
            }
            carrito[nombre].cantidad += 1;
            actualizarTicketWhatsApp();
        }

        function actualizarTicketWhatsApp() {
            let totalItems = 0;
            let totalGeneral = 0;
            let mensaje = "Hola, me gustaría realizar el siguiente pedido:%0A";
            
            for (let nombre in carrito) {
                let cant = carrito[nombre].cantidad;
                let sub = cant * carrito[nombre].precio;
                totalItems += cant;
                totalGeneral += sub;
                mensaje += `- ${cant}x ${nombre} (Q ${sub.toFixed(2)})%0A`;
            }
            mensaje += `%0ATotal general: Q ${totalGeneral.toFixed(2)}`;

            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-quetzales').innerText = `Q ${totalGeneral.toFixed(2)}`;
            document.getElementById('whatsapp-pedido').href = `https://wa.me/50248502382?text=${mensaje}`;
        }

        cargarExcel();
    </script>
</body>
</html>
