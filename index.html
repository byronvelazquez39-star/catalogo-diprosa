<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo DIPROSA</title>
<style>
:root {
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --accent-color: #3b82f6;
  --accent-hover: #2563eb;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --success-color: #22c55e;
  --danger-color: #ef4444;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
body {
  background-color: var(--bg-color);
  color: var(--text-main);
  padding: 20px;
  padding-bottom: 120px;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
header {
  margin-bottom: 24px;
  text-align: center;
}
h1 {
  font-size: 1.8rem;
  margin-bottom: 12px;
  color: var(--text-main);
}
.search-box {
  width: 100%;
  max-width: 600px;
  padding: 12px 20px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background-color: var(--card-bg);
  color: var(--text-main);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
  margin: 0 auto;
  display: block;
}
.search-box:focus {
  border-color: var(--accent-color);
}
.stats {
  margin-top: 8px;
  font-size: 0.875rem;
  color: var(--text-muted);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 8px;
}
.card-price {
  font-size: 1.25rem;
  color: var(--accent-color);
  font-weight: bold;
  margin-bottom: 12px;
}
.btn-add {
  background-color: var(--accent-color);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  width: 100%;
  transition: background-color 0.2s;
}
.btn-add:hover {
  background-color: var(--accent-hover);
}
/* Ticket Flotante */
.cart-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 360px;
  max-width: calc(100vw - 40px);
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  max-height: 500px;
  z-index: 1000;
}
.cart-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.cart-items {
  overflow-y: auto;
  padding: 12px 16px;
  flex-grow: 1;
}
.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 0.9rem;
}
.cart-item-info {
  flex-grow: 1;
  margin-right: 8px;
}
.cart-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-qty {
  background-color: var(--border-color);
  color: var(--text-main);
  border: none;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}
.btn-remove {
  background-color: transparent;
  color: var(--danger-color);
  border: none;
  cursor: pointer;
  margin-left: 6px;
  font-size: 1.1rem;
}
.cart-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-color);
  background-color: rgba(0,0,0,0.2);
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
}
.cart-total {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  margin-bottom: 12px;
  font-size: 1.1rem;
}
.btn-whatsapp {
  background-color: var(--success-color);
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  width: 100%;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-whatsapp:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Catálogo DIPROSA</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Buscar productos...">
    <div id="stats" class="stats">Cargando productos...</div>
  </header>
  <div id="productGrid" class="grid"></div>
</div>

<div class="cart-float">
  <div class="cart-header">
    <span>Pedido Actual</span>
    <span id="cartCount">0 items</span>
  </div>
  <div id="cartItems" class="cart-items">
    <div style="color: var(--text-muted); text-align: center; padding: 20px;">Tu carrito está vacío</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cartTotal">Q0.00</span>
    </div>
    <button id="btnWhatsApp" class="btn-whatsapp" disabled onclick="enviarPedidoWhatsApp()">
      Pedir por WhatsApp
    </button>
  </div>
</div>

<script>
let productos = [];
let carrito = [];
const telefonoWhatsApp = "50248502382"; // Número de contacto DIPROSA

async function cargarProductos() {
  try {
    const respuesta = await fetch('productos.csv');
    const texto = await respuesta.text();
    parsearCSV(texto);
  } catch (error) {
    document.getElementById('stats').innerText = "Error al cargar el archivo de productos.";
    console.error(error);
  }
}

function parsearCSV(texto) {
  const lineas = texto.split('\n');
  productos = [];
  // Se asume formato: Nombre, Precio (y opcional Imagen/Categoría)
  for (let i = 1; i < lineas.length; i++) {
    const linea = lineas[i].trim();
    if (!linea) continue;
    const columnas = linea.split(',');
    if (columnas.length >= 2) {
      productos.push({
        nombre: columnas[0].replace(/^"|"$/g, '').trim(),
        precio: parseFloat(columnas[1].replace(/^"|"$/g, '').trim()) || 0
      });
    }
  }
  document.getElementById('stats').innerText = `${productos.length} productos disponibles`;
  renderizarProductos(productos);
}

function normalizarTexto(texto) {
  return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function renderizarProductos(lista) {
  const grid = document.getElementById('productGrid');
  if (lista.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No se encontraron productos</div>';
    return;
  }
  
  grid.innerHTML = lista.map((p, index) => `
    <div class="card">
      <div>
        <div class="card-title">${p.nombre}</div>
        <div class="card-price">Q ${p.precio.toFixed(2)}</div>
      </div>
      <button class="btn-add" onclick="agregarAlCarrito('${p.nombre.replace(/'/g, "\\'")}', ${p.precio})">Agregar</button>
    </div>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const busqueda = normalizarTexto(e.target.value);
  const filtrados = productos.filter(p => normalizarTexto(p.nombre).includes(busqueda));
  renderizarProductos(filtrados);
});

function agregarAlCarrito(nombre, precio) {
  const itemExistente = carrito.find(item => item.nombre === nombre);
  if (itemExistente) {
    itemExistente.cantidad += 1;
  } else {
    carrito.push({ nombre, precio, cantidad: 1 });
  }
  actualizarCarrito();
}

function cambiarCantidad(nombre, cambio) {
  const item = carrito.find(i => i.nombre === nombre);
  if (item) {
    item.cantidad += cambio;
    if (item.cantidad <= 0) {
      carrito = carrito.filter(i => i.nombre !== nombre);
    }
  }
  actualizarCarrito();
}

function actualizarCarrito() {
  const contenedorItems = document.getElementById('cartItems');
  const totalSpan = document.getElementById('cartTotal');
  const contadorSpan = document.getElementById('cartCount');
  const btnWhatsApp = document.getElementById('btnWhatsApp');

  if (carrito.length === 0) {
    contenedorItems.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Tu carrito está vacío</div>';
    totalSpan.innerText = 'Q0.00';
    contadorSpan.innerText = '0 items';
    btnWhatsApp.disabled = true;
    return;
  }

  let total = 0;
  let cantidadTotal = 0;

  contenedorItems.innerHTML = carrito.map(item => {
    total += item.precio * item.cantidad;
    cantidadTotal += item.cantidad;
    return `
      <div class="cart-item">
        <div class="cart-item-info">
          <div>${item.nombre}</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">Q ${item.precio.toFixed(2)} c/u</div>
        </div>
        <div class="cart-controls">
          <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', -1)">-</button>
          <span>${item.cantidad}</span>
          <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', 1)">+</button>
          <button class="btn-remove" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', -${item.cantidad})">&times;</button>
        </div>
      </div>
    `;
  }).join('');

  totalSpan.innerText = `Q ${total.toFixed(2)}`;
  contadorSpan.innerText = `${cantidadTotal} item(s)`;
  btnWhatsApp.disabled = false;
}

function enviarPedidoWhatsApp() {
  if (carrito.length === 0) return;
  
  let mensaje = "Hola, DIPROSA. Quisiera hacer el siguiente pedido:\n\n";
  let total = 0;
  
  carrito.forEach(item => {
    let subtotal = item.precio * item.cantidad;
    total += subtotal;
    mensaje += `- ${item.cantidad}x ${item.nombre} (Q ${subtotal.toFixed(2)})\n`;
  });
  
  mensaje += `\n*Total a pagar: Q ${total.toFixed(2)}*`;
  
  const url = `https://wa.me/${telefonoWhatsApp}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}

cargarProductos();
</script>

</body>
</html>
