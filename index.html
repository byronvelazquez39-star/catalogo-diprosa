<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Estuardo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-top h2 {
            color: #f1c40f;
            margin: 0;
            font-size: 1.2em;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .mini-btn {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: none;
        }
        .search-box {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            text-align: center;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            outline: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
        }
        .card h3 {
            font-size: 0.95em;
            margin: 0 0 10px 0;
            color: #ffffff;
            line-height: 1.4;
        }
        .precio {
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.2em;
            margin: 0 0 12px 0;
        }
        .btn-agregar {
            background-color: #1b8e3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0b0b;
            border-top: 2px solid #222;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            z-index: 1000;
        }
        .footer-info {
            font-size: 0.9em;
            color: #fff;
        }
        .footer-info span {
            color: #2ecc71;
            font-weight: bold;
        }
        .ver-ticket-btn {
            background-color: #1b8e3e;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>📦 ESTUARDO</h2>
        <div class="header-btns">
            <a href="#" class="mini-btn">📊 Metas</a>
            <a href="#" class="mini-btn">💰 Sueldo</a>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="buscador" placeholder="Escriba para buscar producto..." onkeyup="filtrarProductos()">
    </div>

    <div class="grid" id="catalogo-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando inventario...</p>
    </div>

    <div class="footer-bar">
        <div class="footer-info">
            🛒 <span id="contador-items">0</span> ítems (Ver Ticket)<br>
            Total: <span id="total-quetzales">Q 0.00</span>
        </div>
        <a href="#" id="whatsapp-pedido" class="ver-ticket-btn" target="_blank" rel="noopener noreferrer">
            📋 Ver Ticket
        </a>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1yRkOiPyX6hEnIhtuQarQXWXkPPTD65jS/export?format=csv';
        
        let productos = [];
        let carrito = {};

        async function cargarProductos() {
            try {
                const respuesta = await fetch(SHEET_URL);
                const datos = await respuesta.text();
                parsearCSV(datos);
            } catch (error) {
                document.getElementById('catalogo-grid').innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">Error al conectar con la hoja.</p>';
            }
        }

        function parsearCSV(texto) {
            const lineas = texto.split('\n');
            productos = [];
            let vistos = new Set();
            
            for (let i = 25; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    let descripcion = columnas[2] ? columnas[2].replace(/"/g, '').trim() : '';
                    
                    if (descripcion && !descripcion.includes('{') && !descripcion.includes('function') && descripcion.length > 2) {
                        
                        if (vistos.has(descripcion)) continue;
                        vistos.add(descripcion);

                        let precioNum = 0.00;
                        let matchPrecio = descripcion.match(/Q\.?\s*(\d+(\.\d+)?)/i);
                        if (matchPrecio) {
                            precioNum = parseFloat(matchPrecio[1]);
                        } else if (columnas[4]) {
                            let matchCol = columnas[4].replace(/"/g, '').match(/(\d+(\.\d+)?)/);
                            if (matchCol) precioNum = parseFloat(matchCol[1]);
                        }

                        productos.push({ id: i, descripcion, precio: precioNum });
                    }
                }
            }
            mostrarProductos(productos);
        }

        function mostrarProductos(lista) {
            const grid = document.getElementById('catalogo-grid');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }
            
            grid.innerHTML = lista.map((p) => {
                let originalIndex = productos.findIndex(prod => prod.id === p.id);
                return `
                    <div class="card">
                        <h3>${p.descripcion}</h3>
                        <p class="precio">Q ${p.precio.toFixed(2)}</p>
