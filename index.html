<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Pedidos DIPROSA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #38bdf8; }
        .card-resumen { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }
        tr:hover { background: #273548; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; display: block; margin: 0 auto 20px auto; }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

    <h1>Panel de Administración DIPROSA</h1>
    
    <div class="card-resumen">
        <h3>Total Acumulado de Ventas: <span id="totalVentas">Q0.00</span></h3>
        <p>Total de Pedidos Recibidos: <span id="cantidadPedidos">0</span></p>
    </div>

    <button onclick="cargarPedidosAdmin()">Actualizar Pedidos</button>

    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Vendedor</th>
                <th>Cliente</th>
                <th>Total (Q)</th>
                <th>Detalle</th>
            </tr>
         ilə
        <tbody id="tablaPedidos">
            <tr><td colspan="5" style="text-align: center;">Cargando pedidos...</td></tr>
        </tbody>
    </table>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwDkG1DfkduR7P4BMzenv3jB5vxVjXkV-SVefPobpUTw8yY1k84BGlBIJ5uP9AK0ldC/exec";

        async function cargarPedidosAdmin() {
            const tabla = document.getElementById("tablaPedidos");
            tabla.innerHTML = `<tr><td colspan="5" style="text-align: center;">Actualizando...</td></tr>`;

            try {
                let respuesta = await fetch(URL_WEB_APP);
                let listaPedidos = await respuesta.json();
                
                tabla.innerHTML = "";
                let acumuladoGlobal = 0;
                let totalTickets = listaPedidos.length;

                if (totalTickets === 0) {
                    tabla.innerHTML = `<tr><td colspan="5" style="text-align: center;">No hay pedidos registrados todavía.</td></tr>`;
                    document.getElementById("totalVentas").innerText = "Q0.00";
                    document.getElementById("cantidadPedidos").innerText = "0";
                    return;
                }

                listaPedidos.forEach(item => {
                    let totalNum = parseFloat(item.total) || 0;
                    acumuladoGlobal += totalNum;

                    let fila = `<tr>
                        <td>${item.fecha || ''}</td>
                        <td><b>${item.vendedor || ''}</b></td>
                        <td>${item.cliente || ''}</td>
                        <td>Q${totalNum.toFixed(2)}</td>
                        <td>${item.detalle || ''}</td>
                    </tr>`;
                    tabla.innerHTML += fila;
                });

                document.getElementById("totalVentas").innerText = "Q" + acumuladoGlobal.toFixed(2);
                document.getElementById("cantidadPedidos").innerText = totalTickets;

            } catch (error) {
                console.error("Error al cargar los pedidos del panel:", error);
                tabla.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f87171;">Error al conectar con la hoja de pedidos.</td></tr>`;
            }
        }

        // Cargar automáticamente al abrir la página
        cargarPedidosAdmin();
    </script>
</body>
</html>
