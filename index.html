<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DIPROSA - Estuardo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 12px; }
        h1 { text-align: center; color: #ff9800; font-size: 16px; margin: 5px 0 10px 0; }
        .input-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #444; background-color: #222; color: #fff; box-sizing: border-box; font-size: 13px; }
        
        /* Campo de búsqueda destacado */
        .search-box {
            border: 1px solid #ff9800 !important;
            background-color: #1a1a1a !important;
        }

        .product-card { 
            background-color: #1e1e1e; 
            border: 1px solid #333; 
            padding: 8px 10px; 
            border-radius: 6px; 
            margin-bottom: 6px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .product-info strong { font-size: 13px; display: block; }
        .product-info span { font-size: 12px; color: #4CAF50; font-weight: bold; }
        .btn { background-color: #ff9800; color: #000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* Cuadro del Resumen del Pedido */
        .cart-box {
            background-color: #1a1a1a;
            border: 1px solid #ff9800;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
        }
        .cart-box h3 { margin: 0 0 8px 0; font-size: 14px; color: #ff9800; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .cart-item { font-size: 13px; margin-bottom: 4px; color: #ddd; display: flex; justify-content: space-between; }
        .cart-total { font-size: 15px; font-weight: bold; color: #4CAF50; margin-top: 10px; text-align: right; }
        .btn-send { background-color: #25D366; color: #fff; width: 100%; padding: 10px; font-size: 14px; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body onload="renderProducts(); renderCart();">

    <h1>🛒 Catálogo DIPROSA - ESTUARDO</h1>

    <div class="input-group">
        <label for="clienteNombre">Nombre del Cliente / Tienda:</label>
        <input type="text" id="clienteNombre" placeholder="Ej. Tienda La Guadalupana">
    </div>

    <!-- Campo de Búsqueda de Productos -->
    <div class="input-group">
        <label for="buscarProducto" style="color: #ff9800;">🔍 Buscar Producto:</label>
        <input type="text" id="buscarProducto" class="search-box" placeholder="Escriba para filtrar productos..." oninput="filtrarProductos()">
    </div>

    <h3 style="font-size: 13px; color: #aaa; margin: 8px 0 5px 0;">Productos Disponibles</h3>
    <div id="productsList"></div>

    <!-- Resumen del Pedido (Inicia oculto) -->
    <div class="cart-box" id="cartContainer" style="display: none;">
        <h3>📋 Resumen del Pedido</h3>
        <div id="cartItems"></div>
        <div class="cart-total">Total: Q <span id="cartTotal">0.00</span></div>
        <button class="btn-send" onclick="enviarPedido()">📲 Confirmar y Enviar por WhatsApp</button>
    </div>

    <script>
        // Catálogo de Productos
        const productos = [
            { id: 1, name: 'Limonada Salvavidas lata', price: 67.00 },
            { id: 2, name: 'Soda Naranjada Carnaval lata', price: 67.00 },
            { id: 3, name: 'Almohadita fardo 4 oz', price: 110.00 },
            { id: 4, name: 'Salvavidas Roja lata', price: 67.00 }
        ];

        let cart = [];

        function renderProducts(filtro = '') {
            const listEl = document.getElementById("productsList");
            listEl.innerHTML = '';

            const filtrados = productos.filter(p => p.name.toLowerCase().includes(filtro.toLowerCase()));

            if (filtrados.length === 0) {
                listEl.innerHTML = `<div style="color: #888; font-style: italic; font-size: 12px; text-align: center; padding: 10px;">No se encontraron productos.</div>`;
                return;
            }

            filtrados.forEach(p => {
                listEl.innerHTML += `
                    <div class="product-card">
                        <div class="product-info">
                            <strong>${p.name}</strong>
                            <span>Q ${p.price.toFixed(2)}</span>
                        </div>
                        <button class="btn" onclick="addToCart('${p.name}', ${p.price})">+ Agregar</button>
                    </div>
                `;
            });
        }

        function filtrarProductos() {
            const texto = document.getElementById("buscarProducto").value;
            renderProducts(texto);
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItems");
            const totalEl = document.getElementById("cartTotal");
            const box = document.getElementById("cartContainer");

            if (cart.length === 0) {
                box.style.display = "none";
                container.innerHTML = "";
                totalEl.innerText = "0.00";
                return;
            }

            box.style.display = "block";

            let html = "";
            let total = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                html += `<div class="cart-item"><span>• ${item.name} (x${item.qty})</span><span>Q${subtotal.toFixed(2)}</span></div>`;
            });

            container.innerHTML = html;
            totalEl.innerText = total.toFixed(2);
        }

        function enviarPedido() {
            if (cart.length === 0) return;

            const cliente = document.getElementById("clienteNombre").value || "Cliente General";
            const totalVenta = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const nuevoTiquete = {
                fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                cliente: cliente,
                items: cart.map(item => ({ name: item.name, qty: item.qty, price: item.price })),
                total: totalVenta
            };

            let tiquetesGuardados = JSON.parse(localStorage.getItem('diprosa_tickets_estuardo')) || [];
            tiquetesGuardados.push(nuevoTiquete);
            localStorage.setItem('diprosa_tickets_estuardo', JSON.stringify(tiquetesGuardados));

            let mensaje = `DISTRIBUIDORA DIPROSA\n👤 Vendedor: ESTUARDO\n👤 Cliente: ${cliente}\n------------------------------\n`;
            cart.forEach(item => {
                mensaje += `${item.name} (x${item.qty}) = Q${(item.price * item.qty).toFixed(2)}\n`;
            });
            mensaje += `------------------------------\nTOTAL: Q${totalVenta.toFixed(2)}\n¡Hola! Confirmo este pedido.`;

            cart = [];
            document.getElementById("clienteNombre").value = "";
            document.getElementById("buscarProducto").value = "";
            renderProducts();
            renderCart();

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
