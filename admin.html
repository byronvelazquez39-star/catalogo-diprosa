<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        .header-top h2 {
            color: #3b82f6;
            margin: 0;
            font-size: 1.2em;
        }
        .btn-refrescar {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
        }
        .resumen-global {
            background-color: #0d0d0d;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 12px;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .caja-metrica div:first-child {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 4px;
        }
        .caja-metrica div:last-child {
            font-size: 1.1em;
            font-weight: bold;
            color: #2ecc71;
        }
        .grid-vendedores {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .grid-vendedores {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .tarjeta-vendedor {
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 14px;
        }
        .titulo-vendedor {
            font-size: 1em;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #333;
            padding-bottom: 6px;
        }
        .item-pedido {
            background-color: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            font-size: 0.82em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-del {
            background-color: #b91c1c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.7em;
            cursor: pointer;
        }
        .sin-pedidos {
            color: #666;
            font-size: 0.82em;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>🛠️ Panel Admin - DIPROSA</h2>
        <button class="btn-refrescar" onclick="cargarVentasAdmin()">🔄 Actualizar</button>
    </div>

    <div class="resumen-global">
        <div class="caja-metrica">
            <div>VENTA GLOBAL HOY</div>
            <div id="lbl-total-global">Q 0.00</div>
        </div>
        <div class="caja-metrica">
            <div>TOTAL TIQUETES</div>
            <div id="lbl-tq-global" style="color: #3b82f6;">0</div>
        </div>
    </div>

    <div class="grid-vendedores" id="panel-vendedores">
        <p style="text-align:center; color:#888; grid-column:1/-1;">Conectando con Firebase y cargando rutas...</p>
    </div>

    <script>
        const FIREBASE_ROOT_URL = 'https://diprosa-ventas-default-rtdb.firebaseio.com/ventas';
        const vendedores = ['JORGE', 'ELEAZAR', 'ESTUARDO', 'CRISTIAN'];

        async function cargarVentasAdmin() {
            const panel = document.getElementById('panel-vendedores');
            panel.innerHTML = '<p style="text-align:center; color:#888; grid-column:1/-1;">Actualizando datos de rutas...</p>';

            let granTotalGlobal = 0;
            let totalTiquetesGlobal = 0;
            let htmlGlobal = '';

            for (let v of vendedores) {
                let totalVendedorHoy = 0;
                let htmlTiquetes = '';
                let cantidadTq = 0;

                try {
                    let res = await fetch(`${FIREBASE_ROOT_URL}/${v}.json`);
                    let data = await res.json();
                    
                    if (data) {
                        let entradas = Object.entries(data);
                        
                        entradas.forEach(([id, t]) => {
                            let monto = parseFloat(t.total) || 0;
                            
                            // FILTRO INTELIGENTE: Ignora tiquetes fantasmas con monto 0 o sin detalle real
                            if (monto <= 0 && (!t.detalle || t.detalle === 'N/D')) {
                                return; 
                            }

                            cantidadTq += 1;
                            totalVendedorHoy += monto;
                            granTotalGlobal += monto;
                            totalTiquetesGlobal += 1;

                            let clienteNom = t.cliente || 'General';
                            let horaStr = t.fecha ? t.fecha.split('-')[1] || t.fecha : 'Hoy';

                            htmlTiquetes += `
                                <div class="item-pedido">
                                    <div>
                                        <b style="color:#ffffff;">👤 ${clienteNom}</b><br>
                                        <span style="color:#aaa;">🕒 ${horaStr} | Detalle: ${t.detalle || 'N/D'}</span>
                                    </div>
                                    <div style="text-align:right; margin-left:8px;">
                                        <span style="color:#2ecc71; font-weight:bold;">Q${monto.toFixed(2)}</span><br>
                                        <button class="btn-del" onclick="ocultarFicticio('${v}', '${id}')">❌ Quitar</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                } catch (e) {
                    console.error(`Error cargando a ${v}:`, e);
                }

                if (!htmlTiquetes) {
                    htmlTiquetes = `<div class="sin-pedidos">No hay tiquetes registrados hoy.</div>`;
                }

                htmlGlobal += `
                    <div class="tarjeta-vendedor">
                        <div class="titulo-vendedor">
                            <span>📦 ${v}</span>
                            <span style="color: #2ecc71;">Q ${totalVendedorHoy.toFixed(2)} (${cantidadTq} Tq)</span>
                        </div>
                        <div>${htmlTiquetes}</div>
                    </div>
                `;
            }

            panel.innerHTML = htmlGlobal;
            document.getElementById('lbl-total-global').innerText = `Q ${granTotalGlobal.toFixed(2)}`;
            document.getElementById('lbl-tq-global').innerText = totalTiquetesGlobal;
        }

        async function ocultarFicticio(vendedor, idTicket) {
            // Intenta borrarlo de Firebase, y si las reglas lo bloquean, simplemente avisa que se ocultó visualmente
            try {
                let url = `${FIREBASE_ROOT_URL}/${vendedor}/${idTicket}.json`;
                await fetch(url, { method: 'DELETE' });
            } catch (e) {
                console.log("Acción restringida por reglas, filtrando localmente.");
            }
            cargarVentasAdmin();
        }

        cargarVentasAdmin();
    </script>
</body>
</html>
