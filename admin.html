<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - DIPROSA</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #27ae60;
      --primary-color: #f59e0b;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    h1 { font-size: 20px; color: var(--primary-color); text-align: center; margin-bottom: 20px; }
    .resumen-global {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    .resumen-global h2 { margin: 0 0 10px 0; font-size: 16px; color: #aaa; }
    .total-monto { font-size: 24px; color: var(--accent-color); font-weight: bold; }
    .vendedor-seccion {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .vendedor-seccion h3 { margin: 0 0 10px 0; font-size: 16px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .ticket-item {
      background: #252525;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--accent-color);
    }
    .btn-limpiar {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      margin-top: 5px;
    }
    .sin-datos { font-size: 13px; color: #777; font-style: italic; }
  </style>
</head>
<body>

  <h1>📊 Panel Central de Auditoría - DIPROSA</h1>

  <div class="resumen-global">
    <h2>VENTAS TOTALES ACUMULADAS</h2>
    <div class="total-monto">Q <span id="monto-global">0.00</span></div>
  </div>

  <div id="contenedor-vendedores">
    <!-- Se llena dinámicamente -->
  </div>

  <script>
    const vendedores = [
      { id: 'cristian', nombre: 'Cristian', key: 'historial_ventas_cristian' },
      { id: 'jorge', nombre: 'Jorge', key: 'historial_ventas_jorge' },
      { id: 'eleazar', nombre: 'Eleazar', key: 'historial_ventas_eleazar' },
      { id: 'estuardo', nombre: 'Estuardo', key: 'historial_ventas_estuardo' }
    ];

    function cargarPanel() {
      let contenedor = document.getElementById('contenedor-vendedores');
      let html = '';
      let montoGlobal = 0;

      vendedores.forEach(v => {
        let historial = [];
        try {
          historial = JSON.parse(localStorage.getItem(v.key)) || [];
        } catch(e) {
          historial = [];
        }

        let totalVendedor = historial.reduce((sum, item) => sum + (parseFloat(item.total) || 0), 0);
        montoGlobal += totalVendedor;

        html += `
          <div class="vendedor-seccion">
            <h3>
              <span>👤 ${v.nombre}</span>
              <span style="font-size: 14px; color: var(--accent-color);">Total: Q ${totalVendedor.toFixed(2)}</span>
            </h3>
        `;

        if (historial.length === 0) {
          html += `<div class="sin-datos">No hay tiquetes registrados aún.</div>`;
        } else {
          html += `<div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;">`;
          historial.slice().reverse().forEach(t => {
            html += `
              <div class="ticket-item">
                <div>
                  <strong>Tiquete #${t.numero || 'S/N'}</strong> - ${t.cliente || 'Cliente general'}<br>
                  <span style="font-size: 11px; color: #aaa;">${t.fecha || ''}</span>
                </div>
                <div style="font-weight: bold; color: var(--accent-color);">Q ${parseFloat(t.total).toFixed(2)}</div>
              </div>
            `;
          });
          html += `</div>`;
          html += `<button class="btn-limpiar" onclick="limpiarHistorial('${v.key}')">🗑️ Borrar historial de ${v.nombre}</button>`;
        }

        html += `</div>`;
      });

      contenedor.innerHTML = html;
      document.getElementById('monto-global').innerText = montoGlobal.toFixed(2);
    }

    function limpiarHistorial(key) {
      if (confirm("¿Está seguro de borrar el historial de este vendedor?")) {
        localStorage.removeItem(key);
        cargarPanel();
      }
    }

    document.addEventListener('DOMContentLoaded', cargarPanel);
  </script>
</body>
</html>
