<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        h2 {
            color: #ff9800;
            margin: 0;
            font-size: 1.1em;
        }
        .btn-actualizar {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .vendedor-box {
            background-color: #0d0d0d;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .vendedor-titulo {
            color: #2ecc71;
            font-size: 1em;
            font-weight: bold;
            border-bottom: 1px dashed #333;
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .tiquete-item {
            background-color: #161616;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 0.82em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-vendedor {
            color: #fb923c;
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.9em;
            text-align: right;
        }
        .resumen-global {
            background-color: #051408;
            border: 1px solid #166534;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .resumen-global h3 {
            color: #2ecc71;
            margin: 0 0 5px 0;
            font-size: 1em;
        }
        .resumen-global p {
            margin: 0;
            font-size: 1.2em;
            font-weight: bold;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h2>📦 DIPROSA - ADMIN</h2>
        <button onclick="cargarVentasAdmin()" class="btn-actualizar">🔄 Actualizar</button>
    </div>

    <div class="container">
        <div class="resumen-global">
            <h3>📊 VENTAS TOTALES DE HOY (TODAS LAS RUTAS)</h3>
            <p id="total-global">Q 0.00</p>
        </div>

        <div id="panel-admin">
            <p style="text-align: center; color: #888;">Cargando tiquetes en tiempo real...</p>
        </div>
    </div>

    <script>
        const FIREBASE_ROOT_URL = 'https://diprosa-ventas-default-rtdb.firebaseio.com/ventas.json';
        const vendedores = ['JORGE', 'ELEAZAR', 'ESTUARDO', 'CRISTIAN'];

        async function cargarVentasAdmin() {
            try {
                const respuesta = await fetch(FIREBASE_ROOT_URL);
                const datos = await respuesta.json();
                
                const panel = document.getElementById('panel-admin');
                let htmlGlobal = '';
                let granTotalGlobal = 0;

                vendedores.forEach(vendedor => {
                    let ventasVendedor = (datos && datos[vendedor]) ? Object.entries(datos[vendedor]) : [];
                    let totalVendedorHoy = 0;
                    let htmlTiquetes = '';

                    if (ventasVendedor.length > 0) {
                        ventasVendedor.forEach(([id, t], index) => {
                            let monto = parseFloat(t.total) || 0;
                            totalVendedorHoy += monto;
                            granTotalGlobal += monto;
                            
                            let horaStr = t.fecha ? t.fecha.split('-')[1] || t.fecha : 'Hoy';
                            let clienteNom = t.cliente || 'General';

                            htmlTiquetes += `
                                <div class="tiquete-item">
                                    <div style="flex-grow: 1; padding-right: 8px;">
                                        <div style="color:#3b82f6; font-weight:bold;">Tiquete #${index + 1} - 👤 ${clienteNom}</div>
                                        <div style="color:#aaa; font-size:0.75em; margin-top:2px;">Hora: ${horaStr} | Detalle: ${t.detalle || ''}</div>
                                    </div>
                                    <div style="color:#2ecc71; font-weight:bold; font-size:0.95em; white-space:nowrap;">Q${monto.toFixed(2)}</div>
                                </div>
                            `;
                        });
                    } else {
                        htmlTiquetes = '<div style="color:#666; font-size:0.8em; padding:4px;">Sin tiquetes registrados.</div>';
                    }

                    htmlGlobal += `
                        <div class="vendedor-box">
                            <div class="vendedor-titulo">
                                <span>👤 ${vendedor}</span>
                                <span style="font-size:0.85em; color:#aaa;">(${ventasVendedor.length} tiquetes)</span>
                            </div>
                            ${htmlTiquetes}
                            <div class="total-vendedor">Total ${vendedor}: Q ${totalVendedorHoy.toFixed(2)}</div>
                        </div>
                    `;
                });

                panel.innerHTML = htmlGlobal;
                document.getElementById('total-global').innerText = `Q ${granTotalGlobal.toFixed(2)}`;

            } catch (error) {
                console.error("Error al sincronizar datos:", error);
                document.getElementById('panel-admin').innerHTML = '<p style="text-align:center; color:#ef4444;">Error al conectar con la base de datos.</p>';
            }
        }

        // Cargar al abrir y actualizar automáticamente cada 5 segundos
        cargarVentasAdmin();
        setInterval(cargarVentasAdmin, 5000);
    </script>
</body>
</html>
