<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - DIPROSA</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #27ae60;
      --text-color: #f0f6fc;
      --subtext-color: #8b949e;
      --border-color: #30363d;
      --header-bg: #1f2937;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .header-bar {
      text-align: center;
      padding: 15px;
      background-color: var(--header-bg);
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      color: #f39c12;
    }
    .status-badge {
      font-size: 13px;
      color: #2ecc71;
      margin-top: 5px;
      display: block;
    }
    .vendedor-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .vendedor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .vendedor-title {
      font-size: 16px;
      font-weight: bold;
      color: #f39c12;
    }
    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ticket-card {
      background-color: #21262d;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
    }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--subtext-color);
      margin-bottom: 5px;
    }
    .ticket-cliente {
      font-weight: bold;
      color: var(--text-color);
      font-size: 14px;
    }
    .ticket-total {
      color: #2ecc71;
      font-weight: bold;
      font-size: 15px;
      text-align: right;
    }
    .ticket-detalle {
      font-size: 12px;
      color: var(--subtext-color);
      margin-top: 5px;
      white-space: pre-line;
    }
    .no-data {
      font-style: italic;
      color: var(--subtext-color);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📊 PANEL DE ADMINISTRACIÓN - DIPROSA</h1>
    <span class="status-badge" id="status-indicador">🟢 Conectado en tiempo real</span>
  </div>

  <div id="vendedores-container">
    <!-- Secciones cargadas dinámicamente -->
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxIwzEb3YcbcPUmOBUs7zsMYeci2O6M7F737Wpq2F8zocxXmFeBIivzlh9moJ1LeGlD/exec';
    const vendedores = ['ESTUARDO', 'CRISTIAN', 'JORGE', 'ELEAZAR'];

    function cargarPedidosEnTiempoReal() {
      document.getElementById('status-indicador').innerText = "🔄 Sincronizando ventas...";

      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          document.getElementById('status-indicador').innerText = "🟢 Conectado en tiempo real (" + new Date().toLocaleTimeString() + ")";
          renderizarPedidos(data);
        })
        .catch(error => {
          console.error("Error al obtener tiquetes:", error);
          document.getElementById('status-indicador').innerText = "🔴 Error al sincronizar";
        });
    }

    function renderizarPedidos(pedidos) {
      const container = document.getElementById('vendedores-container');
      container.innerHTML = '';

      vendedores.forEach(vendedor => {
        const pedidosVendedor = pedidos.filter(p => p.vendedor && p.vendedor.toUpperCase().trim() === vendedor);

        let htmlCard = `
          <div class="vendedor-card">
            <div class="vendedor-header">
              <span class="vendedor-title">👤 Vendedor: ${vendedor}</span>
            </div>
            <div class="ticket-list">
        `;

        if (pedidosVendedor.length === 0) {
          htmlCard += `<p class="no-data">No hay tiquetes registrados para este vendedor en la hoja de cálculo.</p>`;
        } else {
          pedidosVendedor.reverse().forEach(p => {
            htmlCard += `
              <div class="ticket-card">
                <div class="ticket-header">
                  <span>📅 ${p.fecha || 'Sin fecha'}</span>
                </div>
                <div class="ticket-cliente">👤 Cliente: ${p.cliente || 'Consumidor Final'}</div>
                <div class="ticket-detalle">${p.detalle || ''}</div>
                <div class="ticket-total">Total: Q${parseFloat(p.total || 0).toFixed(2)}</div>
              </div>
            `;
          });
        }

        htmlCard += `
            </div>
          </div>
        `;

        container.innerHTML += htmlCard;
      });
    }

    // Cargar inmediatamente
    cargarPedidosEnTiempoReal();

    // Actualizar automáticamente cada 15 segundos
    setInterval(cargarPedidosEnTiempoReal, 15000);
  </script>
</body>
</html>
