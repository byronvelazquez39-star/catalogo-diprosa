<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Central de Auditoría - DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            color: #ff9800;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .total-box {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .total-box h2 {
            margin: 0;
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
        }
        .total-box p {
            margin: 10px 0 0 0;
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }
        .seller-section {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .seller-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #2196F3;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .seller-total {
            color: #4CAF50;
        }
        .ticket-list {
            margin-top: 10px;
        }
        .ticket-item {
            background-color: #252525;
            border-left: 4px solid #ff9800;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
            position: relative;
        }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 5px;
        }
        .ticket-products {
            margin: 5px 0;
            color: #ccc;
            white-space: pre-line;
        }
        .ticket-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            font-weight: bold;
        }
        .btn-delete {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .no-tickets {
            color: #777;
            font-style: italic;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>📊 Panel Central de Auditoría - DIPROSA</h1>

    <div class="total-box">
        <h2>Ventas Totales Acumuladas</h2>
        <p id="globalTotal">Q 0.00</p>
    </div>

    <div id="sellersContainer">
        <!-- Las secciones de los vendedores se cargan automáticamente -->
    </div>

    <script>
        const sellers = ['Cristian', 'Jorge', 'Eleazar', 'Estuardo'];

        function loadAdminData() {
            const container = document.getElementById('sellersContainer');
            container.innerHTML = '';
            let globalSum = 0;

            sellers.forEach(seller => {
                const storageKey = `diprosa_tickets_${seller.toLowerCase()}`;
                let tickets = [];
                try {
                    tickets = JSON.parse(localStorage.getItem(storageKey)) || [];
                } catch(e) {
                    tickets = [];
                }

                let sellerSum = 0;
                let ticketsHTML = '';

                if (tickets.length === 0) {
                    ticketsHTML = `<div class="no-tickets">No hay tiquetes registrados aún.</div>`;
                } else {
                    tickets.forEach((ticket, index) => {
                        sellerSum += ticket.total || 0;
                        let itemsText = ticket.items ? ticket.items.map(i => `- ${i.name} (x${i.qty}) : Q ${(i.price * i.qty).toFixed(2)}`).join('\n') : (ticket.detalle || '');
                        
                        ticketsHTML += `
                            <div class="ticket-item">
                                <div class="ticket-header">
                                    <span>Tiquete #${index + 1} - ${ticket.fecha || 'Reciente'}</span>
                                </div>
                                <div class="ticket-products">${itemsText}</div>
                                <div class="ticket-footer">
                                    <span style="color:#4CAF50;">Total: Q ${(ticket.total || 0).toFixed(2)}</span>
                                    <button class="btn-delete" onclick="deleteTicket('${seller}', ${index})">🗑️ Eliminar</button>
                                </div>
                            </div>
                        `;
                    });
                }

                globalSum += sellerSum;

                container.innerHTML += `
                    <div class="seller-section">
                        <div class="seller-header">
                            <span>👤 ${seller}</span>
                            <span class="seller-total">Total: Q ${sellerSum.toFixed(2)}</span>
                        </div>
                        <div class="ticket-list">
                            ${ticketsHTML}
                        </div>
                    </div>
                `;
            });

            document.getElementById('globalTotal').innerText = `Q ${globalSum.toFixed(2)}`;
        }

        function deleteTicket(seller, index) {
            if (confirm(`¿Está seguro de eliminar este tiquete de ${seller}?`)) {
                const storageKey = `diprosa_tickets_${seller.toLowerCase()}`;
                let tickets = JSON.parse(localStorage.getItem(storageKey)) || [];
                tickets.splice(index, 1);
                localStorage.setItem(storageKey, JSON.stringify(tickets));
                loadAdminData();
            }
        }

        // Cargar al abrir la página
        loadAdminData();
    </script>
</body>
</html>
