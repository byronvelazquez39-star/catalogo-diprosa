<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administración - DIPROSA</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        padding: 12px;
        padding-bottom: 80px;
    }
    .header {
        text-align: center;
        margin-bottom: 20px;
    }
    h1 {
        color: #ff9800;
        font-size: 22px;
        margin: 5px 0;
    }
    .card-total-general {
        background: #122111;
        border: 2px solid #4CAF50;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        margin-bottom: 20px;
    }
    .card-total-general h2 {
        margin: 0 0 5px 0;
        font-size: 16px;
        color: #81C784;
    }
    .monto-general {
        font-size: 28px;
        font-weight: bold;
        color: #4CAF50;
    }
    .sub-general {
        font-size: 13px;
        color: #cccccc;
        margin-top: 5px;
    }
    .grid-vendedores {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .card-vendedor {
        background: #1e1e1e;
        border: 1px solid #333333;
        border-radius: 10px;
        padding: 15px;
    }
    .card-vendedor h3 {
        margin: 0 0 10px 0;
        color: #ff9800;
        font-size: 18px;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
    }
    .dato-fila {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 14px;
    }
    .loading {
        color: #888;
        font-style: italic;
    }
</style>
</head>
<body>

<div class="header">
    <h1>DIPROSA</h1>
    <p style="margin: 0; color: #888; font-size: 14px;">Panel de Control de Supervisión</p>
</div>

<div class="card-total-general">
    <h2>VENTA TOTAL ACUMULADA</h2>
    <div class="monto-general" id="totalGeneral">Cargando...</div>
    <div class="sub-general">Meta Global Equipos: Q324,000.00</div>
</div>

<div class="grid-vendedores" id="contenedorVendedores">
    <!-- Se cargan dinámicamente -->
</div>

<script>
const URL_API = "https://script.google.com/macros/s/AKfycby8Tsz4nbtawAEospmJfP29RLk40g-27PahblVhp0tr9wZsP7jnrbnRRIcwPEFHAT7DfA/exec";

const vendedores = [
    { id: 'estuardo', nombre: 'Estuardo', metaVenta: 81000, metaTickets: 81 },
    { id: 'cristian', nombre: 'Cristian', metaVenta: 81000, metaTickets: 81 },
    { id: 'eleazar', nombre: 'Eleazar', metaVenta: 81000, metaTickets: 81 },
    { id: 'jorge', nombre: 'Jorge', metaVenta: 81000, metaTickets: 81 }
];

async function cargarPanel() {
    let contenedor = document.getElementById('contenedorVendedores');
    contenedor.innerHTML = '';
    let acumuladoGlobal = 0;

    for (let v of vendedores) {
        let venta = 0;
        let tickets = 0;

        try {
            let respuesta = await fetch(`${URL_API}?vendedor=${encodeURIComponent(v.nombre)}`);
            let resultado = await respuesta.json();
            venta = parseFloat(resultado.ventas) || 0;
            tickets = parseInt(resultado.tiquetes) || 0;
        } catch (e) {
            console.error(`Error cargando a ${v.nombre}:`, e);
        }

        acumuladoGlobal += venta;
        let faltante = v.metaVenta - venta;
        if(faltante < 0) faltante = 0;

        let card = document.createElement('div');
        card.className = 'card-vendedor';
        card.innerHTML = `
            <h3>👤 ${v.nombre}</h3>
            <div class="dato-fila"><span>Venta Acumulada:</span> <strong style="color: #4CAF50;">Q${venta.toFixed(2)}</strong></div>
            <div class="dato-fila"><span>Meta Individual:</span> <span>Q${v.metaVenta.toFixed(2)}</span></div>
            <div class="dato-fila"><span>Faltante:</span> <span style="color: #ff5252;">Q${faltante.toFixed(2)}</span></div>
            <div class="dato-fila"><span>Tickets Emitidos:</span> <strong>${tickets} / ${v.metaTickets}</strong></div>
        `;
        contenedor.appendChild(card);
    }

    document.getElementById('totalGeneral').innerText = `Q${acumuladoGlobal.toFixed(2)}`;
}

window.onload = cargarPanel;
</script>

</body>
</html>
