<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }
        .header {
            text-align: center;
            padding: 10px 0 20px 0;
            border-bottom: 2px solid #222;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #e67e22;
            font-size: 1.3em;
            margin: 0;
        }
        .vendedor-card {
            background-color: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .vendedor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .vendedor-nombre {
            font-weight: bold;
            color: #f39c12;
            font-size: 1.1em;
        }
        .btn-borrar {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
        }
        .ticket-box {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .ticket-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 6px;
        }
        .ticket-cliente {
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 6px;
            font-size: 0.9em;
        }
        .ticket-detalle {
            font-size: 0.85em;
            color: #ddd;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .ticket-total {
            text-align: right;
            font-weight: bold;
            color: #2ecc71;
            font-size: 1em;
            border-top: 1px dashed #444;
            padding-top: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 PANEL DE ADMINISTRACIÓN - DIPROSA</h1>
    </div>

    <div id="vendedores-container">
        <!-- Vendedores montados dinámicamente -->
    </div>

    <script>
        const vendedores = ['ESTUARDO', 'CRISTIAN', 'JORGE', 'ELEAZAR'];

        function renderizarPanel() {
            const container = document.getElementById('vendedores-container');
            container.innerHTML = '';

            vendedores.forEach(v => {
                let html = `
                    <div class="vendedor-card">
                        <div class="vendedor-header">
                            <span class="vendedor-nombre">👤 Vendedor: ${v}</span>
                            <button class="btn-borrar" onclick="borrarHistorial('${v}')">Borrar Historial</button>
                        </div>
                        <div id="tickets-${v}">
                            <p style="color:#777; font-size:0.85em;">Esperando reportes del día...</p>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function borrarHistorial(vendedor) {
            if (confirm(`¿Desea borrar el historial de ventas acumulado para ${vendedor}?`)) {
                localStorage.removeItem(`ventas_${vendedor}`);
                renderizarPanel();
            }
        }

        renderizarPanel();
            </script>
</body>
</html>
