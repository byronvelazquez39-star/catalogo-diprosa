<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DIPROSA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 12px; }
        h1 { text-align: center; color: #ff9800; font-size: 16px; margin: 5px 0 12px 0; }
        
        /* Banner de Total General Limpio */
        .total-banner {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-bottom: 12px;
        }
        .total-banner h2 { margin: 0; font-size: 13px; color: #aaa; text-transform: uppercase; }
        .total-banner .amount { font-size: 22px; font-weight: bold; color: #4CAF50; margin-top: 2px; }

        /* Botón de Limpiar / Reiniciar Día */
        .actions-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .btn-clear { background-color: #d32f2f; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }

        /* Secciones por Vendedor */
        .vendedor-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .vendedor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .vendedor-header h3 { margin: 0; font-size: 14px; color: #ff9800; }
        .vendedor-total { font-size: 13px; font-weight: bold; color: #4CAF50; }

        /* Tiquetes Individuales */
        .ticket-card {
            background-color: #242424;
            border-left: 3px solid #ff9800;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .ticket-header { display: flex; justify-content: space-between; color: #ff9800; font-weight: bold; margin-bottom: 4px; }
        .ticket-items { color: #ccc; margin-bottom: 6px; line-height: 1.3; }
        .ticket-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #3a3a3a; padding-top: 4px; }
        .ticket-total { font-weight: bold; color: #4CAF50; }
        .btn-delete { background-color: #b71c1c; color: #fff; border: none; padding: 3px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; }
        
        .no-data { font-style: italic; color: #666; font-size: 12px; }
    </style>
</head>
<body onload="cargarPanel()">

    <h1>📊 Panel de Administración DIPROSA</h1>

    <!-- Resumen Acumulado -->
    <div class="total-banner">
        <h2>Ventas Totales Acumuladas</h2>
        <div class="amount" id="grandTotal">Q 0.00</div>
    </div>

    <div class="actions-bar">
        <button class="btn-clear" onclick="limpiarTodo()">🗑️ Reiniciar Registro del Día</button>
    </div>

    <!-- Contenedor de Vendedores -->
    <div id="vendedoresContainer"></div>

    <script>
        const vendedores = ['cristian', 'jorge', 'eleazar', 'estuardo'];

        function cargarPanel() {
            const container = document.getElementById('vendedoresContainer');
            container.innerHTML = '';
            let granTotal = 0;

            vendedores.forEach(vendedor => {
                const key = `diprosa_tickets_${vendedor}`;
                const tiquetes = JSON.parse(localStorage.getItem(key)) || [];
                
                let totalVendedor = 0;
                let htmlTiquetes = '';

                if (tiquetes.length === 0) {
                    htmlTiquetes = `<div class="no-data">No hay tiquetes registrados aún.</div>`;
                } else {
                    tiquetes.forEach((t, index) => {
                        totalVendedor += t.total;
                        
                        let detalleItems = t.items.map(i => `- ${i.name} (x${i.qty}) : Q ${(i.price * i.qty).toFixed(2)}`).join('<br>');

                        htmlTiquetes += `
                            <div class="ticket-card">
                                <div class="ticket-header">
                                    <span>Tiquete #${index + 1} (${t.cliente})</span>
                                    <span style="color:#aaa; font-weight:normal;">${t.fecha}</span>
                                </div>
                                <div class="ticket-items">${detalleItems}</div>
                                <div class="ticket-footer">
                                    <span class="ticket-total">Total: Q ${t.total.toFixed(2)}</span>
                                    <button class="btn-delete" onclick="eliminarTiquete('${vendedor}', ${index})">🗑️ Eliminar</button>
                                </div>
                            </div>
                        `;
                    });
                }

                granTotal += totalVendedor;

                const nombreCapitalizado = vendedor.charAt(0).toUpperCase() + vendedor.slice(1);

                container.innerHTML += `
                    <div class="vendedor-card">
                        <div class="vendedor-header">
                            <h3>👤 ${nombreCapitalizado}</h3>
                            <span class="vendedor-total">Total: Q ${totalVendedor.toFixed(2)}</span>
                        </div>
                        ${htmlTiquetes}
                    </div>
                `;
            });

            document.getElementById('grandTotal').innerText = `Q ${granTotal.toFixed(2)}`;
        }

        function eliminarTiquete(vendedor, index) {
            if (confirm("¿Desea eliminar este tiquete del registro?")) {
                const key = `diprosa_tickets_${vendedor}`;
                let tiquetes = JSON.parse(localStorage.getItem(key)) || [];
                tiquetes.splice(index, 1);
                localStorage.setItem(key, JSON.stringify(tiquetes));
                cargarPanel();
            }
        }

        function limpiarTodo() {
            if (confirm("⚠️ ¿Está seguro de borrar TODOS los tiquetes del día? Esta acción no se puede deshacer.")) {
                vendedores.forEach(vendedor => {
                    localStorage.removeItem(`diprosa_tickets_${vendedor}`);
                });
                cargarPanel();
            }
        }
    </script>
</body>
</html>
