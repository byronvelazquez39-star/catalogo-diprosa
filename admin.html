<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DIPROSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }
        .header {
            text-align: center;
            padding: 10px 0 15px 0;
            border-bottom: 2px solid #222;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #ff9800;
            margin: 0;
            font-size: 1.4em;
        }
        .status-badge {
            display: inline-block;
            background-color: #1e1e1e;
            color: #2ecc71;
            border: 1px solid #2ecc71;
            font-size: 0.8em;
            padding: 3px 10px;
            border-radius: 12px;
            margin-top: 6px;
            font-weight: bold;
        }
        .grid-vendedores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card-vendedor {
            background-color: #161616;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .vendedor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .vendedor-nombre {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff9800;
        }
        .vendedor-total {
            font-size: 1em;
            font-weight: bold;
            color: #2ecc71;
            background-color: #0e2a14;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .ticket-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ticket-item {
            background-color: #222222;
            border-left: 4px solid #ff9800;
            border-radius: 4px;
            padding: 8px;
            font-size: 0.85em;
        }
        .ticket-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 0.8em;
            margin-bottom: 4px;
        }
        .ticket-cliente {
            font-weight: bold;
            color: #fff;
        }
        .ticket-detalle {
            color: #ddd;
            margin: 4px 0;
            word-break: break-word;
        }
        .ticket-monto {
            text-align: right;
            font-weight: bold;
            color: #2ecc71;
        }
        .sin-pedidos {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 ADMIN - DIPROSA</h1>
        <div class="status-badge">● Tiempo Real Activo</div>
    </div>

    <div class="grid-vendedores">
        <!-- CRISTIAN -->
        <div
